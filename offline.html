<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Офлайн – Clocky</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%);
    padding: 20px;
    color: #1e1b4b;
  }
  .card {
    background: #fff;
    border-radius: 24px;
    padding: 48px 32px;
    text-align: center;
    max-width: 400px;
    width: 100%;
    box-shadow: 0 24px 70px rgba(0,0,0,0.25);
  }
  .icon { font-size: 72px; margin-bottom: 20px; }
  h1 { color: #7c3aed; font-size: 26px; margin-bottom: 12px; }
  p { color: #6b7280; font-size: 15px; line-height: 1.6; margin-bottom: 24px; }
  button {
    background: #7c3aed;
    color: #fff;
    border: none;
    padding: 14px 32px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
    width: 100%;
  }
  button:hover { background: #6d28d9; transform: translateY(-1px); }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    background: #fef2f2;
    color: #dc2626;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 20px;
  }
  .status.online { background: #dcfce7; color: #15803d; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <div id="status" class="status"><span class="dot"></span> Офлайн режим</div>
    <h1>Няма връзка</h1>
    <p>Не можете да се свържете с интернет. Проверете връзката си и опитайте отново.</p>
    <button onclick="location.reload()">🔄 Опитай отново</button>
  </div>
  <script>
    function updateStatus() {
      const el = document.getElementById('status');
      if (navigator.onLine) {
        el.className = 'status online';
        el.innerHTML = '<span class="dot"></span> Свързан';
        setTimeout(() => location.reload(), 800);
      } else {
        el.className = 'status';
        el.innerHTML = '<span class="dot"></span> Офлайн режим';
      }
    }
    window.addEventListener('online', updateStatus);
    window.addEventListener('offline', updateStatus);
    updateStatus();
  </script>
</body>
</html>
