<script>
window.onerror = function(msg, url, line, col, err) {
  var errDiv = document.getElementById('startup-error');
  if (errDiv) {
    errDiv.style.display = 'block';
    errDiv.innerHTML = '<h2>⚠️ Грешка при зареждане</h2>' +
      '<p><b>Съобщение:</b> ' + msg + '</p>' +
      '<p><b>Ред:</b> ' + line + ':' + col + '</p>' +
      '<pre>' + (err && err.stack ? err.stack : 'Няма stack trace') + '</pre>' +
      '<button onclick="location.reload()" style="padding:10px 20px;background:#7c3aed;color:#fff;border:none;border-radius:8px;cursor:pointer;">Презареди</button>';
  }
  return false;
};
window.addEventListener('unhandledrejection', function(e) { console.error('Unhandled:', e.reason); });

let newWorker = null;
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js', { scope: '/' })
      .then((reg) => {
        reg.addEventListener('updatefound', () => {
          newWorker = reg.installing;
          newWorker.addEventListener('statechange', () => {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              const b = document.getElementById('update-banner');
              if (b) b.classList.add('visible');
            }
          });
        });
        setInterval(() => reg.update(), 3600000);
      }).catch(() => {});
  });
  let refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!refreshing) { refreshing = true; window.location.reload(); }
  });
}
window.updateApp = function() {
  if (newWorker) newWorker.postMessage('SKIP_WAITING');
  else window.location.reload();
};
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault(); deferredPrompt = e;
  const btn = document.getElementById('sidebar-install-btn');
  if (btn) btn.classList.add('visible');
});
window.addEventListener('appinstalled', () => {
  deferredPrompt = null;
  const btn = document.getElementById('sidebar-install-btn');
  if (btn) btn.classList.remove('visible');
});
window.installPWA = async function() {
  if (!deferredPrompt) return alert('Вече е инсталирано или браузърът не поддържа.');
  deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null;
};
function updateOnlineStatus() {
  const b = document.getElementById('offline-banner');
  if (!b) return;
  if (navigator.onLine) b.classList.remove('visible');
  else b.classList.add('visible');
}
window.addEventListener('online', updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);
updateOnlineStatus();
let lastTouchEnd = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });
console.log('🚀 Startup loaded');
</script>

let cachedFontBase64 = null;
async function loadCyrillicFont() {
  if (cachedFontBase64) return cachedFontBase64;
  const res = await fetch('https://cdn.jsdelivr.net/gh/googlefonts/roboto@main/src/hinted/Roboto-Regular.ttf');
  if (!res.ok) throw new Error('Font error');
  const buf = await res.arrayBuffer();
  let binary = '';
  const bytes = new Uint8Array(buf);
  for (let i = 0; i < bytes.length; i += 0x8000) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  }
  cachedFontBase64 = btoa(binary);
  return cachedFontBase64;
}

const AuthContext = createContext(null);
const useAuth = () => useContext(AuthContext);

function AuthProvider({ children }) {
  const [currentUser, setCurrentUser] = useState(null);
  const [users, setUsers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [dbError, setDbError] = useState(null);
  const seededRef = useRef(false);

  useEffect(() => {
    const stored = localStorage.getItem('clocky_user');
    if (stored) { try { setCurrentUser(JSON.parse(stored)); } catch (e) {} }
    if (!firebaseReady || !db) {
      setLoading(false);
      setDbError('Няма връзка с Firebase');
      return;
    }
    const ref = db.ref('users');
    let resolved = false;
    const handler = function(snap) {
      resolved = true;
      const list = Object.values(snap.val() || {});
      setUsers(list);
      setLoading(false);
      setDbError(null);
      if (list.length === 0 && !seededRef.current) {
        seededRef.current = true;
        const admin = {
          id: uid(), username: 'admin', password: 'admin123',
          fullName: 'Администратор', email: 'admin@clocky.com',
          roles: ['admin', 'director'],
          totalLeaveDays: 25, usedLeaveDays: 0,
          createdAt: new Date().toISOString()
        };
        db.ref('users/' + admin.id).set(admin).catch(function(e) { console.error(e); });
      }
      const storedNow = localStorage.getItem('clocky_user');
      if (storedNow) {
        try {
          const u = JSON.parse(storedNow);
          const fresh = list.find(function(x) { return x.id === u.id; });
          if (fresh) {
            setCurrentUser(fresh);
            localStorage.setItem('clocky_user', JSON.stringify(fresh));
          } else {
            setCurrentUser(null);
            localStorage.removeItem('clocky_user');
          }
        } catch (e) {}
      }
    };
    const errorHandler = function(err) {
      resolved = true;
      setDbError('Грешка: ' + err.message);
      setLoading(false);
    };
    ref.on('value', handler, errorHandler);
    const tId = setTimeout(function() {
      if (!resolved) { setLoading(false); setDbError('Връзката се бави...'); }
    }, 8000);
    return function() { clearTimeout(tId); ref.off('value', handler); };
  }, []);

  useEffect(() => {
    if (!firebaseReady || !db) return;
    db.ref('leaveTypes').once('value').then(function(snap) {
      if (!snap.exists()) db.ref('leaveTypes').set(DEFAULT_LEAVE_TYPES).catch(function() {});
    }).catch(function() {});
    db.ref('company').once('value').then(function(snap) {
      if (!snap.exists()) db.ref('company').set(DEFAULT_COMPANY).catch(function() {});
    }).catch(function() {});
    db.ref('holidays').once('value').then(function(snap) {
      if (!snap.exists()) {
        const year = new Date().getFullYear();
        const seeded = {};
        Object.keys(DEFAULT_HOLIDAYS).forEach(function(md) {
          const parts = md.split('-');
          const id = uid();
          seeded[id] = { id: id, name: DEFAULT_HOLIDAYS[md].name, date: year + '-' + parts[0] + '-' + parts[1], createdAt: new Date().toISOString() };
        });
        db.ref('holidays').set(seeded).catch(function() {});
      }
    }).catch(function() {});
  }, []);

  const login = function(username, password) {
    if (!firebaseReady) return { error: 'Няма връзка' };
    if (users.length === 0) return { error: 'Базата се зарежда...' };
    const u = users.find(function(x) { return x.username === username.trim() && x.password === password; });
    if (!u) return { error: 'Грешно име или парола' };
    setCurrentUser(u);
    localStorage.setItem('clocky_user', JSON.stringify(u));
    return { success: true, user: u };
  };
  const logout = function() {
    setCurrentUser(null);
    localStorage.removeItem('clocky_user');
  };
  const addUser = async function(data) {
    if (users.find(function(u) { return u.username === data.username; })) return { error: 'Съществува' };
    const nu = Object.assign({}, data, { id: uid(), usedLeaveDays: 0, createdAt: new Date().toISOString() });
    try { await db.ref('users/' + nu.id).set(nu); return { success: true }; }
    catch (e) { return { error: e.message }; }
  };
  const updateUser = async function(id, data) {
    try { await db.ref('users/' + id).update(data); return { success: true }; }
    catch (e) { return { error: e.message }; }
  };
  const deleteUser = async function(id) {
    try { await db.ref('users/' + id).remove(); return { success: true }; }
    catch (e) { return { error: e.message }; }
  };

  return (
    <AuthContext.Provider value={{
      currentUser: currentUser, users: users, loading: loading, dbError: dbError,
      login: login, logout: logout, addUser: addUser, updateUser: updateUser, deleteUser: deleteUser
    }}>{children}</AuthContext.Provider>
  );
}

// ================================================================
// HOOKS
// ================================================================
function useFirebaseList(path) {
  const [data, setData] = useState([]);
  useEffect(function() {
    if (!db || !path) return;
    const ref = db.ref(path);
    const h = function(snap) { setData(Object.values(snap.val() || {})); };
    ref.on('value', h);
    return function() { ref.off('value', h); };
  }, [path]);
  return data;
}
function useFirebaseObject(path, def) {
  const [data, setData] = useState(def);
  useEffect(function() {
    if (!db || !path) return;
    const ref = db.ref(path);
    const h = function(snap) { setData(snap.val() || def); };
    ref.on('value', h);
    return function() { ref.off('value', h); };
  }, [path]);
  return data;
}
function useHolidaysMap() {
  const list = useFirebaseList('holidays');
  return useMemo(function() {
    const m = {};
    list.forEach(function(h) { if (h.date) m[h.date] = h; });
    return m;
  }, [list]);
}

function Login() {

  const [username, setUsername] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [showPass, setShowPass] = useState(false);
  const submit = function(e) {
    e.preventDefault(); setError('');

    if (res.error) setError(res.error);
  };
  return (
    <div className="login-wrap">
      <div className="login-card">
        <h1>⏰ Clocky</h1>
        <p className="sub">Система за отпуски и време</p>

          <React.Fragment>
            {error && <div className="error">{error}</div>}
            <form onSubmit={submit}>
              <div className="form-group">
                <label>Потребителско име</label>

                <label>Парола</label>
                <div style={{position:'relative'}}>
                  <input type={showPass ? 'text' : 'password'} value={password} onChange={function(e) { setPassword(e.target.value); }} />
                  <button type="button" onClick={function() { setShowPass(!showPass); }}
                    style={{position:'absolute', right:'10px', top:'50%', transform:'translateY(-50%)', background:'none', border:'none', cursor:'pointer', fontSize:'16px'}}>
                    {showPass ? '🙈' : '👁️'}

function LeaveRequestModal({ onClose, forUserId }) {
  const { currentUser, users } = useAuth();
  const leaveTypes = useFirebaseObject('leaveTypes', DEFAULT_LEAVE_TYPES);
  const holidays = useHolidaysMap();
  const isAdmin = isAdminUser(currentUser);
  const [targetUserId, setTargetUserId] = useState(forUserId || currentUser.id);
  const [form, setForm] = useState({ startDate: '', endDate: '', reason: '', type: 'paid' });
  const [attachment, setAttachment] = useState(null);
  const [attachmentError, setAttachmentError] = useState('');
  const [error, setError] = useState('');
  const [submitting, setSubmitting] = useState(false);
  const fileInputRef = useRef(null);

  const targetUser = users.find(function(u) { return u.id === targetUserId; }) || currentUser;
  const sick = isSickLeave(form.type, leaveTypes);
  const minAllowedDate = isAdmin || sick ? '' : getMinAllowedDateForEmployee();
  const remaining = (targetUser.totalLeaveDays || 0) - (targetUser.usedLeaveDays || 0);
  const days = form.startDate && form.endDate ? daysBetween(form.startDate, form.endDate) : 0;
  const workingDays = form.startDate && form.endDate ? calcWorkingDays(form.startDate, form.endDate, holidays) : 0;
  const selType = leaveTypes[form.type];
  const willDeduct = selType && selType.deducts;

  const handleFileChange = async function(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setAttachmentError('');
    if (file.size > 1048576) return setAttachmentError('Макс. 1MB');
    if (file.type.indexOf('image/') !== 0) return setAttachmentError('Само изображения');
    try { setAttachment({ name: file.name, dataUrl: await readFileAsDataURL(file) }); }
    catch (e) { setAttachmentError('Грешка'); }
  };

  const submit = async function(e) {
    e.preventDefault(); setError('');
    if (!form.startDate || !form.endDate) return setError('Изберете дати');
    if (form.endDate < form.startDate) return setError('Крайната дата трябва да е след началната');
    if (!isAdmin && !sick && minAllowedDate && form.startDate < minAllowedDate) return setError('Не може преди ' + formatDate(minAllowedDate));
    if (!form.reason.trim()) return setError('Причината е задължителна');
    if (willDeduct && workingDays > remaining) return setError('Няма достатъчно дни (остават ' + remaining + ')');
    if (sick && !attachment) return setError('Задължителен скрийншот');
    setSubmitting(true);
    const req = {
      id: uid(), userId: targetUser.id, userName: targetUser.fullName,
      startDate: form.startDate, endDate: form.endDate,
      days: workingDays, calendarDays: days, reason: form.reason.trim(),
      type: form.type, status: 'pending', createdAt: new Date().toISOString(),
      createdBy: currentUser.id,
      attachment: attachment ? attachment.dataUrl : null
    };
    try { await db.ref('leaveRequests/' + req.id).set(req); onClose(); }
    catch (err) { setError('Грешка: ' + err.message); setSubmitting(false); }
  };

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" onClick={function(e) { e.stopPropagation(); }}>
        <h3>📝 Нова заявка</h3>
        {error && <div className="error">{error}</div>}
        {isAdmin && (
          <div className="form-group">
            <label>За кого? *</label>
            <select value={targetUserId} onChange={function(e) { setTargetUserId(e.target.value); }}>
              <option value={currentUser.id}>{currentUser.fullName} (аз)</option>
              {users.filter(function(u) { return u.id !== currentUser.id; }).map(function(u) {
                return <option key={u.id} value={u.id}>{u.fullName}</option>;
              })}
            </select>
          </div>
        )}
        {!isAdmin && !sick && minAllowedDate && (
          <div className="info-box">ℹ️ Можете от <b>{formatDate(minAllowedDate)}</b> нататък</div>
        )}
        <form onSubmit={submit}>
          <div className="form-group">
            <label>Вид</label>
            <select value={form.type} onChange={function(e) { setForm(Object.assign({}, form, { type: e.target.value })); }}>
              {Object.values(leaveTypes).map(function(t) {
                return <option key={t.id} value={t.id}>{t.name}{t.deducts ? ' (приспада)' : ''}</option>;
              })}
            </select>
          </div>
          <div className="form-row">
            <div className="form-group"><label>От *</label>
              <input type="date" value={form.startDate} onChange={function(e) { setForm(Object.assign({}, form, { startDate: e.target.value })); }} required />
            </div>
            <div className="form-group"><label>До *</label>
              <input type="date" value={form.endDate} min={form.startDate} onChange={function(e) { setForm(Object.assign({}, form, { endDate: e.target.value })); }} required />
            </div>
          </div>
          {days > 0 && (
            <div className="warning-box">
              <div><b>Календарни:</b> {days}</div>
              <div><b>Работни:</b> {workingDays}</div>
            </div>
          )}
          <div className="form-group">
            <label>Причина *</label>
            <textarea value={form.reason} onChange={function(e) { setForm(Object.assign({}, form, { reason: e.target.value })); }} rows="3" required />
          </div>
          {sick && (
            <div className="form-group">
              <label>📎 Скрийншот *</label>
              {attachmentError && <div className="error">{attachmentError}</div>}
              {!attachment ? (
                <div className="upload-box" onClick={function() { fileInputRef.current && fileInputRef.current.click(); }}>
                  <div className="upload-icon">📤</div>
                  <div className="upload-text">Кликнете за избор</div>
                </div>
              ) : (
                <div className="upload-box has-file">
                  <img src={attachment.dataUrl} alt="" className="upload-preview" />
                  <div className="upload-file-info">
                    <span>✅ {attachment.name}</span>
                    <button type="button" onClick={function() { setAttachment(null); }} style={{background:'none', border:'none', color:'#dc2626', cursor:'pointer', fontWeight:'bold'}}>✕</button>
                  </div>
                </div>
              )}
              <input ref={fileInputRef} type="file" accept="image/*" onChange={handleFileChange} style={{display:'none'}} />
            </div>
          )}
          <div className="flex gap-2">
            <button type="submit" className="btn btn-primary" disabled={submitting}>{submitting ? '⏳' : 'Изпрати'}</button>
            <button type="button" className="btn btn-secondary" onClick={onClose}>Отказ</button>
          </div>
        </form>
      </div>
    </div>
  );
}

    return (u && u.fullName) || fb || '?';
  };
  const getType = function(id) { return leaveTypes[id] || { name: 'Отпуск', color: '#7c3aed', deducts: true }; };

  const approve = async function(r) {
    await db.ref('leaveRequests/' + r.id).update({ status: 'approved', reviewedBy: currentUser.id, reviewedAt: new Date().toISOString() });
    const t = getType(r.type);
    if (t.deducts) {
      const u = users.find(function(x) { return x.id === r.userId; });
      if (u) await updateUser(u.id, { usedLeaveDays: (u.usedLeaveDays || 0) + r.days });
    }
    setSelectedRequest(null);
  };
  const reject = async function(r) {
    await db.ref('leaveRequests/' + r.id).update({ status: 'rejected', reviewedBy: currentUser.id, reviewedAt: new Date().toISOString() });
    setSelectedRequest(null);
  };
  const deleteRequest = async function(r) {
    const t = getType(r.type);
    if (r.status === 'approved' && t.deducts) {
      const u = users.find(function(x) { return x.id === r.userId; });
      if (u) await updateUser(u.id, { usedLeaveDays: Math.max(0, (u.usedLeaveDays || 0) - r.days) });
    }
    await db.ref('leaveRequests/' + r.id).remove();
    setSelectedRequest(null);
  };

  const visible = filter === 'all' ? requests : requests.filter(function(r) { return r.status === filter; });
  const sorted = visible.slice().sort(function(a, b) { return new Date(b.createdAt) - new Date(a.createdAt); });
  const statusText = { pending: 'Чакаща', approved: 'Одобрена', rejected: 'Отхвърлена' };

  return (
    <div className="animate-in">
      <PageHeader title="Заявки за отпуск" onAdd={function() { setShowModal(true); }} addLabel="Нова заявка" />
      <div className="stats-grid">
        <div className="stat-card warning"><div className="label">Чакащи</div><div className="value">{requests.filter(function(r){return r.status==='pending';}).length}</div></div>
        <div className="stat-card success"><div className="label">Одобрени</div><div className="value">{requests.filter(function(r){return r.status==='approved';}).length}</div></div>
        <div className="stat-card danger"><div className="label">Отхвърлени</div><div className="value">{requests.filter(function(r){return r.status==='rejected';}).length}</div></div>
      </div>
      <div className="flex gap-2" style={{marginBottom:'16px', flexWrap:'wrap'}}>
        {['pending','approved','rejected','all'].map(function(f) {
          return (
            <button key={f} className={'btn btn-sm ' + (filter === f ? 'btn-primary' : 'btn-secondary')} onClick={function(){ setFilter(f); }}>
              {f === 'pending' ? 'Чакащи' : f === 'approved' ? 'Одобрени' : f === 'rejected' ? 'Отхвърлени' : 'Всички'}
            </button>
          );
        })}
      </div>
      <div className="card">
        {sorted.length === 0 ? <div className="empty-state">Няма заявки</div> : (
          <div style={{overflowX:'auto'}}>
            <table>
              <thead><tr><th>Служител</th><th>Вид</th><th>От</th><th>До</th><th>Дни</th><th>Статус</th></tr></thead>
              <tbody>
                {sorted.map(function(r) {
                  const t = getType(r.type);
                  return (
                    <tr key={r.id} className="clickable" onClick={function(){ setSelectedRequest(r); }}>
                      <td>{getUserName(r.userId, r.userName)}</td>
                      <td>{t.name}</td><td>{formatDate(r.startDate)}</td><td>{formatDate(r.endDate)}</td>
                      <td>{r.days}</td><td><span className={'badge ' + r.status}>{statusText[r.status]}</span></td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </div>
      {showModal && <LeaveRequestModal onClose={function(){ setShowModal(false); }} />}
      {selectedRequest && (
        <LeaveDetailModal request={selectedRequest} leaveType={getType(selectedRequest.type)}
          onClose={function(){ setSelectedRequest(null); }} companyName={company && company.name}
          isAdmin={isAdmin} onDelete={deleteRequest} onApprove={approve} onReject={reject} />
      )}
    </div>
  );
}

function CalendarPage() {
  const { users, currentUser } = useAuth();
  const requests = useFirebaseList('leaveRequests');
  const leaveTypes = useFirebaseObject('leaveTypes', DEFAULT_LEAVE_TYPES);
  const company = useFirebaseObject('company', DEFAULT_COMPANY);
  const holidays = useHolidaysMap();
  const [month, setMonth] = useState(new Date());
  const [selected, setSelected] = useState(null);
  const [showModal, setShowModal] = useState(false);
  const [dayModalDate, setDayModalDate] = useState(null);

  const year = month.getFullYear();
  const m = month.getMonth();
  const firstDay = new Date(year, m, 1);
  const startWeekday = (firstDay.getDay() + 6) % 7;
  const daysInMonth = new Date(year, m + 1, 0).getDate();
  const days = [];
  for (let i = 0; i < startWeekday; i++) days.push(null);
  for (let d = 1; d <= daysInMonth; d++) days.push(d);
  const dayNames = ['Пн','Вт','Ср','Чт','Пт','Сб','Нд'];
  const getUserName = function(id, fb) {
    const u = users.find(function(x){ return x.id === id; });
    return (u && u.fullName) || fb || '?';
  };
  const getType = function(id) { return leaveTypes[id] || { name: 'Отпуск', color: '#7c3aed' }; };
  const isAdmin = isAdminUser(currentUser);

  const getEventsForDay = function(day) {
    if (!day) return [];
    const ds = year + '-' + pad(m + 1) + '-' + pad(day);
    return requests.filter(function(r) { return ds >= r.startDate && ds <= r.endDate; });
  };
  const todayStr = todayISO();
  const dayModalEvents = dayModalDate ? requests.filter(function(r) { return dayModalDate >= r.startDate && dayModalDate <= r.endDate; }) : [];
  const dayModalHoliday = dayModalDate ? holidays[dayModalDate] : null;
  const statusLabels = { pending: 'Чакаща', approved: 'Одобрена', rejected: 'Отхвърлена' };

  return (
    <div className="animate-in">
      <PageHeader title="Календар" subtitle="Кликнете на дата" onAdd={function(){ setShowModal(true); }} addLabel="Нова заявка" />
      <div className="card">
        <div className="calendar-header">
          <h3>{monthNames[m]} {year}</h3>
          <div className="calendar-nav">
            <button className="btn btn-secondary btn-sm" onClick={function(){ setMonth(new Date(year, m - 1, 1)); }}>←</button>
            <button className="btn btn-secondary btn-sm" onClick={function(){ setMonth(new Date()); }}>Днес</button>
            <button className="btn btn-secondary btn-sm" onClick={function(){ setMonth(new Date(year, m + 1, 1)); }}>→</button>
          </div>
        </div>
        <div className="calendar-grid">
          {dayNames.map(function(d) { return <div key={d} className="calendar-day-name">{d}</div>; })}
          {days.map(function(day, idx) {
            const ds = day ? year + '-' + pad(m + 1) + '-' + pad(day) : '';
            const hol = isHoliday(ds, holidays);
            const holInfo = holidays[ds];
            const events = getEventsForDay(day);
            return (
              <div key={idx} className={'calendar-day ' + (!day ? 'empty ' : '') + (ds === todayStr ? 'today ' : '') + (hol ? 'holiday' : '')}
                onClick={function(){ if (day) setDayModalDate(ds); }} style={{cursor: day ? 'pointer' : 'default'}}>
                {day && <div className="day-num">{day}</div>}
                {holInfo && <div className="holiday-tag" title={holInfo.name}>🎉 {holInfo.name}</div>}
                {events.slice(0, 2).map(function(e) {
                  const t = getType(e.type);
                  return (
                    <div key={e.id} className="day-event" style={{background: t.color, opacity: e.status === 'pending' ? 0.5 : 1}}
                      onClick={function(ev){ ev.stopPropagation(); setSelected(e); }}>
                      {getUserName(e.userId, e.userName).split(' ')[0]}
                    </div>
                  );
                })}
              </div>
            );
          })}
        </div>
      </div>
      {dayModalDate && (
        <div className="modal-backdrop" onClick={function(){ setDayModalDate(null); }}>
          <div className="modal" onClick={function(e){ e.stopPropagation(); }}>
            <h3>📅 {formatDate(dayModalDate)}</h3>
            {dayModalHoliday && <div className="danger-box">🎉 {dayModalHoliday.name}</div>}
            {dayModalEvents.length === 0 ? <div className="empty-state">Няма отпуски</div> : (
              dayModalEvents.map(function(e) {
                const t = getType(e.type);
                return (
                  <div key={e.id} onClick={function(){ setSelected(e); setDayModalDate(null); }}
                    style={{padding:'12px', background:'#faf5ff', borderRadius:'10px', marginBottom:'8px', cursor:'pointer', borderLeft:'4px solid ' + t.color}}>
                    <div style={{fontWeight:600}}>{getUserName(e.userId, e.userName)}</div>
                    <div style={{fontSize:'12px', color:'#7c3aed'}}>{t.name} • {formatDate(e.startDate)} – {formatDate(e.endDate)}</div>
                    <span className={'badge ' + e.status}>{statusLabels[e.status]}</span>
                  </div>
                );
              })
            )}
            <div style={{marginTop:'16px', display:'flex', justifyContent:'flex-end'}}>
              <button className="btn btn-secondary" onClick={function(){ setDayModalDate(null); }}>Затвори</button>
            </div>
          </div>
        </div>
      )}
      {selected && <LeaveDetailModal request={selected} leaveType={getType(selected.type)}
        onClose={function(){ setSelected(null); }} companyName={company && company.name}
        isAdmin={isAdmin} onDelete={function(){}} onApprove={function(){}} onReject={function(){}} />}
      {showModal && <LeaveRequestModal onClose={function(){ setShowModal(false); }} />}
    </div>
  );
}

function DocumentsPage() {
  const { currentUser, users } = useAuth();
  const documents = useFirebaseList('documents');
  const isAdmin = isAdminUser(currentUser);
  const [showModal, setShowModal] = useState(false);
  const [filterUser, setFilterUser] = useState('all');
  const [filterCategory, setFilterCategory] = useState('all');
  const [searchQuery, setSearchQuery] = useState('');
  const [previewDoc, setPreviewDoc] = useState(null);
  const [form, setForm] = useState({ userId: '', name: '', category: 'other', file: null, fileName: '', fileType: '' });
  const [formError, setFormError] = useState('');
  const [submitting, setSubmitting] = useState(false);
  const fileInputRef = useRef(null);

  const getCategory = function(id) { return DOC_CATEGORIES[id] || DOC_CATEGORIES.other; };
  const getUserName = function(id) {
    const u = users.find(function(x){ return x.id === id; });
    return (u && u.fullName) || '?';
  };

  let visibleDocs = isAdmin ? documents : documents.filter(function(d){ return d.userId === currentUser.id; });
  if (filterUser !== 'all') visibleDocs = visibleDocs.filter(function(d){ return d.userId === filterUser; });
  if (filterCategory !== 'all') visibleDocs = visibleDocs.filter(function(d){ return d.category === filterCategory; });
  if (searchQuery.trim()) {
    const q = searchQuery.toLowerCase();
    visibleDocs = visibleDocs.filter(function(d){ return (d.name || '').toLowerCase().indexOf(q) !== -1; });
  }
  visibleDocs = visibleDocs.slice().sort(function(a, b){ return new Date(b.createdAt) - new Date(a.createdAt); });

  const handleFileChange = async function(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setFormError('');
    if (file.size > 1048576) return setFormError('Макс. 1MB');
    try {
      const dataUrl = await readFileAsDataURL(file);
      setForm(function(f){ return Object.assign({}, f, { file: dataUrl, fileName: file.name, fileType: file.type }); });
    } catch (err) { setFormError('Грешка'); }
  };

  const submit = async function(e) {
    e.preventDefault(); setFormError('');
    if (!form.userId || !form.name.trim() || !form.file) return setFormError('Попълнете всички полета');
    setSubmitting(true);
    try {
      const id = uid();
      await db.ref('documents/' + id).set({
        id: id, userId: form.userId, name: form.name.trim(), category: form.category,
        fileName: form.fileName, fileType: form.fileType, file: form.file,
        uploadedBy: currentUser.id, createdAt: new Date().toISOString()
      });
      setForm({ userId: '', name: '', category: 'other', file: null, fileName: '', fileType: '' });
      setShowModal(false);
    } catch (err) { setFormError(err.message); }
    setSubmitting(false);
  };

  const remove = async function(doc) {
    if (isAdmin && confirm('Изтрий "' + doc.name + '"?')) await db.ref('documents/' + doc.id).remove();
  };
  const downloadDoc = function(doc) {
    const link = document.createElement('a');
    link.href = doc.file; link.download = doc.fileName || doc.name; link.click();
  };
  const isImageDoc = function(doc) { return doc.fileType && doc.fileType.indexOf('image/') === 0; };

  return (
    <div className="animate-in">
      <PageHeader title="Документи" subtitle={visibleDocs.length + ' документа'}
        onAdd={isAdmin ? function(){ setShowModal(true); } : null} addLabel="Качи" />
      <div className="card">
        <div style={{display:'grid', gap:'12px'}}>
          {isAdmin && (
            <div className="form-group" style={{marginBottom:0}}>
              <label>Служител</label>
              <select value={filterUser} onChange={function(e){ setFilterUser(e.target.value); }}>
                <option value="all">Всички</option>
                {users.map(function(u) { return <option key={u.id} value={u.id}>{u.fullName}</option>; })}
              </select>
            </div>
          )}
          <div className="form-group" style={{marginBottom:0}}>
            <label>Категория</label>
            <select value={filterCategory} onChange={function(e){ setFilterCategory(e.target.value); }}>
              <option value="all">Всички</option>
              {Object.keys(DOC_CATEGORIES).map(function(id) {
                return <option key={id} value={id}>{DOC_CATEGORIES[id].icon} {DOC_CATEGORIES[id].name}</option>;
              })}
            </select>
          </div>
          <div className="form-group" style={{marginBottom:0}}>
            <label>Търсене</label>
            <input value={searchQuery} onChange={function(e){ setSearchQuery(e.target.value); }} placeholder="Търсене..." />
          </div>
        </div>
      </div>
      {visibleDocs.length === 0 ? <div className="card"><div className="empty-state">Няма документи</div></div> : (
        <div className="card">
          {visibleDocs.map(function(doc) {
            const cat = getCategory(doc.category);
            return (
              <div key={doc.id} className="doc-card">
                <div className="doc-icon" style={{background: cat.color + '20', color: cat.color}}>{cat.icon}</div>
                <div className="doc-info">
                  <div className="doc-name">{doc.name}</div>
                  <div className="doc-meta">
                    <span style={{color: cat.color}}>{cat.name}</span>
                    {isAdmin && <span>👤 {getUserName(doc.userId)}</span>}
                    <span>📅 {formatDate(doc.createdAt)}</span>
                  </div>
                </div>
                <div className="doc-actions">
                  {isImageDoc(doc) && <button className="btn btn-secondary btn-sm" onClick={function(){ setPreviewDoc(doc); }}>👁️</button>}
                  <button className="btn btn-primary btn-sm" onClick={function(){ downloadDoc(doc); }}>⬇️</button>
                  {isAdmin && <button className="btn btn-danger btn-sm" onClick={function(){ remove(doc); }}>🗑️</button>}
                </div>
              </div>
            );
          })}
        </div>
      )}
      {previewDoc && (
        <div className="modal-backdrop" onClick={function(){ setPreviewDoc(null); }}>
          <div className="modal wide" onClick={function(e){ e.stopPropagation(); }}>
            <h3>{previewDoc.name}</h3>
            <img src={previewDoc.file} style={{maxWidth:'100%', maxHeight:'70vh', borderRadius:'8px'}} />
            <div style={{marginTop:'16px', display:'flex', justifyContent:'flex-end'}}>
              <button className="btn btn-secondary" onClick={function(){ setPreviewDoc(null); }}>Затвори</button>
            </div>
          </div>
        </div>
      )}
      {showModal && isAdmin && (
        <div className="modal-backdrop" onClick={function(){ setShowModal(false); }}>
          <div className="modal" onClick={function(e){ e.stopPropagation(); }}>
            <h3>➕ Качване</h3>
            {formError && <div className="error">{formError}</div>}
            <form onSubmit={submit}>
              <div className="form-group"><label>Служител *</label>
                <select value={form.userId} onChange={function(e){ setForm(Object.assign({}, form, { userId: e.target.value })); }} required>
                  <option value="">-- Изберете --</option>
                  {users.map(function(u) { return <option key={u.id} value={u.id}>{u.fullName}</option>; })}
                </select>
              </div>
              <div className="form-group"><label>Име *</label>
                <input value={form.name} onChange={function(e){ setForm(Object.assign({}, form, { name: e.target.value })); }} required />
              </div>
              <div className="form-group"><label>Категория</label>
                <select value={form.category} onChange={function(e){ setForm(Object.assign({}, form, { category: e.target.value })); }}>
                  {Object.keys(DOC_CATEGORIES).map(function(id) {
                    return <option key={id} value={id}>{DOC_CATEGORIES[id].icon} {DOC_CATEGORIES[id].name}</option>;
                  })}
                </select>
              </div>
              <div className="form-group">
                <label>Файл * (макс. 1MB)</label>
                {!form.file ? (
                  <div className="upload-box" onClick={function(){ fileInputRef.current && fileInputRef.current.click(); }}>
                    <div className="upload-icon">📤</div>
                    <div className="upload-text">Кликнете за избор</div>
                  </div>
                ) : (
                  <div className="upload-box has-file">
                    <div className="upload-file-info">
                      <span>✅ {form.fileName}</span>
                      <button type="button" onClick={function(){ setForm(Object.assign({}, form, { file: null, fileName: '' })); }} style={{background:'none', border:'none', color:'#dc2626', cursor:'pointer'}}>✕</button>
                    </div>
                  </div>
                )}
                <input ref={fileInputRef} type="file" onChange={handleFileChange} style={{display:'none'}} />
              </div>
              <div className="flex gap-2">
                <button type="submit" className="btn btn-primary" disabled={submitting}>{submitting ? '⏳' : 'Качи'}</button>
                <button type="button" className="btn btn-secondary" onClick={function(){ setShowModal(false); }}>Отказ</button>
              </div>
            </form>
          </div>
        </div>
      )}
    </div>
  );
}

function LeavesReports() {
  const { currentUser, users } = useAuth();
  const requests = useFirebaseList('leaveRequests');
  const leaveTypes = useFirebaseObject('leaveTypes', DEFAULT_LEAVE_TYPES);
  const year = new Date().getFullYear();
  const isAdmin = isAdminUser(currentUser);
  const visibleUsers = isAdmin ? users : users.filter(function(u){ return u.id === currentUser.id; });

  const stats = visibleUsers.map(function(u) {
    const userReqs = requests.filter(function(r) {
      return r.userId === u.id && r.status === 'approved' && new Date(r.startDate).getFullYear() === year;
    });
    const usedDays = userReqs.reduce(function(sum, r) {
      const t = leaveTypes[r.type];
      return sum + ((t && t.deducts) ? r.days : 0);
    }, 0);
    return { user: u, approvedCount: userReqs.length, usedDays: usedDays, remaining: (u.totalLeaveDays || 0) - usedDays };
  });

  return (
    <div className="animate-in">
      <PageHeader title={isAdmin ? 'Справки' : 'Моите справки'} subtitle={'За ' + year + ' г.'} />
      <div className="card">
        <h3>{isAdmin ? '👥 По служители' : '👤 Моят баланс'}</h3>
        <div style={{overflowX:'auto'}}>
          <table>
            <thead><tr>{isAdmin && <th>Служител</th>}<th>Одобрени</th><th>Използвани</th><th>Общо</th><th>Оставащи</th></tr></thead>
            <tbody>
              {stats.map(function(s) {
                return (
                  <tr key={s.user.id}>
                    {isAdmin && <td>{s.user.fullName}</td>}
                    <td>{s.approvedCount}</td><td>{s.usedDays}</td>
                    <td>{s.user.totalLeaveDays || 0}</td>
                    <td><b style={{color: s.remaining < 5 ? '#ef4444' : '#10b981'}}>{s.remaining}</b></td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

function TimeModule({ scope }) {
  const { currentUser, users } = useAuth();
  const isAdmin = isAdminUser(currentUser);
  const [now, setNow] = useState(Date.now());
  const [entries, setEntries] = useState([]);
  const projects = useFirebaseList('projects');
  const [pendingCheckout, setPendingCheckout] = useState(null);
  const [stoppingEntry, setStoppingEntry] = useState(null);
  const [stopProjectId, setStopProjectId] = useState('');
  const [editingEntry, setEditingEntry] = useState(null);
  const [editForm, setEditForm] = useState({ checkIn: '', checkOut: '', projectId: '' });
  const [editError, setEditError] = useState('');

  useEffect(function() {
    const t = setInterval(function(){ setNow(Date.now()); }, 1000);
    return function(){ clearInterval(t); };
  }, []);

  useEffect(function() {
    if (!db) return;
    const ref = db.ref('timeEntries');
    const h = function(snap) {
      const list = Object.values(snap.val() || {});
      const filtered = scope === 'all' ? list : list.filter(function(e){ return e.userId === currentUser.id; });
      filtered.sort(function(a, b){ return new Date(b.checkIn) - new Date(a.checkIn); });
      setEntries(filtered);
    };
    ref.on('value', h);
    return function(){ ref.off('value', h); };
  }, [scope, currentUser.id]);

  const activeEntry = entries.find(function(e){ return !e.checkOut && e.userId === currentUser.id; });
  const onPause = activeEntry ? isPaused(activeEntry) : false;
  const elapsed = activeEntry ? calcDuration(activeEntry, now) : 0;
  const activePause = activeEntry ? getActivePause(activeEntry) : null;
  const pauseElapsed = activePause ? now - new Date(activePause.start).getTime() : 0;

  const checkIn = async function() {
    if (activeEntry) return;
    const e = { id: uid(), userId: currentUser.id, userName: currentUser.fullName,
      checkIn: new Date().toISOString(), checkOut: null, projectId: null, pauses: [] };
    await db.ref('timeEntries/' + e.id).set(e);
  };
  const startPause = async function() {
    if (!activeEntry || onPause) return;
    const pauses = (activeEntry.pauses || []).concat([{ start: new Date().toISOString(), end: null }]);
    await db.ref('timeEntries/' + activeEntry.id).update({ pauses: pauses });
  };
  const resumePause = async function() {
    if (!activeEntry || !onPause) return;
    const pauses = (activeEntry.pauses || []).map(function(p){ return p.end ? p : Object.assign({}, p, { end: new Date().toISOString() }); });
    await db.ref('timeEntries/' + activeEntry.id).update({ pauses: pauses });
  };
  const confirmCheckout = async function() {
    if (!pendingCheckout) return;
    const entry = pendingCheckout.entry;
    const proj = projects.find(function(p){ return p.id === pendingCheckout.projectId; });
    const pauses = (entry.pauses || []).map(function(p){ return p.end ? p : Object.assign({}, p, { end: new Date().toISOString() }); });
    await db.ref('timeEntries/' + entry.id).update({
      checkOut: new Date().toISOString(),
      projectId: pendingCheckout.projectId || null,
      projectName: proj ? proj.name : null, pauses: pauses
    });
    setPendingCheckout(null);
  };
  const confirmStop = async function() {
    if (!stoppingEntry) return;
    const proj = projects.find(function(p){ return p.id === stopProjectId; });
    const pauses = (stoppingEntry.pauses || []).map(function(p){ return p.end ? p : Object.assign({}, p, { end: new Date().toISOString() }); });
    await db.ref('timeEntries/' + stoppingEntry.id).update({
      checkOut: new Date().toISOString(),
      projectId: stopProjectId || null,
      projectName: proj ? proj.name : null, pauses: pauses
    });
    setStoppingEntry(null);
  };
  const saveEdit = async function() {
    if (!editingEntry) return;
    const ci = new Date(editForm.checkIn);
    if (isNaN(ci.getTime())) return setEditError('Невалиден час');
    let co = editForm.checkOut ? new Date(editForm.checkOut) : null;
    if (co && isNaN(co.getTime())) return setEditError('Невалиден час');
    const proj = projects.find(function(p){ return p.id === editForm.projectId; });
    await db.ref('timeEntries/' + editingEntry.id).update({
      checkIn: ci.toISOString(), checkOut: co ? co.toISOString() : null,
      projectId: editForm.projectId || null, projectName: proj ? proj.name : null
    });
    setEditingEntry(null);
  };
  const deleteEntry = async function(e) { if (confirm('Изтрий?')) await db.ref('timeEntries/' + e.id).remove(); };

  const myToday = entries.filter(function(e){ return e.userId === currentUser.id && isToday(e.checkIn); });
  const todayTotal = myToday.reduce(function(sum, e){ return sum + calcDuration(e, now); }, 0);
  const getUserName = function(id) {
    const u = users.find(function(x){ return x.id === id; });
    return (u && u.fullName) || '?';
  };

  const projectSummary = useMemo(function() {
    const map = {};
    entries.filter(function(e){ return e.checkOut; }).forEach(function(e) {
      const k = e.projectId || 'none';
      if (!map[k]) map[k] = { name: e.projectName || 'Без проект', total: 0, count: 0 };
      map[k].total += calcDuration(e, now); map[k].count++;
    });
    return Object.values(map).sort(function(a, b){ return b.total - a.total; });
  }, [entries, now]);

  if (scope === 'me') {
    return (
      <div className="animate-in">
        <PageHeader title="Моето време" />
        <div className="card">
          <h3>🕐 Таймер</h3>
          <div className={'clock-display ' + (onPause ? 'paused' : activeEntry ? 'working' : '')}>
            {activeEntry ? fmtTime(elapsed) : '00:00:00'}
          </div>
          {onPause && <div className="pause-badge">⏸ На пауза ({fmtTime(pauseElapsed)})</div>}
          <p className="clock-status">
            {activeEntry ? (onPause ? 'На пауза' : 'На работа от ' + new Date(activeEntry.checkIn).toLocaleTimeString('bg-BG')) : 'Не сте чекирани'}
          </p>
          <div className="clock-actions">
            {!activeEntry ? <button className="btn btn-success" onClick={checkIn}>✅ Чекиране</button> : (
              <React.Fragment>
                {!onPause ? <button className="btn btn-info" onClick={startPause}>⏸ Пауза</button>
                  : <button className="btn btn-success" onClick={resumePause}>▶ Продължи</button>}
                <button className="btn btn-danger" onClick={function(){ setPendingCheckout({entry: activeEntry, projectId: activeEntry.projectId || ''}); }}>⏹ Приключване</button>
              </React.Fragment>
            )}
          </div>
          <div style={{padding:'16px', background:'#faf5ff', borderRadius:'12px'}}>
            <div className="text-muted">Днес:</div>
            <div style={{fontSize:'24px', fontWeight:'700', color:'#10b981'}}>{fmtTime(todayTotal)}</div>
          </div>
        </div>
        {pendingCheckout && (
          <div className="modal-backdrop" onClick={function(){ setPendingCheckout(null); }}>
            <div className="modal" onClick={function(e){ e.stopPropagation(); }}>
              <h3>⏹ Приключване</h3>
              <div className="form-group"><label>Проект</label>
                <select value={pendingCheckout.projectId} onChange={function(e){ setPendingCheckout(Object.assign({}, pendingCheckout, { projectId: e.target.value })); }}>
                  <option value="">-- Без --</option>
                  {projects.map(function(p){ return <option key={p.id} value={p.id}>{p.name}</option>; })}
                </select>
              </div>
              <div className="flex gap-2">
                <button className="btn btn-primary" onClick={confirmCheckout}>Потвърди</button>
                <button className="btn btn-secondary" onClick={function(){ setPendingCheckout(null); }}>Отказ</button>
              </div>
            </div>
          </div>
        )}
      </div>
    );
  }

  return (
    <div className="animate-in">
      <PageHeader title={isAdmin ? 'Отчети' : 'Моите отчети'} />
      {isAdmin && projectSummary.length > 0 && (
        <div className="card">
          <h3>📊 По проекти</h3>
          <table><thead><tr><th>Проект</th><th>Записи</th><th>Общо</th></tr></thead>
            <tbody>{projectSummary.map(function(p, i){ return <tr key={i}><td>{p.name}</td><td>{p.count}</td><td>{fmtTime(p.total)}</td></tr>; })}</tbody>
          </table>
        </div>
      )}
      <div className="card">
        <h3>📋 Записи</h3>
        {entries.length === 0 ? <div className="empty-state">Няма</div> : (
          <div style={{overflowX:'auto'}}>
            <table>
              <thead><tr>{isAdmin && <th>Служител</th>}<th>Дата</th><th>Начало</th><th>Край</th><th>Проект</th><th>Прод.</th>{isAdmin && <th></th>}</tr></thead>
              <tbody>
                {entries.slice(0, 200).map(function(e) {
                  const start = new Date(e.checkIn);
                  const end = e.checkOut ? new Date(e.checkOut) : null;
                  const active = !e.checkOut;
                  const paused = isPaused(e);
                  return (
                    <tr key={e.id}>
                      {isAdmin && <td>{getUserName(e.userId) || e.userName}</td>}
                      <td>{start.toLocaleDateString('bg-BG')}</td>
                      <td>{start.toLocaleTimeString('bg-BG')}</td>
                      <td>{end ? end.toLocaleTimeString('bg-BG') : paused ? <span className="badge paused">пауза</span> : <span className="badge active">работи</span>}</td>
                      <td>{e.projectName || '-'}</td>
                      <td>{fmtTime(calcDuration(e, now))}</td>
                      {isAdmin && (
                        <td>
                          <div className="admin-actions">
                            {active && !paused && <button className="btn btn-warning btn-sm" onClick={function(){ setStoppingEntry(e); setStopProjectId(e.projectId || ''); }}>⏹</button>}
                            <button className="btn btn-secondary btn-sm" onClick={function(){ setEditingEntry(e); setEditForm({checkIn: toDatetimeLocal(e.checkIn), checkOut: e.checkOut ? toDatetimeLocal(e.checkOut) : '', projectId: e.projectId || ''}); }}>✏️</button>
                            <button className="btn btn-danger btn-sm" onClick={function(){ deleteEntry(e); }}>🗑️</button>
                          </div>
                        </td>
                      )}
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </div>
      {stoppingEntry && (
        <div className="modal-backdrop" onClick={function(){ setStoppingEntry(null); }}>
          <div className="modal" onClick={function(e){ e.stopPropagation(); }}>
            <h3>⏹ Спиране</h3>
            <div className="form-group"><label>Проект</label>
              <select value={stopProjectId} onChange={function(e){ setStopProjectId(e.target.value); }}>
                <option value="">-- Без --</option>
                {projects.map(function(p){ return <option key={p.id} value={p.id}>{p.name}</option>; })}
              </select>
            </div>
            <div className="flex gap-2">
              <button className="btn btn-warning" onClick={confirmStop}>Спри</button>
              <button className="btn btn-secondary" onClick={function(){ setStoppingEntry(null); }}>Отказ</button>
            </div>
          </div>
        </div>
      )}
      {editingEntry && (
        <div className="modal-backdrop" onClick={function(){ setEditingEntry(null); }}>
          <div className="modal" onClick={function(e){ e.stopPropagation(); }}>
            <h3>✏️ Редакция</h3>
            {editError && <div className="error">{editError}</div>}
            <div className="form-group"><label>Начало</label><input type="datetime-local" value={editForm.checkIn} onChange={function(e){ setEditForm(Object.assign({}, editForm, { checkIn: e.target.value })); }} /></div>
            <div className="form-group"><label>Край</label><input type="datetime-local" value={editForm.checkOut} onChange={function(e){ setEditForm(Object.assign({}, editForm, { checkOut: e.target.value })); }} /></div>
            <div className="form-group"><label>Проект</label>
              <select value={editForm.projectId} onChange={function(e){ setEditForm(Object.assign({}, editForm, { projectId: e.target.value })); }}>
                <option value="">-- Без --</option>
                {projects.map(function(p){ return <option key={p.id} value={p.id}>{p.name}</option>; })}
              </select>
            </div>
            <div className="flex gap-2">
              <button className="btn btn-primary" onClick={saveEdit}>Запази</button>
              <button className="btn btn-secondary" onClick={function(){ setEditingEntry(null); }}>Отказ</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ================================================================
function HolidaysSettings() {
  const holidaysList = useFirebaseList('holidays');
  const [form, setForm] = useState({ name: '', date: '' });
  const [error, setError] = useState('');
  const [showModal, setShowModal] = useState(false);
  const [selectedYear, setSelectedYear] = useState(new Date().getFullYear());
  const sorted = holidaysList.filter(function(h){ return !selectedYear || new Date(h.date).getFullYear() === selectedYear; })
    .sort(function(a, b){ return a.date.localeCompare(b.date); });
  const years = Array.from(new Set(holidaysList.map(function(h){ return new Date(h.date).getFullYear(); }))).sort();

  const submit = async function(e) {
    e.preventDefault(); setError('');
    if (!form.name.trim() || !form.date) return setError('Попълнете');
    if (holidaysList.find(function(h){ return h.date === form.date; })) return setError('Вече има');
    const id = uid();
    await db.ref('holidays/' + id).set({ id: id, name: form.name.trim(), date: form.date, createdAt: new Date().toISOString() });
    setForm({ name: '', date: '' }); setShowModal(false);
  };
  const remove = async function(id) { if (confirm('Изтрий?')) await db.ref('holidays/' + id).remove(); };
  const addDefaults = async function() {
    if (!confirm('Добави стандартни за ' + selectedYear + '?')) return;
    const existing = holidaysList.filter(function(h){ return new Date(h.date).getFullYear() === selectedYear; }).map(function(h){ return h.date; });
    const batch = {}; let added = 0;
    Object.keys(DEFAULT_HOLIDAYS).forEach(function(md) {
      const parts = md.split('-');
      const dISO = selectedYear + '-' + parts[0] + '-' + parts[1];
      if (existing.indexOf(dISO) !== -1) return;
      const id = uid();
      batch[id] = { id: id, name: DEFAULT_HOLIDAYS[md].name, date: dISO, createdAt: new Date().toISOString() };
      added++;
    });
    if (added === 0) return alert('Вече са добавени');
    await db.ref('holidays').update(batch);
  };

  return (
    <div className="animate-in">
      <PageHeader title="Празници" onAdd={function(){ setShowModal(true); }} addLabel="Нов" />
      <div className="card">
        <div style={{display:'flex', gap:'12px', flexWrap:'wrap', marginBottom:'16px', alignItems:'center'}}>
          <select value={selectedYear} onChange={function(e){ setSelectedYear(Number(e.target.value)); }} style={{padding:'8px', border:'1.5px solid #e9d5ff', borderRadius:'8px'}}>
            {years.map(function(y){ return <option key={y} value={y}>{y}</option>; })}
          </select>
          <button className="btn btn-info btn-sm" onClick={addDefaults}>🎉 Добави стандартни</button>
          <span className="text-muted" style={{marginLeft:'auto'}}>Общо: <b>{sorted.length}</b></span>
        </div>
        {sorted.length === 0 ? <div className="empty-state">Няма</div> : (
          <div style={{overflowX:'auto'}}>
            <table>
              <thead><tr><th>Дата</th><th>Име</th><th></th></tr></thead>
              <tbody>
                {sorted.map(function(h) {
                  return (
                    <tr key={h.id}>
                      <td><b>{formatDate(h.date)}</b></td><td>{h.name}</td>
                      <td><button className="btn btn-danger btn-sm" onClick={function(){ remove(h.id); }}>🗑️</button></td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </div>
      {showModal && (
        <div className="modal-backdrop" onClick={function(){ setShowModal(false); }}>
          <div className="modal" onClick={function(e){ e.stopPropagation(); }}>
            <h3>➕ Нов празник</h3>
            {error && <div className="error">{error}</div>}
            <form onSubmit={submit}>
              <div className="form-group"><label>Име *</label><input value={form.name} onChange={function(e){ setForm(Object.assign({}, form, { name: e.target.value })); }} required /></div>
              <div className="form-group"><label>Дата *</label><input type="date" value={form.date} onChange={function(e){ setForm(Object.assign({}, form, { date: e.target.value })); }} required /></div>
              <div className="flex gap-2">
                <button type="submit" className="btn btn-primary">Добави</button>
                <button type="button" className="btn btn-secondary" onClick={function(){ setShowModal(false); }}>Отказ</button>
              </div>
            </form>
          </div>
        </div>
      )}
    </div>
  );
}

// USERS MANAGER
// ================================================================
function UsersManager() {
  const { users, addUser, updateUser, deleteUser, currentUser } = useAuth();
  const [showModal, setShowModal] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [editData, setEditData] = useState({});
  const [error, setError] = useState('');
  const [form, setForm] = useState({ username: '', password: '', fullName: '', email: '', roles: ['employee'], totalLeaveDays: 20 });

  const submit = async function(e) {
    e.preventDefault(); setError('');
    if (form.roles.length === 0) return setError('Изберете поне една роля');
    const res = await addUser(Object.assign({}, form, { totalLeaveDays: Number(form.totalLeaveDays) || 20 }));
    if (res.error) return setError(res.error);
    setForm({ username: '', password: '', fullName: '', email: '', roles: ['employee'], totalLeaveDays: 20 });
    setShowModal(false);
  };

  const startEdit = function(u) { setEditingId(u.id); setEditData(Object.assign({}, u, { roles: getUserRoles(u) })); };
  const saveEdit = async function() {
    if (!editData.roles || editData.roles.length === 0) return alert('Изберете поне една роля');
    await updateUser(editingId, {
      fullName: editData.fullName, email: editData.email, roles: editData.roles,
      totalLeaveDays: Number(editData.totalLeaveDays),
      password: editData.password, username: editData.username
    });
    setEditingId(null);
  };

  const toggleRole = function(roles, role) {
    if (roles.indexOf(role) !== -1) {
      if (roles.length === 1) return roles;
      return roles.filter(function(r){ return r !== role; });
    }
    return roles.concat([role]);
  };

  const RoleCheckboxes = function({ values, onChange }) {
    return (
      <div style={{display:'flex', flexWrap:'wrap', gap:'8px'}}>
        {ALL_ROLES.map(function(r) {
          const meta = ROLE_META[r];
          const checked = values.indexOf(r) !== -1;
          return (
            <label key={r} style={{
              display:'flex', alignItems:'center', gap:'6px', cursor:'pointer',
              padding:'6px 10px', borderRadius:'8px',
              background: checked ? meta.color + '15' : '#faf5ff',
              border: '1.5px solid ' + (checked ? meta.color : '#ede9fe'),
              fontSize:'13px', fontWeight: 600,
              color: checked ? meta.color : '#6b7280'
            }}>
              <input type="checkbox" checked={checked}
                onChange={function(){ onChange(toggleRole(values, r)); }}
                style={{accentColor: meta.color}} />
              <span>{meta.icon} {meta.bg}</span>
            </label>
          );
        })}
      </div>
    );
  };

  return (
    <div className="animate-in">
      <PageHeader title="Потребители" subtitle={'Всички (' + users.length + ')'} onAdd={function(){ setShowModal(true); }} addLabel="Нов" />
      <div className="card">
        {users.length === 0 ? <div className="empty-state">Няма</div> : (
          <div style={{overflowX:'auto'}}>
            <table>
              <thead><tr><th>Име</th><th>Потребител</th><th>Роли</th><th>Отпуск</th><th>Действия</th></tr></thead>
              <tbody>
                {users.map(function(u) {
                  if (editingId === u.id) {
                    return (
                      <tr key={u.id}>
                        <td><input value={editData.fullName} onChange={function(e){ setEditData(Object.assign({}, editData, { fullName: e.target.value })); }} style={{width:'130px'}} /></td>
                        <td><input value={editData.username} onChange={function(e){ setEditData(Object.assign({}, editData, { username: e.target.value })); }} style={{width:'100px'}} /></td>
                        <td colSpan="2">
                          <div style={{marginBottom:'6px'}}>
                            <RoleCheckboxes values={editData.roles || []} onChange={function(r){ setEditData(Object.assign({}, editData, { roles: r })); }} />
                          </div>
                          <input type="number" placeholder="Дни" style={{width:'80px'}} value={editData.totalLeaveDays} onChange={function(e){ setEditData(Object.assign({}, editData, { totalLeaveDays: e.target.value })); }} />
                        </td>
                        <td>
                          <button className="btn btn-success btn-sm" onClick={saveEdit}>Запази</button>
                          <button className="btn btn-secondary btn-sm" onClick={function(){ setEditingId(null); }} style={{marginLeft:'4px'}}>Отказ</button>
                        </td>
                      </tr>
                    );
                  }
                  return (
                    <tr key={u.id}>
                      <td>{u.fullName}</td>
                      <td><code>{u.username}</code></td>
                      <td>
                        <div style={{display:'flex', flexWrap:'wrap', gap:'4px'}}>

function ResignationForm({ onClose }) {
  const { currentUser } = useAuth();
  const [form, setForm] = useState({
    fullName: currentUser.fullName || '',
    position: '',
    egn: '',
    address: '',
    phone: '',
    handoverDate: todayISO()
  });
  const [submitting, setSubmitting] = useState(false);
  const [error, setError] = useState('');

  const submit = async function(e) {
    e.preventDefault(); setError('');
    if (!form.fullName.trim()) return setError('Въведете име');
    if (!form.position.trim()) return setError('Въведете длъжност');
    if (!form.handoverDate) return setError('Изберете дата');
    setSubmitting(true);
    try {
      const handover = new Date(form.handoverDate);
      const startDate = new Date(handover);
      startDate.setDate(startDate.getDate() + 1);
      const endDate = new Date(startDate);
      endDate.setDate(endDate.getDate() + 29);
      const startISO = startDate.getFullYear() + '-' + pad(startDate.getMonth()+1) + '-' + pad(startDate.getDate());
      const endISO = endDate.getFullYear() + '-' + pad(endDate.getMonth()+1) + '-' + pad(endDate.getDate());

      const resignation = {
        id: uid(),
        userId: currentUser.id,
        userName: currentUser.fullName,
        fullName: form.fullName.trim(),
        position: form.position.trim(),
        egn: form.egn.trim(),
        address: form.address.trim(),
        phone: form.phone.trim(),
        handoverDate: form.handoverDate,
        startDate: startISO,
        endDate: endISO,
        status: 'pending_approval',
        approvals: {},
        rejections: {},
        createdAt: new Date().toISOString(),
        createdBy: currentUser.id
      };
      await db.ref('resignations/' + resignation.id).set(resignation);
      onClose();
      alert('✅ Предизвестието е подадено. Очаква одобрение.');
    } catch (err) { setError('Грешка: ' + err.message); }
    setSubmitting(false);
  };

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" onClick={function(e){ e.stopPropagation(); }}>
        <h3>📄 Ново предизвестие</h3>
        <div className="info-box">ℹ️ Ще бъде изпратено до всички директори и зам.-директори.</div>
        {error && <div className="error">{error}</div>}
        <form onSubmit={submit}>
          <div className="form-group"><label>Три имена *</label>
            <input value={form.fullName} onChange={function(e){ setForm(Object.assign({}, form, { fullName: e.target.value })); }} required />
          </div>
          <div className="form-row">
            <div className="form-group"><label>Длъжност *</label>
              <input value={form.position} onChange={function(e){ setForm(Object.assign({}, form, { position: e.target.value })); }} required />
            </div>
            <div className="form-group"><label>ЕГН</label>
              <input value={form.egn} onChange={function(e){ setForm(Object.assign({}, form, { egn: e.target.value })); }} maxLength="10" />
            </div>
          </div>
          <div className="form-group"><label>Адрес</label>
            <input value={form.address} onChange={function(e){ setForm(Object.assign({}, form, { address: e.target.value })); }} />
          </div>
          <div className="form-row">
            <div className="form-group"><label>Телефон</label>
              <input value={form.phone} onChange={function(e){ setForm(Object.assign({}, form, { phone: e.target.value })); }} />
            </div>
            <div className="form-group"><label>Дата на предаване *</label>
              <input type="date" value={form.handoverDate} onChange={function(e){ setForm(Object.assign({}, form, { handoverDate: e.target.value })); }} required />
            </div>
          </div>
          {form.handoverDate && (
            <div className="warning-box">
              <div><b>Предаване:</b> {formatDate(form.handoverDate)}</div>
              <div><b>Начало:</b> {
                (function() { const d = new Date(form.handoverDate); d.setDate(d.getDate()+1);
                  return formatDate(d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())); })()
              }</div>
              <div><b>Последен ден:</b> {
                (function() { const d = new Date(form.handoverDate); d.setDate(d.getDate()+30);
                  return formatDate(d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())); })()
              }</div>
            </div>
          )}
          <div className="flex gap-2" style={{justifyContent:'flex-end'}}>
            <button type="button" className="btn btn-secondary" onClick={onClose}>Отказ</button>
            <button type="submit" className="btn btn-primary" disabled={submitting}>{submitting ? '⏳' : '📨 Подай'}</button>
          </div>
        </form>
      </div>
    </div>
  );
}

function ResignationDetail({ resignation, onClose }) {
  const { currentUser, users } = useAuth();
  const [processing, setProcessing] = useState(false);
  const canApprove = isApproverUser(currentUser);
  const approvers = users.filter(function(u){ return isApproverUser(u); });
  const totalApprovers = approvers.length;
  const approvedCount = Object.keys(resignation.approvals || {}).length;
  const userApproved = !!(resignation.approvals && resignation.approvals[currentUser.id]);
  const userRejected = !!(resignation.rejections && resignation.rejections[currentUser.id]);

  const statusMeta = {
    pending_approval: { text: 'Чака одобрение', badge: 'pending' },
    approved: { text: 'Одобрено', badge: 'approved' },
    rejected: { text: 'Отхвърлено', badge: 'rejected' },
    active: { text: 'В сила (30 дни)', badge: 'running' },
    expired: { text: 'Изтекло', badge: 'expired' }
  };
  const st = statusMeta[resignation.status] || statusMeta.pending_approval;

  let daysLeft = null;
  if (resignation.status === 'active' && resignation.endDate) {
    daysLeft = Math.ceil((new Date(resignation.endDate) - new Date()) / 86400000);
  }

  const progress = totalApprovers > 0 ? Math.round((approvedCount / totalApprovers) * 100) : 0;

  const approve = async function() {
    if (!confirm('Одобрявате ли?')) return;
    setProcessing(true);
    try {
      const updates = {};
      updates['approvals/' + currentUser.id] = {
        approved: true,
        at: new Date().toISOString(),
        name: currentUser.fullName
      };
      await db.ref('resignations/' + resignation.id).update(updates);
      const newApprovals = Object.assign({}, resignation.approvals || {});
      newApprovals[currentUser.id] = { approved: true };
      if (Object.keys(newApprovals).length >= totalApprovers) {
        await db.ref('resignations/' + resignation.id).update({ status: 'active' });
      }
      onClose();
    } catch (e) { alert('Грешка: ' + e.message); }
    setProcessing(false);
  };

  const reject = async function() {
    const comment = prompt('Причина (по избор):');
    if (comment === null) return;
    setProcessing(true);
    try {
      const updates = {};
      updates['rejections/' + currentUser.id] = {
        rejected: true,
        at: new Date().toISOString(),
        name: currentUser.fullName,
        comment: comment || ''
      };
      updates.status = 'rejected';
      await db.ref('resignations/' + resignation.id).update(updates);
      onClose();
    } catch (e) { alert('Грешка: ' + e.message); }
    setProcessing(false);
  };

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal wide" onClick={function(e){ e.stopPropagation(); }}>
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:'16px', gap:'8px'}}>
          <div>
            <h3 style={{marginBottom:'4px'}}>📄 Предизвестие</h3>
            <div className="text-muted" style={{fontSize:'13px'}}>{resignation.fullName}</div>
          </div>
          <span className={'badge ' + st.badge}>{st.text}</span>
        </div>
        <div className="detail-row"><span className="detail-label">Длъжност</span><span className="detail-value">{resignation.position}</span></div>
        <div className="detail-row"><span className="detail-label">ЕГН</span><span className="detail-value">{resignation.egn || '-'}</span></div>
        <div className="detail-row"><span className="detail-label">Адрес</span><span className="detail-value">{resignation.address || '-'}</span></div>
        <div className="detail-row"><span className="detail-label">Телефон</span><span className="detail-value">{resignation.phone || '-'}</span></div>
        <div className="detail-row"><span className="detail-label">Предадено</span><span className="detail-value">{formatDate(resignation.handoverDate)}</span></div>
        <div className="detail-row"><span className="detail-label">Начало</span><span className="detail-value">{formatDate(resignation.startDate)}</span></div>
        <div className="detail-row"><span className="detail-label">Последен ден</span><span className="detail-value"><b>{formatDate(resignation.endDate)}</b></span></div>
        {daysLeft !== null && daysLeft >= 0 && (
          <div className="warning-box" style={{marginTop:'16px'}}>⏳ <b>Остават {daysLeft} дни</b></div>
        )}
        <div style={{marginTop:'20px', padding:'14px', background:'#faf5ff', borderRadius:'12px', border:'1px solid #ede9fe'}}>
          <div style={{display:'flex', justifyContent:'space-between', marginBottom:'10px'}}>
            <b style={{color:'#7c3aed'}}>Одобрения</b>
            <span style={{fontSize:'13px', color:'#7c3aed'}}>{approvedCount} / {totalApprovers}</span>
          </div>
          <div className="approval-progress">
            <div className={'approval-progress-fill ' + (progress >= 100 ? 'full' : '')} style={{width: progress + '%'}}></div>
          </div>
          {approvers.length === 0 ? (
            <div className="text-muted" style={{textAlign:'center', padding:'10px'}}>Няма назначени</div>
          ) : approvers.map(function(a) {
            const appr = resignation.approvals && resignation.approvals[a.id];
            const rej = resignation.rejections && resignation.rejections[a.id];
            const cls = appr ? 'approved' : rej ? 'rejected' : 'pending';
            return (
              <div key={a.id} className={'approver-row ' + cls}>
                <div style={{display:'flex', alignItems:'center', gap:'8px'}}>
                  <span>{appr ? '✅' : rej ? '❌' : '⏳'}</span>
                  <span style={{fontWeight:600}}>{a.fullName}</span>
                  <span style={{fontSize:'11px', color:'#7c3aed'}}>({getRoleLabels(a)})</span>
                </div>
                <div style={{fontSize:'11px', color:'#9ca3af'}}>
                  {appr && appr.at ? formatRelative(appr.at) : ''}
                  {rej && rej.at ? formatRelative(rej.at) : ''}
                  {!appr && !rej ? 'чака' : ''}
                </div>
              </div>
            );
          })}
        </div>
        <div className="flex gap-2 mt-2" style={{justifyContent:'flex-end', flexWrap:'wrap'}}>
          {canApprove && resignation.status === 'pending_approval' && !userApproved && !userRejected && (
            <React.Fragment>
              <button className="btn btn-danger" onClick={reject} disabled={processing}>✕ Отхвърли</button>
              <button className="btn btn-success" onClick={approve} disabled={processing}>✓ Одобри</button>
            </React.Fragment>
          )}
          {userApproved && <span className="badge approved">✓ Вие одобрихте</span>}
          {userRejected && <span className="badge rejected">✕ Вие отхвърлихте</span>}
          <button className="btn btn-secondary" onClick={onClose}>Затвори</button>
          <button className="btn btn-primary" onClick={function(){ generateResignationPDF(resignation, currentUser, users); }}>🖨️ PDF</button>
        </div>
      </div>
    </div>
  );
}
