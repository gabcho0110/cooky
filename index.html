function MessagesPanel({ onClose }) {
  const { currentUser, users } = useAuth();
  const [view, setView] = useState('inbox'); // 'inbox' | 'sent' | 'detail' | 'compose'
  const [selectedMsg, setSelectedMsg] = useState(null);
  const [searchQuery, setSearchQuery] = useState('');

  // Съобщенията, в които аз съм получател (inbox)
  const allMessages = useFirebaseList('messages');
  const myMessages = allMessages.filter(m =>
    (m.recipients || []).includes(currentUser.id)
  );
  const sentMessages = allMessages.filter(m => m.authorId === currentUser.id);

  const unreadCount = myMessages.filter(m => !(m.readBy || []).includes(currentUser.id)).length;

  let visibleMessages = view === 'sent' ? sentMessages : myMessages;
  if (searchQuery.trim()) {
    const q = searchQuery.toLowerCase();
    visibleMessages = visibleMessages.filter(m =>
      (m.subject || '').toLowerCase().includes(q) ||
      (m.body || '').toLowerCase().includes(q) ||
      (m.authorName || '').toLowerCase().includes(q)
    );
  }
  visibleMessages = [...visibleMessages].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

  const openMessage = async (msg) => {
    setSelectedMsg(msg);
    setView('detail');
    // Маркирай като прочетено
    if (!(msg.readBy || []).includes(currentUser.id)) {
      const readBy = [...(msg.readBy || []), currentUser.id];
      await db.ref('messages/' + msg.id).update({ readBy });
    }
  };

  const deleteMessage = async (msg) => {
    if (!confirm('Изтриване на съобщението?')) return;
    await db.ref('messages/' + msg.id).remove();
    setSelectedMsg(null);
    setView('inbox');
  };

  return (
    <>
      <div className="msg-panel-backdrop" onClick={onClose} />
      <div className="msg-panel">
        <div className="msg-panel-header">
          <h2>
            {view === 'compose' ? '✉️ Ново съобщение' :
             view === 'detail' ? '📩 Преглед' :
             view === 'sent' ? '📤 Изпратени' :
             `📥 Входящи ${unreadCount > 0 ? `(${unreadCount})` : ''}`}
          </h2>
          <button className="msg-panel-close" onClick={() => {
            if (view === 'detail' || view === 'compose') { setView('inbox'); setSelectedMsg(null); }
            else onClose();
          }}>✕</button>
        </div>

        {view === 'inbox' || view === 'sent' ? (
          <>
            <div className="msg-actions-bar">
              <button className="btn btn-primary btn-sm" onClick={() => setView('compose')}>➕ Ново</button>
              <button className={`btn btn-sm ${view === 'inbox' ? 'btn-primary' : 'btn-secondary'}`}
                onClick={() => setView('inbox')}>📥 Входящи</button>
              <button className={`btn btn-sm ${view === 'sent' ? 'btn-primary' : 'btn-secondary'}`}
                onClick={() => setView('sent')}>📤 Изпратени</button>
            </div>
            <div style={{padding:'12px 20px', borderBottom:'1px solid #ede9fe'}}>
              <input className="msg-search" placeholder="🔍 Търсене..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)} />
            </div>
            <div className="msg-panel-body">
              {visibleMessages.length === 0 ? (
                <div className="msg-empty">
                  <div style={{fontSize:'48px', marginBottom:'12px'}}>📭</div>
                  <div>{searchQuery ? 'Няма намерени съобщения' : view === 'sent' ? 'Няма изпратени' : 'Няма съобщения'}</div>
                </div>
              ) : visibleMessages.map(m => {
                const unread = !(m.readBy || []).includes(currentUser.id) && view === 'inbox';
                const recipientsCount = (m.recipients || []).length;
                return (
                  <div key={m.id} className={`msg-item ${unread ? 'unread' : ''}`} onClick={() => openMessage(m)}>
                    <div className="msg-item-header">
                      <span className="msg-author">
                        {view === 'sent' ? `До: ${recipientsCount} получатели` : m.authorName}
                      </span>
                      <span className="msg-date">{formatRelative(m.createdAt)}</span>
                    </div>
                    <div className="msg-subject">{m.subject || '(без тема)'}</div>
                    <div className="msg-preview">{(m.body || '').slice(0, 80)}{(m.body || '').length > 80 ? '...' : ''}</div>
                    {recipientsCount > 0 && (
                      <div className="msg-participants">👥 {recipientsCount} получатели</div>
                    )}
                  </div>
                );
              })}
            </div>
          </>
        ) : view === 'detail' && selectedMsg ? (
          <div className="msg-panel-body">
            <div className="msg-detail">
              <h2>{selectedMsg.subject || '(без тема)'}</h2>
              <div className="msg-detail-meta">
                <span>👤 <b>{selectedMsg.authorName}</b></span>
                <span>📅 {formatDateTime(selectedMsg.createdAt)}</span>
              </div>
              {selectedMsg.recipientsNames && selectedMsg.recipientsNames.length > 0 && (
                <div style={{marginBottom:'16px', paddingBottom:'16px', borderBottom:'1px solid #ede9fe'}}>
                  <div style={{fontSize:'12px', color:'#7c3aed', fontWeight:600, marginBottom:'6px'}}>ДО:</div>
                  <div>
                    {selectedMsg.recipientsNames.slice(0, 10).map((n, i) => (
                      <span key={i} className="msg-recipient-tag">{n}</span>
                    ))}
                    {selectedMsg.recipientsNames.length > 10 && (
                      <span className="msg-recipient-tag">+{selectedMsg.recipientsNames.length - 10} още</span>
                    )}
                  </div>
                </div>
              )}
              <div className="msg-detail-content">{selectedMsg.body}</div>
            </div>
            <div style={{display:'flex', gap:'8px', marginTop:'20px', flexWrap:'wrap'}}>
              <button className="btn btn-secondary" onClick={() => { setView('inbox'); setSelectedMsg(null); }}>← Назад</button>
              {selectedMsg.authorId === currentUser.id && (
                <button className="btn btn-danger" onClick={() => deleteMessage(selectedMsg)}>🗑️ Изтрий</button>
              )}
            </div>
          </div>
        ) : view === 'compose' ? (
          <ComposeMessage onClose={() => { setView('inbox'); }} users={users} currentUser={currentUser} />
        ) : null}
      </div>
    </>
  );
}

function ComposeMessage({ onClose, users, currentUser }) {
  const [form, setForm] = useState({ subject: '', body: '', recipients: [] });
  const [error, setError] = useState('');
  const [sending, setSending] = useState(false);
  const [pickerMode, setPickerMode] = useState('users'); // 'users' | 'roles'
  const [selectedRole, setSelectedRole] = useState('employee');

  const toggleRecipient = (id) => {
    setForm(f => ({
      ...f,
      recipients: f.recipients.includes(id)
        ? f.recipients.filter(x => x !== id)
        : [...f.recipients, id]
    }));
  };

  const addByRole = (role) => {
    const ids = users.filter(u => hasRole(u, role)).map(u => u.id);
    setForm(f => ({
      ...f,
      recipients: Array.from(new Set([...f.recipients, ...ids]))
    }));
  };

  const addAll = () => {
    setForm(f => ({ ...f, recipients: users.map(u => u.id) }));
  };

  const clearRecipients = () => setForm(f => ({ ...f, recipients: [] }));

  const submit = async (e) => {
    e.preventDefault(); setError('');
    if (!form.subject.trim()) return setError('Въведете тема');
    if (!form.body.trim()) return setError('Въведете текст');
    if (form.recipients.length === 0) return setError('Изберете поне един получател');

    setSending(true);
    try {
      const recipientsNames = form.recipients
        .map(id => users.find(u => u.id === id)?.fullName)
        .filter(Boolean);

      const msg = {
        id: uid(),
        authorId: currentUser.id,
        authorName: currentUser.fullName,
        recipients: form.recipients,
        recipientsNames,
        subject: form.subject.trim(),
        body: form.body.trim(),
        readBy: [],
        createdAt: new Date().toISOString()
      };
      await db.ref('messages/' + msg.id).set(msg);
      onClose();
    } catch (err) { setError('Грешка: ' + err.message); }
    setSending(false);
  };

  return (
    <form onSubmit={submit} className="msg-panel-body" style={{display:'flex', flexDirection:'column'}}>
      {error && <div className="error">{error}</div>}

      <div className="form-group">
        <label>До: ({form.recipients.length} избрани)</label>
        <div style={{display:'flex', gap:'6px', flexWrap:'wrap', marginBottom:'8px'}}>
          <button type="button" className="btn btn-secondary btn-sm" onClick={addAll}>👥 Всички</button>
          <button type="button" className="btn btn-secondary btn-sm" onClick={() => addByRole('director')}>🏛️ Директори</button>
          <button type="button" className="btn btn-secondary btn-sm" onClick={() => addByRole('deputy_director')}>🎖️ Зам.-дир.</button>
          <button type="button" className="btn btn-secondary btn-sm" onClick={() => addByRole('admin')}>👑 Админи</button>
          <button type="button" className="btn btn-secondary btn-sm" onClick={() => addByRole('employee')}>👤 Служители</button>
          {form.recipients.length > 0 && (
            <button type="button" className="btn btn-danger btn-sm" onClick={clearRecipients}>✕ Изчисти</button>
          )}
        </div>
        <div style={{
          maxHeight:'200px', overflowY:'auto', border:'1.5px solid #e9d5ff',
          borderRadius:'10px', padding:'8px', background:'#fff'
        }}>
          {users.map(u => {
            const sel = form.recipients.includes(u.id);
            return (
              <label key={u.id} style={{
                display:'flex', alignItems:'center', gap:'8px',
                padding:'8px', borderRadius:'8px', cursor:'pointer',
                background: sel ? '#f3e8ff' : 'transparent',
                borderBottom:'1px solid #faf5ff'
              }}>
                <input type="checkbox" checked={sel} onChange={() => toggleRecipient(u.id)} style={{accentColor:'#7c3aed'}} />
                <span style={{fontWeight:600, fontSize:'13px'}}>{u.fullName}</span>
                <span style={{fontSize:'11px', color:'#7c3aed', marginLeft:'auto'}}>{getRoleLabels(u)}</span>
              </label>
            );
          })}
        </div>
      </div>

      <div className="form-group">
        <label>Тема *</label>
        <input value={form.subject} onChange={e => setForm({...form, subject: e.target.value})} placeholder="Тема на съобщението" required />
      </div>

      <div className="form-group" style={{flex:1, display:'flex', flexDirection:'column'}}>
        <label>Съобщение *</label>
        <textarea
          value={form.body}
          onChange={e => setForm({...form, body: e.target.value})}
          placeholder="Напишете вашето съобщение..."
          style={{minHeight:'200px', resize:'vertical', fontFamily:'inherit'}}
          required
        />
        <div style={{fontSize:'11px', color:'#9ca3af', marginTop:'4px', textAlign:'right'}}>
          {form.body.length} / 15000
        </div>
      </div>

      <div style={{display:'flex', gap:'8px', justifyContent:'flex-end', paddingTop:'12px', borderTop:'1px solid #ede9fe'}}>
        <button type="button" className="btn btn-secondary" onClick={onClose}>Отказ</button>
        <button type="submit" className="btn btn-primary" disabled={sending}>
          {sending ? '⏳ Изпращане...' : '📨 Изпрати'}
        </button>
      </div>
    </form>
  );
}

function App() {
  const { currentUser, loading } = useAuth();
  const [page, setPage] = useState('home');
  const [showMessages, setShowMessages] = useState(false);
  const [showResignations, setShowResignations] = useState(false);

  // Брояч на непрочетени съобщения
  const allMessages = useFirebaseList('messages');
  const unreadMessages = currentUser ? allMessages.filter(m =>
    (m.recipients || []).includes(currentUser.id) &&
    !(m.readBy || []).includes(currentUser.id)
  ).length : 0;

  // Брояч на чакащи предизвестия (за одобрение)
  const allResignations = useFirebaseList('resignations');
  const isApprover = currentUser ? isApproverUser(currentUser) : false;
  const pendingResignations = currentUser && isApprover
    ? allResignations.filter(r =>
        r.status === 'pending_approval' &&
        !(r.approvals?.[currentUser.id])
      ).length
    : 0;

  if (loading) {
    return (
      <div className="loading-screen">
        <div className="loading-card">
          <h1>⏰ Clocky</h1>
          <div className="spinner"></div>
          <p className="text-muted mt-2">Зареждане...</p>
        </div>
      </div>
    );
  }

  if (!currentUser) return <Login />;

  const isAdmin = isAdminUser(currentUser);

  const renderPage = () => {
    switch (page) {
      case 'home': return <Home onNavigate={setPage} />;
      case 'leaves-calendar': return <CalendarPage />;
      case 'leaves-my': return <MyRequests />;
      case 'leaves-requests': return isAdmin ? <LeaveRequestsPage /> : <Home onNavigate={setPage} />;
      case 'leaves-reports': return <LeavesReports />;
      case 'time-me': return <TimeModule scope="me" />;
      case 'time-reports': return <TimeModule scope={isAdmin ? 'all' : 'reports'} />;
      case 'resignations-my': return <ResignationsPage scope="my" />;
      case 'resignations-all': return <ResignationsPage scope="all" />;
      case 'documents-list': return <DocumentsPage />;
      case 'company-data': return <CompanyPage />;
      case 'settings-users': return isAdmin ? <UsersManager /> : <Home onNavigate={setPage} />;
      case 'settings-leavetypes': return isAdmin ? <LeaveTypesSettings /> : <Home onNavigate={setPage} />;
      case 'settings-holidays': return isAdmin ? <HolidaysSettings /> : <Home onNavigate={setPage} />;
      case 'settings-projects': return isAdmin ? <ProjectsModule /> : <Home onNavigate={setPage} />;
      default: return <Home onNavigate={setPage} />;
    }
  };

  return (
    <div className="app-layout">
      <Sidebar currentPage={page} onNavigate={setPage} />
      <div className="main-wrapper">
        <TopHeader
          onOpenMessages={() => setShowMessages(true)}
          onOpenResignations={() => { setPage('resignations-all'); }}
          unreadMessages={unreadMessages}
          unreadResignations={pendingResignations}
        />
        <main className="main-content" key={page}>
          {renderPage()}
        </main>
      </div>
      <MobileBottomNav currentPage={page} onNavigate={setPage} />
      {showMessages && <MessagesPanel onClose={() => setShowMessages(false)} />}
    </div>
  );
}

console.log('🚀 Rendering App...');
try {
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(
    <ErrorBoundary>
      <AuthProvider>
        <App />
      </AuthProvider>
    </ErrorBoundary>
  );
  console.log("✅ Render OK");
} catch (e) {
  console.error("❌ Render failed:", e);
  document.getElementById('root').innerHTML = '<div style="padding:40px;font-family:monospace;color:#dc2626;"><h2>Грешка</h2><pre>' + e.message + '\n\n' + e.stack + '</pre></div>';
}
</script>
</body>
</html>
