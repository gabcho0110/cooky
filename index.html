  .form-group { margin-bottom: 16px; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }

<script>
window.onerror = function(msg, url, line, col, err) {
  var errDiv = document.getElementById('startup-error');
  if (errDiv) {
    errDiv.style.display = 'block';
    errDiv.innerHTML = '<h2>⚠️ Грешка при зареждане</h2>' +
      '<p><b>Съобщение:</b> ' + msg + '</p>' +
      '<p><b>Ред:</b> ' + line + ':' + col + '</p>' +
      '<pre>' + (err && err.stack ? err.stack : 'Няма stack trace') + '</pre>' +
      '<button onclick="location.reload()" style="padding:10px 20px;background:#7c3aed;color:#fff;border:none;border-radius:8px;cursor:pointer;">Презареди</button>';
  }
  console.error('Global error:', msg, line, col, err);
  return false;
};
window.addEventListener('unhandledrejection', function(e) {
  console.error('Unhandled promise rejection:', e.reason);
});

let newWorker = null;
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js', { scope: '/' })
      .then((registration) => {
        console.log('✅ SW registered:', registration.scope);
        registration.addEventListener('updatefound', () => {
          newWorker = registration.installing;
          newWorker.addEventListener('statechange', () => {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              const banner = document.getElementById('update-banner');
              if (banner) banner.classList.add('visible');
            }
          });
        });
        setInterval(() => registration.update(), 60 * 60 * 1000);
      })
      .catch((err) => console.error('❌ SW failed:', err));
  });
  let refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!refreshing) { refreshing = true; window.location.reload(); }
  });
}
window.updateApp = function() {
  if (newWorker) newWorker.postMessage('SKIP_WAITING');
  else window.location.reload();
};

let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  const btnSidebar = document.getElementById('sidebar-install-btn');
  if (btnSidebar) btnSidebar.classList.add('visible');
});
window.addEventListener('appinstalled', () => {
  deferredPrompt = null;
  const btnSidebar = document.getElementById('sidebar-install-btn');
  if (btnSidebar) btnSidebar.classList.remove('visible');
});
window.installPWA = async function() {
  if (!deferredPrompt) {
    alert('Приложението вече е инсталирано или браузърът не поддържа инсталация.');
    return;
  }
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
};

function updateOnlineStatus() {
  const banner = document.getElementById('offline-banner');
  if (!banner) return;
  if (navigator.onLine) banner.classList.remove('visible');
  else banner.classList.add('visible');
}
window.addEventListener('online', updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);
updateOnlineStatus();

let lastTouchEnd = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });

console.log('🚀 Startup loaded');
</script>

  const startStr = start.toLocaleTimeString('bg-BG', { hour: '2-digit', minute: '2-digit' });
  if (!end) return `${startStr} → сега`;
  const endStr = end.toLocaleTimeString('bg-BG', { hour: '2-digit', minute: '2-digit' });
  return `${startStr} → ${endStr} (${fmtTime(end - start)})`;
};
const isSickLeave = (typeId, leaveTypes) => {
  if (!typeId) return false;
  const t = leaveTypes?.[typeId];
  if (!t) return false;
  return typeId === 'sick' || (t.name || '').toLowerCase().includes('болнич');
};
const readFileAsDataURL = (file) => new Promise((resolve, reject) => {
  const reader = new FileReader();
  reader.onload = () => resolve(reader.result);
  reader.onerror = reject;
  reader.readAsDataURL(file);
});
const isHoliday = (dateISO, holidays) => !!(dateISO && holidays && holidays[dateISO]);
const calcWorkingDays = (startDate, endDate, holidays) => {
  const start = new Date(startDate), end = new Date(endDate);
  let count = 0;
  const cur = new Date(start);
  while (cur <= end) {
    const dateStr = `${cur.getFullYear()}-${pad(cur.getMonth()+1)}-${pad(cur.getDate())}`;
    const dow = cur.getDay();
    const isWeekend = dow === 0 || dow === 6;
    if (!isHoliday(dateStr, holidays) && !isWeekend) count++;
    cur.setDate(cur.getDate() + 1);
  }
  return count;
};
const formatFileSize = (dataUrl) => {
  if (!dataUrl) return '';
  const bytes = Math.round((dataUrl.length - 22) * 3 / 4);
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
};
const getMinAllowedDateForEmployee = () => {
  const today = new Date();
  const dow = today.getDay();
  const daysToNextMonday = ((8 - dow) % 7) || 7;
  const nextMonday = new Date(today);
  nextMonday.setDate(today.getDate() + daysToNextMonday + 7);
  return `${nextMonday.getFullYear()}-${pad(nextMonday.getMonth() + 1)}-${pad(nextMonday.getDate())}`;
};

// ================================================================
// PDF FONT LOADER
// ================================================================
let cachedFontBase64 = null;
async function loadCyrillicFont() {
  if (cachedFontBase64) return cachedFontBase64;
  const url = 'https://cdn.jsdelivr.net/gh/googlefonts/roboto@main/src/hinted/Roboto-Regular.ttf';
  const res = await fetch(url);
  if (!res.ok) throw new Error('Не може да зареди шрифт');
  const buf = await res.arrayBuffer();
  let binary = '';
  const bytes = new Uint8Array(buf);
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }
  cachedFontBase64 = btoa(binary);
  return cachedFontBase64;
}

  doc.setTextColor(muted[0], muted[1], muted[2]); doc.setFontSize(9);
  doc.text('Подпис на служител', 20, sigY + 5);
  doc.text(request.userName || '', 20, sigY - 2);
  doc.line(pageWidth - 80, sigY, pageWidth - 20, sigY);
  doc.text('Подпис на ръководител', pageWidth - 80, sigY + 5);
  doc.setFillColor(purple[0], purple[1], purple[2]); doc.rect(0, pageHeight - 8, pageWidth, 8, 'F');
  doc.setTextColor(255, 255, 255); doc.setFontSize(8);
  doc.text(`Генерирано от Clocky • ${now.toLocaleDateString('bg-BG')}`, pageWidth / 2, pageHeight - 3, { align: 'center' });
  doc.save(`Zaiavka_${request.userName?.replace(/\s+/g, '_')}_${request.startDate}.pdf`);
}

const AuthContext = createContext(null);
const useAuth = () => useContext(AuthContext);

function AuthProvider({ children }) {
  const [currentUser, setCurrentUser] = useState(null);
  const [users, setUsers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [dbError, setDbError] = useState(null);
  const seededRef = useRef(false);

  useEffect(() => {
    const stored = localStorage.getItem('clocky_user');
    if (stored) { try { setCurrentUser(JSON.parse(stored)); } catch {} }
    if (!firebaseReady || !db) {
      setLoading(false);
      setDbError("Не може да се свърже с Firebase.");
      return;
    }
    const ref = db.ref('users');
    let resolved = false;
    const handler = (snap) => {
      resolved = true;
      const data = snap.val() || {};
      const list = Object.values(data);
      setUsers(list);
      setLoading(false);
      setDbError(null);

      if (list.length === 0 && !seededRef.current) {
        seededRef.current = true;
        const admin = {
          id: uid(), username: 'admin', password: 'admin123',
          fullName: 'Администратор', email: 'admin@clocky.com',
          roles: ['admin', 'director'],   // ← НОВО: масив от роли
          totalLeaveDays: 25, usedLeaveDays: 0,
          createdAt: new Date().toISOString()
        };
        db.ref('users/' + admin.id).set(admin).catch(e => console.error(e));
      }

      const storedNow = localStorage.getItem('clocky_user');
      if (storedNow) {
        try {
          const u = JSON.parse(storedNow);
          const fresh = list.find(x => x.id === u.id);
          if (fresh) {
            setCurrentUser(fresh);
            localStorage.setItem('clocky_user', JSON.stringify(fresh));
          } else {
            setCurrentUser(null);
            localStorage.removeItem('clocky_user');
          }
        } catch {}
      }
    };
    const errorHandler = (err) => {
      resolved = true;
      setDbError("Грешка: " + err.message);
      setLoading(false);
    };
    ref.on('value', handler, errorHandler);
    const tId = setTimeout(() => {
      if (!resolved) { setLoading(false); setDbError("Връзката отнема твърде дълго."); }
    }, 8000);
    return () => { clearTimeout(tId); ref.off('value', handler); };
  }, []);

  // Seed defaults
  useEffect(() => {
    if (!firebaseReady || !db) return;
    db.ref('leaveTypes').once('value').then(snap => {
      if (!snap.exists()) db.ref('leaveTypes').set(DEFAULT_LEAVE_TYPES).catch(() => {});
    }).catch(() => {});
    db.ref('company').once('value').then(snap => {
      if (!snap.exists()) db.ref('company').set(DEFAULT_COMPANY).catch(() => {});
    }).catch(() => {});
    db.ref('holidays').once('value').then(snap => {
      if (!snap.exists()) {
        const year = new Date().getFullYear();
        const seeded = {};
        Object.entries(DEFAULT_HOLIDAYS).forEach(([md, h]) => {
          const [mm, dd] = md.split('-');
          const id = uid();
          seeded[id] = { id, name: h.name, date: `${year}-${mm}-${dd}`, createdAt: new Date().toISOString() };
        });
        db.ref('holidays').set(seeded).catch(() => {});
      }
    }).catch(() => {});
  }, []);

  const login = (username, password) => {
    if (!firebaseReady) return { error: 'Няма връзка с базата' };
    if (users.length === 0) return { error: 'Базата се зарежда...' };
    const u = users.find(x => x.username === username.trim() && x.password === password);
    if (!u) return { error: 'Грешно потребителско име или парола' };
    setCurrentUser(u);
    localStorage.setItem('clocky_user', JSON.stringify(u));
    return { success: true, user: u };
  };
  const logout = () => { setCurrentUser(null); localStorage.removeItem('clocky_user'); };
  const addUser = async (data) => {
    if (users.find(u => u.username === data.username)) return { error: 'Потребителското име съществува' };
    const newUser = { id: uid(), ...data, usedLeaveDays: 0, createdAt: new Date().toISOString() };
    try { await db.ref('users/' + newUser.id).set(newUser); return { success: true }; }
    catch (e) { return { error: e.message }; }
  };
  const updateUser = async (id, data) => {
    try { await db.ref('users/' + id).update(data); return { success: true }; }
    catch (e) { return { error: e.message }; }
  };
  const deleteUser = async (id) => {
    try { await db.ref('users/' + id).remove(); return { success: true }; }
    catch (e) { return { error: e.message }; }
  };

  return (
    <AuthContext.Provider value={{
      currentUser, users, loading, dbError,
      login, logout, addUser, updateUser, deleteUser
    }}>{children}</AuthContext.Provider>
  );
}

// ================================================================
// FIREBASE HOOKS
// ================================================================
function useFirebaseList(path) {
  const [data, setData] = useState([]);
  useEffect(() => {
    if (!db || !path) return;
    const ref = db.ref(path);
    const handler = (snap) => setData(Object.values(snap.val() || {}));
    ref.on('value', handler);
    return () => ref.off('value', handler);
  }, [path]);
  return data;
}
function useFirebaseObject(path, defaultVal = null) {
  const [data, setData] = useState(defaultVal);
  useEffect(() => {
    if (!db || !path) return;
    const ref = db.ref(path);
    const handler = (snap) => setData(snap.val() || defaultVal);
    ref.on('value', handler);
    return () => ref.off('value', handler);
  }, [path]);
  return data;
}
function useHolidaysMap() {
  const list = useFirebaseList('holidays');
  return useMemo(() => {
    const map = {};
    list.forEach(h => { if (h.date) map[h.date] = h; });
    return map;
  }, [list]);
}

                        className={`nav-sub-item ${currentPage === item.id ? 'active' : ''}`}

        📲 Инсталирай Clocky
      </button>
      <button className="sidebar-logout" onClick={logout}>🚪 Изход</button>
    </aside>
  );
}

// ================================================================
function LeaveRequestModal({ onClose, forUserId = null }) {
  const { currentUser, users } = useAuth();
  const leaveTypes = useFirebaseObject('leaveTypes', DEFAULT_LEAVE_TYPES);
  const holidays = useHolidaysMap();
  const isAdmin = isAdminUser(currentUser);
  const [targetUserId, setTargetUserId] = useState(forUserId || currentUser.id);
  const [form, setForm] = useState({ startDate: '', endDate: '', reason: '', type: 'paid' });
  const [attachment, setAttachment] = useState(null);
  const [attachmentError, setAttachmentError] = useState('');
  const [error, setError] = useState('');
  const [submitting, setSubmitting] = useState(false);
  const fileInputRef = useRef(null);

  const targetUser = users.find(u => u.id === targetUserId) || currentUser;
  const sick = isSickLeave(form.type, leaveTypes);
  const minAllowedDate = isAdmin || sick ? '' : getMinAllowedDateForEmployee();
  const remaining = (targetUser.totalLeaveDays || 0) - (targetUser.usedLeaveDays || 0);
  const days = form.startDate && form.endDate ? daysBetween(form.startDate, form.endDate) : 0;
  const workingDays = form.startDate && form.endDate ? calcWorkingDays(form.startDate, form.endDate, holidays) : 0;
  const selectedType = leaveTypes[form.type];
  const willDeduct = selectedType?.deducts;

  const handleFileChange = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setAttachmentError('');
    if (file.size > 1024 * 1024) return setAttachmentError('Макс. 1MB.');
    if (!file.type.startsWith('image/')) return setAttachmentError('Само изображения');
    try { setAttachment({ name: file.name, dataUrl: await readFileAsDataURL(file) }); }
    catch { setAttachmentError('Грешка'); }
  };

  const submit = async (e) => {
    e.preventDefault(); setError('');
    if (!form.startDate || !form.endDate) return setError('Изберете дати');
    if (form.endDate < form.startDate) return setError('Крайната дата трябва да е след началната');
    if (!isAdmin && !sick && minAllowedDate && form.startDate < minAllowedDate)
      return setError(`Служител не може преди ${formatDate(minAllowedDate)}`);
    if (!form.reason.trim()) return setError('Причината е задължителна');
    if (willDeduct && workingDays > remaining) return setError(`Няма достатъчно дни (остават ${remaining})`);
    if (sick && !attachment) return setError('Задължителен скрийншот за болничен');
    setSubmitting(true);
    const req = {
      id: uid(), userId: targetUser.id, userName: targetUser.fullName,
      startDate: form.startDate, endDate: form.endDate,
      days: workingDays, calendarDays: days, reason: form.reason.trim(),
      type: form.type, status: 'pending', createdAt: new Date().toISOString(),
      createdBy: currentUser.id, attachment: attachment ? attachment.dataUrl : null
    };
    try { await db.ref('leaveRequests/' + req.id).set(req); onClose(); }
    catch (err) { setError('Грешка: ' + err.message); setSubmitting(false); }
  };

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <h3>📝 Нова заявка за отпуск</h3>
        {error && <div className="error">{error}</div>}
        {isAdmin && (
          <div className="form-group">
            <label>За кого? *</label>
            <select value={targetUserId} onChange={e => setTargetUserId(e.target.value)}>
              <option value={currentUser.id}>{currentUser.fullName} (аз)</option>
              {users.filter(u => u.id !== currentUser.id).map(u => (
                <option key={u.id} value={u.id}>{u.fullName}</option>
              ))}
            </select>
          </div>
        )}
        {!isAdmin && !sick && minAllowedDate && (
          <div className="info-box">ℹ️ Можете да пускате от <b>{formatDate(minAllowedDate)}</b> нататък. За болничен – без ограничение.</div>
        )}
        <form onSubmit={submit}>
          <div className="form-group">
            <label>Вид отпуск</label>
            <select value={form.type} onChange={e => setForm({...form, type: e.target.value})}>
              {Object.values(leaveTypes).map(t => (
                <option key={t.id} value={t.id}>{t.name} {t.deducts ? '(приспада се)' : ''}</option>
              ))}
            </select>
          </div>
          <div className="form-row">
            <div className="form-group"><label>От *</label>
              <input type="date" value={form.startDate} onChange={e => setForm({...form, startDate: e.target.value})} required />
            </div>
            <div className="form-group"><label>До *</label>
              <input type="date" value={form.endDate} onChange={e => setForm({...form, endDate: e.target.value})} min={form.startDate} required />
            </div>
          </div>
          {days > 0 && (
            <div className="warning-box">
              <div><b>Календарни дни:</b> {days}</div>
              <div><b>Работни дни:</b> {workingDays}</div>
            </div>
          )}
          <div className="form-group">
            <label>Причина *</label>
            <textarea value={form.reason} onChange={e => setForm({...form, reason: e.target.value})} rows="3" required />
          </div>
          {sick && (
            <div className="form-group">
              <label>📎 Скрийншот *</label>
              {attachmentError && <div className="error">{attachmentError}</div>}
              {!attachment ? (
                <div className="upload-box" onClick={() => fileInputRef.current?.click()}>
                  <div className="upload-icon">📤</div>
                  <div className="upload-text">Кликнете за избор</div>
                </div>
              ) : (
                <div className="upload-box has-file">
                  <img src={attachment.dataUrl} alt="" className="upload-preview" />
                  <div className="upload-file-info">
                    <span>✅ {attachment.name}</span>
                    <button type="button" onClick={() => setAttachment(null)} style={{background:'none', border:'none', color:'#dc2626', cursor:'pointer', fontWeight:'bold'}}>✕</button>
                  </div>
                </div>
              )}
              <input ref={fileInputRef} type="file" accept="image/*" onChange={handleFileChange} style={{display:'none'}} />
            </div>
          )}
          <div className="flex gap-2">
            <button type="submit" className="btn btn-primary" disabled={submitting}>{submitting ? '⏳' : 'Изпрати'}</button>
            <button type="button" className="btn btn-secondary" onClick={onClose}>Отказ</button>
          </div>
        </form>
      </div>
    </div>
  );
}

function LeaveRequestsPage() {
  const { currentUser, users, updateUser } = useAuth();
  const isAdmin = isAdminUser(currentUser);
  const requests = useFirebaseList('leaveRequests');
  const leaveTypes = useFirebaseObject('leaveTypes', DEFAULT_LEAVE_TYPES);
  const company = useFirebaseObject('company', DEFAULT_COMPANY);
  const [filter, setFilter] = useState('pending');
  const [showModal, setShowModal] = useState(false);
  const [selectedRequest, setSelectedRequest] = useState(null);

  if (!isAdmin) return (
    <div className="animate-in"><PageHeader title="Няма достъп" /><div className="card"><div className="empty-state">🔒</div></div></div>
  );

  const getUserName = (id, fb) => users.find(u => u.id === id)?.fullName || fb || '?';
  const getType = (id) => leaveTypes[id] || { name: 'Отпуск', color: '#7c3aed', deducts: true };

  const approve = async (r) => {
    await db.ref('leaveRequests/' + r.id).update({ status: 'approved', reviewedBy: currentUser.id, reviewedAt: new Date().toISOString() });
    const t = getType(r.type);
    if (t.deducts) {
      const u = users.find(x => x.id === r.userId);
      if (u) await updateUser(u.id, { usedLeaveDays: (u.usedLeaveDays || 0) + r.days });
    }
    setSelectedRequest(null);
  };
  const reject = async (r) => {
    await db.ref('leaveRequests/' + r.id).update({ status: 'rejected', reviewedBy: currentUser.id, reviewedAt: new Date().toISOString() });
    setSelectedRequest(null);
  };
  const deleteRequest = async (r) => {
    const t = getType(r.type);
    if (r.status === 'approved' && t.deducts) {
      const u = users.find(x => x.id === r.userId);
      if (u) await updateUser(u.id, { usedLeaveDays: Math.max(0, (u.usedLeaveDays || 0) - r.days) });
    }
    await db.ref('leaveRequests/' + r.id).remove();
    setSelectedRequest(null);
  };

  const visible = filter === 'all' ? requests : requests.filter(r => r.status === filter);
  const sorted = [...visible].sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
  const statusText = { pending: 'Чакаща', approved: 'Одобрена', rejected: 'Отхвърлена' };

  return (
    <div className="animate-in">
      <PageHeader title="Заявки за отпуск" onAdd={() => setShowModal(true)} addLabel="Нова заявка" />
      <div className="stats-grid">
        <div className="stat-card warning"><div className="label">Чакащи</div><div className="value">{requests.filter(r => r.status === 'pending').length}</div></div>
        <div className="stat-card success"><div className="label">Одобрени</div><div className="value">{requests.filter(r => r.status === 'approved').length}</div></div>
        <div className="stat-card"><div className="label">Отхвърлени</div><div className="value">{requests.filter(r => r.status === 'rejected').length}</div></div>
      </div>
      <div className="flex gap-2" style={{marginBottom:'16px', flexWrap:'wrap'}}>
        {['pending','approved','rejected','all'].map(f => (
          <button key={f} className={`btn btn-sm ${filter===f?'btn-primary':'btn-secondary'}`} onClick={()=>setFilter(f)}>
            {f === 'pending' ? 'Чакащи' : f === 'approved' ? 'Одобрени' : f === 'rejected' ? 'Отхвърлени' : 'Всички'}
          </button>
        ))}
      </div>
      <div className="card">
        {sorted.length === 0 ? <div className="empty-state">Няма заявки</div> : (
          <div style={{overflowX:'auto'}}>
            <table>
              <thead><tr><th>Служител</th><th>Вид</th><th>От</th><th>До</th><th>Дни</th><th>Статус</th></tr></thead>
              <tbody>
                {sorted.map(r => {
                  const t = getType(r.type);
                  return (
                    <tr key={r.id} className="clickable" onClick={() => setSelectedRequest(r)}>
                      <td>{getUserName(r.userId, r.userName)}</td>
                      <td>{t.name}</td><td>{formatDate(r.startDate)}</td><td>{formatDate(r.endDate)}</td>
                      <td>{r.days}</td><td><span className={`badge ${r.status}`}>{statusText[r.status]}</span></td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </div>
      {showModal && <LeaveRequestModal onClose={() => setShowModal(false)} />}
      {selectedRequest && (
        <LeaveDetailModal request={selectedRequest} leaveType={getType(selectedRequest.type)}
          onClose={() => setSelectedRequest(null)} companyName={company?.name}
          isAdmin={isAdmin} onDelete={deleteRequest} onApprove={approve} onReject={reject} />
      )}
    </div>
  );
}

function CalendarPage() {
  const { users, currentUser } = useAuth();
  const requests = useFirebaseList('leaveRequests');
  const leaveTypes = useFirebaseObject('leaveTypes', DEFAULT_LEAVE_TYPES);
  const company = useFirebaseObject('company', DEFAULT_COMPANY);
  const holidays = useHolidaysMap();
  const [month, setMonth] = useState(new Date());
  const [selected, setSelected] = useState(null);
  const [showModal, setShowModal] = useState(false);
  const [dayModalDate, setDayModalDate] = useState(null);
  const year = month.getFullYear(), m = month.getMonth();
  const firstDay = new Date(year, m, 1);
  const startWeekday = (firstDay.getDay() + 6) % 7;
  const daysInMonth = new Date(year, m + 1, 0).getDate();
  const days = [];
  for (let i = 0; i < startWeekday; i++) days.push(null);
  for (let d = 1; d <= daysInMonth; d++) days.push(d);
  const dayNames = ['Пн','Вт','Ср','Чт','Пт','Сб','Нд'];
  const getUserName = (id, fb) => users.find(u => u.id === id)?.fullName || fb || '?';
  const getType = (id) => leaveTypes[id] || { name: 'Отпуск', color: '#7c3aed' };
  const isAdmin = isAdminUser(currentUser);

  const getEventsForDay = (day) => {
    if (!day) return [];
    const dateStr = `${year}-${pad(m + 1)}-${pad(day)}`;
    return requests.filter(r => dateStr >= r.startDate && dateStr <= r.endDate);
  };
  const todayStr = todayISO();
  const dayModalEvents = dayModalDate ? requests.filter(r => dayModalDate >= r.startDate && dayModalDate <= r.endDate) : [];
  const dayModalHoliday = dayModalDate ? holidays[dayModalDate] : null;
  const statusLabels = { pending: 'Чакаща', approved: 'Одобрена', rejected: 'Отхвърлена' };

  return (
    <div className="animate-in">
      <PageHeader title="Календар" subtitle="Кликнете на дата" onAdd={() => setShowModal(true)} addLabel="Нова заявка" />
      <div className="card">
        <div className="calendar-header">
          <h3>{monthNames[m]} {year}</h3>
          <div className="calendar-nav">
            <button className="btn btn-secondary btn-sm" onClick={() => setMonth(new Date(year, m - 1, 1))}>←</button>
            <button className="btn btn-secondary btn-sm" onClick={() => setMonth(new Date())}>Днес</button>
            <button className="btn btn-secondary btn-sm" onClick={() => setMonth(new Date(year, m + 1, 1))}>→</button>
          </div>
        </div>
        <div className="calendar-grid">
          {dayNames.map(d => <div key={d} className="calendar-day-name">{d}</div>)}
          {days.map((day, idx) => {
            const dateStr = day ? `${year}-${pad(m + 1)}-${pad(day)}` : '';
            const holiday = isHoliday(dateStr, holidays);
            const holidayInfo = holidays[dateStr];
            const events = getEventsForDay(day);
            return (
              <div key={idx} className={`calendar-day ${!day ? 'empty' : ''} ${dateStr === todayStr ? 'today' : ''} ${holiday ? 'holiday' : ''}`}
                onClick={() => day && setDayModalDate(dateStr)} style={{cursor: day ? 'pointer' : 'default'}}>
                {day && <div className="day-num">{day}</div>}
                {holidayInfo && <div className="holiday-tag" title={holidayInfo.name}>🎉 {holidayInfo.name}</div>}
                {events.slice(0, 2).map(e => {
                  const t = getType(e.type);
                  return (
                    <div key={e.id} className="day-event" style={{background: t.color, opacity: e.status === 'pending' ? 0.5 : 1}}
                      onClick={(ev) => { ev.stopPropagation(); setSelected(e); }}>
                      {getUserName(e.userId, e.userName).split(' ')[0]}
                    </div>
                  );
                })}
              </div>
            );
          })}
        </div>
      </div>

      {dayModalDate && (
        <div className="modal-backdrop" onClick={() => setDayModalDate(null)}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <h3>📅 {formatDate(dayModalDate)}</h3>
            {dayModalHoliday && <div className="danger-box">🎉 {dayModalHoliday.name}</div>}
            {dayModalEvents.length === 0 ? <div className="empty-state">Няма отпуски</div> : (
              dayModalEvents.map(e => {
                const t = getType(e.type);
                return (
                  <div key={e.id} onClick={() => { setSelected(e); setDayModalDate(null); }}
                    style={{padding:'12px', background:'#faf5ff', borderRadius:'10px', marginBottom:'8px', cursor:'pointer', borderLeft:`4px solid ${t.color}`}}>
                    <div style={{fontWeight:600}}>{getUserName(e.userId, e.userName)}</div>
                    <div style={{fontSize:'12px', color:'#7c3aed'}}>{t.name} • {formatDate(e.startDate)} – {formatDate(e.endDate)}</div>
                    <span className={`badge ${e.status}`}>{statusLabels[e.status]}</span>
                  </div>
                );
              })
            )}
            <div className="flex gap-2" style={{marginTop:'16px', justifyContent:'flex-end'}}>
              <button className="btn btn-secondary" onClick={() => setDayModalDate(null)}>Затвори</button>
            </div>
          </div>
        </div>
      )}
      {selected && <LeaveDetailModal request={selected} leaveType={getType(selected.type)}
        onClose={() => setSelected(null)} companyName={company?.name}
        isAdmin={isAdmin} onDelete={() => {}} onApprove={() => {}} onReject={() => {}} />}
      {showModal && <LeaveRequestModal onClose={() => setShowModal(false)} />}
    </div>
  );
}

  const isAdmin = isAdminUser(currentUser);
  const [showModal, setShowModal] = useState(false);
  const [filterUser, setFilterUser] = useState('all');
  const [filterCategory, setFilterCategory] = useState('all');
  const [searchQuery, setSearchQuery] = useState('');
  const [previewDoc, setPreviewDoc] = useState(null);
  const [form, setForm] = useState({ userId: '', name: '', category: 'other', file: null, fileName: '', fileType: '' });
  const [formError, setFormError] = useState('');
  const [submitting, setSubmitting] = useState(false);
  const fileInputRef = useRef(null);
  const getCategory = (id) => DOC_CATEGORIES[id] || DOC_CATEGORIES.other;
  const getUserName = (id) => users.find(u => u.id === id)?.fullName || '?';

  let visibleDocs = isAdmin ? documents : documents.filter(d => d.userId === currentUser.id);
  if (filterUser !== 'all') visibleDocs = visibleDocs.filter(d => d.userId === filterUser);
  if (filterCategory !== 'all') visibleDocs = visibleDocs.filter(d => d.category === filterCategory);
  if (searchQuery.trim()) {
    const q = searchQuery.toLowerCase();
    visibleDocs = visibleDocs.filter(d => (d.name || '').toLowerCase().includes(q));
  }
  visibleDocs = [...visibleDocs].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

  const handleFileChange = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setFormError('');
    if (file.size > 1024 * 1024) return setFormError('Макс. 1MB');
    try { setForm(f => ({...f, file: await readFileAsDataURL(file), fileName: file.name, fileType: file.type})); }
    catch { setFormError('Грешка'); }
  };
  const submit = async (e) => {
    e.preventDefault(); setFormError('');
    if (!form.userId || !form.name.trim() || !form.file) return setFormError('Попълнете всички полета');
    setSubmitting(true);
    try {
      const id = uid();
      await db.ref('documents/' + id).set({
        id, userId: form.userId, name: form.name.trim(), category: form.category,
        fileName: form.fileName, fileType: form.fileType, file: form.file,
        uploadedBy: currentUser.id, createdAt: new Date().toISOString()
      });
      setForm({ userId: '', name: '', category: 'other', file: null, fileName: '', fileType: '' });
      setShowModal(false);
    } catch (err) { setFormError(err.message); }
    setSubmitting(false);
  };
  const remove = async (doc) => { if (isAdmin && confirm(`Изтрий "${doc.name}"?`)) await db.ref('documents/' + doc.id).remove(); };
  const downloadDoc = (doc) => {
    const link = document.createElement('a');
    link.href = doc.file; link.download = doc.fileName || doc.name; link.click();
  };
  const isImageDoc = (doc) => doc.fileType?.startsWith('image/');

  return (
    <div className="animate-in">
      <PageHeader title="Документи" subtitle={`${visibleDocs.length} документа`}
        onAdd={isAdmin ? () => setShowModal(true) : null} addLabel="Качи" />
      <div className="card">
        <div style={{display:'grid', gap:'12px'}}>
          {isAdmin && (
            <div className="form-group" style={{marginBottom:0}}>
              <label>Служител</label>
              <select value={filterUser} onChange={e => setFilterUser(e.target.value)}>
                <option value="all">Всички</option>
                {users.map(u => <option key={u.id} value={u.id}>{u.fullName}</option>)}
              </select>
            </div>
          )}
          <div className="form-group" style={{marginBottom:0}}>
            <label>Категория</label>
            <select value={filterCategory} onChange={e => setFilterCategory(e.target.value)}>
              <option value="all">Всички</option>
              {Object.entries(DOC_CATEGORIES).map(([id, c]) => <option key={id} value={id}>{c.icon} {c.name}</option>)}
            </select>
          </div>
          <div className="form-group" style={{marginBottom:0}}>
            <label>Търсене</label>
            <input value={searchQuery} onChange={e => setSearchQuery(e.target.value)} placeholder="Търсене..." />
          </div>
        </div>
      </div>
      {visibleDocs.length === 0 ? <div className="card"><div className="empty-state">Няма документи</div></div> : (
        <div className="card">
          {visibleDocs.map(doc => {
            const cat = getCategory(doc.category);
            return (
              <div key={doc.id} className="doc-card">
                <div className="doc-icon" style={{background: cat.color + '20', color: cat.color}}>{cat.icon}</div>
                <div className="doc-info">
                  <div className="doc-name">{doc.name}</div>
                  <div className="doc-meta">
                    <span style={{color: cat.color}}>{cat.name}</span>
                    {isAdmin && <span>👤 {getUserName(doc.userId)}</span>}
                    <span>📅 {formatDate(doc.createdAt)}</span>
                  </div>
                </div>
                <div className="doc-actions">
                  {isImageDoc(doc) && <button className="btn btn-secondary btn-sm" onClick={() => setPreviewDoc(doc)}>👁️</button>}
                  <button className="btn btn-primary btn-sm" onClick={() => downloadDoc(doc)}>⬇️</button>
                  {isAdmin && <button className="btn btn-danger btn-sm" onClick={() => remove(doc)}>🗑️</button>}
                </div>
              </div>
            );
          })}
        </div>
      )}
      {previewDoc && (
        <div className="modal-backdrop" onClick={() => setPreviewDoc(null)}>
          <div className="modal wide" onClick={e => e.stopPropagation()}>
            <h3>{previewDoc.name}</h3>
            <img src={previewDoc.file} style={{maxWidth:'100%', maxHeight:'70vh', borderRadius:'8px'}} />
            <div className="flex gap-2" style={{marginTop:'16px', justifyContent:'flex-end'}}>
              <button className="btn btn-secondary" onClick={() => setPreviewDoc(null)}>Затвори</button>
            </div>
          </div>
        </div>
      )}
      {showModal && isAdmin && (
        <div className="modal-backdrop" onClick={() => setShowModal(false)}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <h3>➕ Качване на документ</h3>
            {formError && <div className="error">{formError}</div>}
            <form onSubmit={submit}>
              <div className="form-group"><label>Служител *</label>
                <select value={form.userId} onChange={e => setForm({...form, userId: e.target.value})} required>
                  <option value="">-- Изберете --</option>
                  {users.map(u => <option key={u.id} value={u.id}>{u.fullName}</option>)}
                </select>
              </div>
              <div className="form-group"><label>Име *</label>
                <input value={form.name} onChange={e => setForm({...form, name: e.target.value})} required />
              </div>
              <div className="form-group"><label>Категория</label>
                <select value={form.category} onChange={e => setForm({...form, category: e.target.value})}>
                  {Object.entries(DOC_CATEGORIES).map(([id, c]) => <option key={id} value={id}>{c.icon} {c.name}</option>)}
                </select>
              </div>
              <div className="form-group">
                <label>Файл * (макс. 1MB)</label>
                {!form.file ? (
                  <div className="upload-box" onClick={() => fileInputRef.current?.click()}>
                    <div className="upload-icon">📤</div>
                    <div className="upload-text">Кликнете за избор</div>
                  </div>
                ) : (
                  <div className="upload-box has-file">
                    <div className="upload-file-info">
                      <span>✅ {form.fileName}</span>
                      <button type="button" onClick={() => setForm({...form, file: null, fileName: ''})} style={{background:'none', border:'none', color:'#dc2626', cursor:'pointer'}}>✕</button>
                    </div>
                  </div>
                )}
                <input ref={fileInputRef} type="file" onChange={handleFileChange} style={{display:'none'}} />
              </div>
              <div className="flex gap-2">
                <button type="submit" className="btn btn-primary" disabled={submitting}>{submitting ? '⏳' : 'Качи'}</button>
                <button type="button" className="btn btn-secondary" onClick={() => setShowModal(false)}>Отказ</button>
              </div>
            </form>
          </div>
        </div>
      )}
    </div>
  );
}

// LEAVES REPORTS

function LeavesReports() {
  const { currentUser, users } = useAuth();
  const requests = useFirebaseList('leaveRequests');
  const leaveTypes = useFirebaseObject('leaveTypes', DEFAULT_LEAVE_TYPES);
  const year = new Date().getFullYear();
  const isAdmin = isAdminUser(currentUser);
  const visibleUsers = isAdmin ? users : users.filter(u => u.id === currentUser.id);

  const stats = visibleUsers.map(u => {
    const userReqs = requests.filter(r => r.userId === u.id && r.status === 'approved' && new Date(r.startDate).getFullYear() === year);
    const usedDays = userReqs.reduce((sum, r) => {
      const t = leaveTypes[r.type];
      return sum + (t?.deducts ? r.days : 0);
    }, 0);
    return { user: u, approvedCount: userReqs.length, usedDays, remaining: (u.totalLeaveDays || 0) - usedDays };
  });

  return (
    <div className="animate-in">
      <PageHeader title={isAdmin ? 'Справки' : 'Моите справки'} subtitle={`За ${year} г.`} />
      <div className="card">
        <h3>{isAdmin ? '👥 По служители' : '👤 Моят баланс'}</h3>
        <div style={{overflowX:'auto'}}>
          <table>
            <thead><tr>{isAdmin && <th>Служител</th>}<th>Одобрени</th><th>Използвани</th><th>Общо</th><th>Оставащи</th></tr></thead>
            <tbody>
              {stats.map(s => (
                <tr key={s.user.id}>
                  {isAdmin && <td>{s.user.fullName}</td>}
                  <td>{s.approvedCount}</td><td>{s.usedDays}</td>
                  <td>{s.user.totalLeaveDays || 0}</td>
                  <td><b style={{color: s.remaining < 5 ? '#ef4444' : '#10b981'}}>{s.remaining}</b></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ================================================================
// TIME MODULE
// ================================================================
function TimeModule({ scope }) {
  const { currentUser, users } = useAuth();
  const isAdmin = isAdminUser(currentUser);
  const [now, setNow] = useState(Date.now());
  const [entries, setEntries] = useState([]);
  const projects = useFirebaseList('projects');
  const [pendingCheckout, setPendingCheckout] = useState(null);
  const [stoppingEntry, setStoppingEntry] = useState(null);
  const [stopProjectId, setStopProjectId] = useState('');
  const [editingEntry, setEditingEntry] = useState(null);
  const [editForm, setEditForm] = useState({ checkIn: '', checkOut: '', projectId: '' });
  const [editError, setEditError] = useState('');
  const [detailEntry, setDetailEntry] = useState(null);

  useEffect(() => { const t = setInterval(() => setNow(Date.now()), 1000); return () => clearInterval(t); }, []);
  useEffect(() => {
    if (!db) return;
    const ref = db.ref('timeEntries');
    const handler = (snap) => {
      const list = Object.values(snap.val() || {});
      const filtered = scope === 'all' ? list : list.filter(e => e.userId === currentUser.id);
      filtered.sort((a, b) => new Date(b.checkIn) - new Date(a.checkIn));
      setEntries(filtered);
    };
    ref.on('value', handler);
    return () => ref.off('value', handler);
  }, [scope, currentUser.id]);

  const activeEntry = entries.find(e => !e.checkOut && e.userId === currentUser.id);
  const onPause = activeEntry ? isPaused(activeEntry) : false;
  const elapsed = activeEntry ? calcDuration(activeEntry, now) : 0;
  const activePause = activeEntry ? getActivePause(activeEntry) : null;
  const pauseElapsed = activePause ? now - new Date(activePause.start).getTime() : 0;

  const checkIn = async () => {
    if (activeEntry) return;
    const entry = { id: uid(), userId: currentUser.id, userName: currentUser.fullName,
      checkIn: new Date().toISOString(), checkOut: null, projectId: null, pauses: [] };
    await db.ref('timeEntries/' + entry.id).set(entry);
  };
  const startPause = async () => {
    if (!activeEntry || onPause) return;
    await db.ref('timeEntries/' + activeEntry.id).update({
      pauses: [...(activeEntry.pauses || []), { start: new Date().toISOString(), end: null }]
    });
  };
  const resumePause = async () => {
    if (!activeEntry || !onPause) return;
    const pauses = (activeEntry.pauses || []).map(p => p.end ? p : { ...p, end: new Date().toISOString() });
    await db.ref('timeEntries/' + activeEntry.id).update({ pauses });
  };
  const confirmCheckout = async () => {
    if (!pendingCheckout) return;
    const entry = pendingCheckout.entry;
    const proj = projects.find(p => p.id === pendingCheckout.projectId);
    let pauses = (entry.pauses || []).map(p => p.end ? p : { ...p, end: new Date().toISOString() });
    await db.ref('timeEntries/' + entry.id).update({
      checkOut: new Date().toISOString(), projectId: pendingCheckout.projectId || null,
      projectName: proj?.name || null, pauses
    });
    setPendingCheckout(null);
  };
  const confirmStop = async () => {
    if (!stoppingEntry) return;
    const proj = projects.find(p => p.id === stopProjectId);
    let pauses = (stoppingEntry.pauses || []).map(p => p.end ? p : { ...p, end: new Date().toISOString() });
    await db.ref('timeEntries/' + stoppingEntry.id).update({
      checkOut: new Date().toISOString(), projectId: stopProjectId || null,
      projectName: proj?.name || null, pauses
    });
    setStoppingEntry(null);
  };
  const saveEdit = async () => {
    if (!editingEntry) return;
    const ci = new Date(editForm.checkIn);
    if (isNaN(ci.getTime())) return setEditError('Невалиден час');
    let co = editForm.checkOut ? new Date(editForm.checkOut) : null;
    if (co && isNaN(co.getTime())) return setEditError('Невалиден час');
    const proj = projects.find(p => p.id === editForm.projectId);
    await db.ref('timeEntries/' + editingEntry.id).update({
      checkIn: ci.toISOString(), checkOut: co ? co.toISOString() : null,
      projectId: editForm.projectId || null, projectName: proj?.name || null
    });
    setEditingEntry(null);
  };
  const deleteEntry = async (entry) => { if (confirm('Изтрий?')) await db.ref('timeEntries/' + entry.id).remove(); };

  const myTodayEntries = entries.filter(e => e.userId === currentUser.id && isToday(e.checkIn));
  const todayTotal = myTodayEntries.reduce((sum, e) => sum + calcDuration(e, now), 0);
  const getUserName = (id) => users.find(u => u.id === id)?.fullName || '?';
  const projectSummary = useMemo(() => {
    const map = {};
    entries.filter(e => e.checkOut).forEach(e => {
      const key = e.projectId || 'none';
      if (!map[key]) map[key] = { name: e.projectName || 'Без проект', total: 0, count: 0 };
      map[key].total += calcDuration(e, now); map[key].count++;
    });
    return Object.values(map).sort((a, b) => b.total - a.total);
  }, [entries, now]);

  if (scope === 'me') {
    return (
      <div className="animate-in">
        <PageHeader title="Моето време" />
        <div className="card">
          <h3>🕐 Таймер</h3>
          <div className={`clock-display ${onPause ? 'paused' : activeEntry ? 'working' : ''}`}>
            {activeEntry ? fmtTime(elapsed) : '00:00:00'}
          </div>
          {onPause && <div className="pause-badge">⏸ На пауза ({fmtTime(pauseElapsed)})</div>}
          <p className="clock-status">
            {activeEntry ? (onPause ? 'На пауза' : `На работа от ${new Date(activeEntry.checkIn).toLocaleTimeString('bg-BG')}`) : 'Не сте чекирани'}
          </p>
          <div className="clock-actions">
            {!activeEntry ? <button className="btn btn-success" onClick={checkIn}>✅ Чекиране</button> : (
              <>
                {!onPause ? <button className="btn btn-info" onClick={startPause}>⏸ Пауза</button>
                  : <button className="btn btn-success" onClick={resumePause}>▶ Продължи</button>}
                <button className="btn btn-danger" onClick={() => setPendingCheckout({entry: activeEntry, projectId: activeEntry.projectId || ''})}>⏹ Приключване</button>
              </>
            )}
          </div>
          <div style={{padding:'16px', background:'#faf5ff', borderRadius:'12px'}}>
            <div className="text-muted">Днес:</div>
            <div style={{fontSize:'24px', fontWeight:'700', color:'#10b981'}}>{fmtTime(todayTotal)}</div>
          </div>
        </div>
        {pendingCheckout && (
          <div className="modal-backdrop" onClick={() => setPendingCheckout(null)}>
            <div className="modal" onClick={e => e.stopPropagation()}>
              <h3>⏹ Приключване</h3>
              <div className="form-group"><label>Проект</label>
                <select value={pendingCheckout.projectId} onChange={e => setPendingCheckout({...pendingCheckout, projectId: e.target.value})}>
                  <option value="">-- Без проект --</option>
                  {projects.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                </select>
              </div>
              <div className="flex gap-2"><button className="btn btn-primary" onClick={confirmCheckout}>Потвърди</button>
                <button className="btn btn-secondary" onClick={() => setPendingCheckout(null)}>Отказ</button></div>
            </div>
          </div>
        )}
      </div>
    );
  }

  return (
    <div className="animate-in">
      <PageHeader title={isAdmin ? 'Отчети' : 'Моите отчети'} />
      {isAdmin && projectSummary.length > 0 && (
        <div className="card">
          <h3>📊 По проекти</h3>
          <table><thead><tr><th>Проект</th><th>Записи</th><th>Общо</th></tr></thead>
            <tbody>{projectSummary.map((p, i) => <tr key={i}><td>{p.name}</td><td>{p.count}</td><td>{fmtTime(p.total)}</td></tr>)}</tbody>
          </table>
        </div>
      )}
      <div className="card">
        <h3>📋 Записи</h3>
        {entries.length === 0 ? <div className="empty-state">Няма</div> : (
          <div style={{overflowX:'auto'}}>
            <table>
              <thead><tr>{isAdmin && <th>Служител</th>}<th>Дата</th><th>Начало</th><th>Край</th><th>Проект</th><th>Прод.</th>{isAdmin && <th></th>}</tr></thead>
              <tbody>
                {entries.slice(0, 200).map(e => {
                  const start = new Date(e.checkIn);
                  const end = e.checkOut ? new Date(e.checkOut) : null;
                  const active = !e.checkOut;
                  const paused = isPaused(e);
                  return (
                    <tr key={e.id}>
                      {isAdmin && <td>{getUserName(e.userId) || e.userName}</td>}
                      <td>{start.toLocaleDateString('bg-BG')}</td>
                      <td>{start.toLocaleTimeString('bg-BG')}</td>
                      <td>{end ? end.toLocaleTimeString('bg-BG') : paused ? <span className="badge paused">пауза</span> : <span className="badge active">работи</span>}</td>
                      <td>{e.projectName || '-'}</td>
                      <td>{fmtTime(calcDuration(e, now))}</td>
                      {isAdmin && (
                        <td>
                          <div className="admin-actions">
                            {active && !paused && <button className="btn btn-warning btn-sm" onClick={() => { setStoppingEntry(e); setStopProjectId(e.projectId || ''); }}>⏹</button>}
                            <button className="btn btn-secondary btn-sm" onClick={() => { setEditingEntry(e); setEditForm({checkIn: toDatetimeLocal(e.checkIn), checkOut: e.checkOut ? toDatetimeLocal(e.checkOut) : '', projectId: e.projectId || ''}); }}>✏️</button>
                            <button className="btn btn-danger btn-sm" onClick={() => deleteEntry(e)}>🗑️</button>
                          </div>
                        </td>
                      )}
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </div>
      {stoppingEntry && (
        <div className="modal-backdrop" onClick={() => setStoppingEntry(null)}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <h3>⏹ Спиране</h3>
            <div className="form-group"><label>Проект</label>
              <select value={stopProjectId} onChange={e => setStopProjectId(e.target.value)}>
                <option value="">-- Без --</option>
                {projects.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
              </select>
            </div>
            <div className="flex gap-2"><button className="btn btn-warning" onClick={confirmStop}>Спри</button>
              <button className="btn btn-secondary" onClick={() => setStoppingEntry(null)}>Отказ</button></div>
          </div>
        </div>
      )}
      {editingEntry && (
        <div className="modal-backdrop" onClick={() => setEditingEntry(null)}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <h3>✏️ Редакция</h3>
            {editError && <div className="error">{editError}</div>}
            <div className="form-group"><label>Начало</label><input type="datetime-local" value={editForm.checkIn} onChange={e => setEditForm({...editForm, checkIn: e.target.value})} /></div>
            <div className="form-group"><label>Край</label><input type="datetime-local" value={editForm.checkOut} onChange={e => setEditForm({...editForm, checkOut: e.target.value})} /></div>
            <div className="form-group"><label>Проект</label>
              <select value={editForm.projectId} onChange={e => setEditForm({...editForm, projectId: e.target.value})}>
                <option value="">-- Без --</option>
                {projects.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
              </select>
            </div>
            <div className="flex gap-2"><button className="btn btn-primary" onClick={saveEdit}>Запази</button>
              <button className="btn btn-secondary" onClick={() => setEditingEntry(null)}>Отказ</button></div>
          </div>
        </div>
      )}
    </div>
  );
}

function HolidaysSettings() {
  const holidaysList = useFirebaseList('holidays');
  const [form, setForm] = useState({ name: '', date: '' });
  const [error, setError] = useState('');
  const [showModal, setShowModal] = useState(false);
  const [selectedYear, setSelectedYear] = useState(new Date().getFullYear());
  const sorted = [...holidaysList].filter(h => !selectedYear || new Date(h.date).getFullYear() === selectedYear).sort((a, b) => a.date.localeCompare(b.date));
  const years = [...new Set(holidaysList.map(h => new Date(h.date).getFullYear()))].sort();

  const submit = async (e) => {
    e.preventDefault(); setError('');
    if (!form.name.trim() || !form.date) return setError('Попълнете всички полета');
    if (holidaysList.find(h => h.date === form.date)) return setError('Вече има такъв празник');
    const id = uid();
    await db.ref('holidays/' + id).set({ id, name: form.name.trim(), date: form.date, createdAt: new Date().toISOString() });
    setForm({ name: '', date: '' }); setShowModal(false);
  };
  const remove = async (id) => { if (confirm('Изтрий?')) await db.ref('holidays/' + id).remove(); };
  const addDefaults = async () => {
    if (!confirm(`Добави стандартни за ${selectedYear}?`)) return;
    const existing = holidaysList.filter(h => new Date(h.date).getFullYear() === selectedYear).map(h => h.date);
    const batch = {};
    let added = 0;
    Object.entries(DEFAULT_HOLIDAYS).forEach(([md, h]) => {
      const [mm, dd] = md.split('-');
      const dateISO = `${selectedYear}-${mm}-${dd}`;
      if (existing.includes(dateISO)) return;
      const id = uid();
      batch[id] = { id, name: h.name, date: dateISO, createdAt: new Date().toISOString() };
      added++;
    });
    if (added === 0) return alert('Вече са добавени');
    await db.ref('holidays').update(batch);
  };

  return (

// ================================================================
// USERS MANAGER (multi-role)
// ================================================================
function UsersManager() {
  const { users, addUser, updateUser, deleteUser, currentUser } = useAuth();
  const [showModal, setShowModal] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [editData, setEditData] = useState({});
  const [error, setError] = useState('');
  const [form, setForm] = useState({
    username: '', password: '', fullName: '', email: '',
    roles: ['employee'], totalLeaveDays: 20
  });

  const submit = async (e) => {
    e.preventDefault(); setError('');
    if (form.roles.length === 0) return setError('Изберете поне една роля');
    const res = await addUser({ ...form, totalLeaveDays: Number(form.totalLeaveDays) || 20 });
    if (res.error) return setError(res.error);
    setForm({ username: '', password: '', fullName: '', email: '', roles: ['employee'], totalLeaveDays: 20 });
    setShowModal(false);
  };

  const startEdit = (u) => {
    setEditingId(u.id);
    setEditData({ ...u, roles: getUserRoles(u) });
  };
  const saveEdit = async () => {
    if (!editData.roles || editData.roles.length === 0) return alert('Изберете поне една роля');
    await updateUser(editingId, {
      fullName: editData.fullName, email: editData.email, roles: editData.roles,
      totalLeaveDays: Number(editData.totalLeaveDays),
      password: editData.password, username: editData.username
    });
    setEditingId(null);
  };

  const toggleRole = (roles, role) => {
    if (roles.includes(role)) {
      if (roles.length === 1) return roles; // не премахвай последната
      return roles.filter(r => r !== role);
    }
    return [...roles, role];
  };

  const RoleCheckboxes = ({ values, onChange }) => (
    <div style={{display:'flex', flexWrap:'wrap', gap:'8px'}}>
      {ALL_ROLES.map(r => {
        const meta = ROLE_META[r];
        const checked = values.includes(r);
        return (
          <label key={r} style={{
            display:'flex', alignItems:'center', gap:'6px', cursor:'pointer',
            padding:'6px 10px', borderRadius:'8px',
            background: checked ? meta.color + '15' : '#faf5ff',
            border: `1.5px solid ${checked ? meta.color : '#ede9fe'}`,
            fontSize:'13px', fontWeight: 600,
            color: checked ? meta.color : '#6b7280'
          }}>
            <input type="checkbox" checked={checked}
              onChange={() => onChange(toggleRole(values, r))}
              style={{accentColor: meta.color}} />
            <span>{meta.icon} {meta.bg}</span>
          </label>
        );
      })}
    </div>
  );

  return (
    <div className="animate-in">
      <PageHeader title="Потребители" subtitle={`Всички (${users.length})`} onAdd={() => setShowModal(true)} addLabel="Нов" />
      <div className="card">
        {users.length === 0 ? <div className="empty-state">Няма</div> : (
          <div style={{overflowX:'auto'}}>
            <table>
              <thead><tr><th>Име</th><th>Потребител</th><th>Роли</th><th>Отпуск</th><th>Действия</th></tr></thead>
              <tbody>
                {users.map(u => editingId === u.id ? (
                  <tr key={u.id}>
                    <td><input value={editData.fullName} onChange={e => setEditData({...editData, fullName: e.target.value})} style={{width:'130px'}} /></td>
                    <td><input value={editData.username} onChange={e => setEditData({...editData, username: e.target.value})} style={{width:'100px'}} /></td>
                    <td colSpan="2">
                      <div style={{marginBottom:'6px'}}>
                        <RoleCheckboxes values={editData.roles || []} onChange={(r) => setEditData({...editData, roles: r})} />
                      </div>
                      <input type="number" placeholder="Дни" style={{width:'80px'}} value={editData.totalLeaveDays} onChange={e => setEditData({...editData, totalLeaveDays: e.target.value})} />
                    </td>
                    <td>
                      <button className="btn btn-success btn-sm" onClick={saveEdit}>Запази</button>
                      <button className="btn btn-secondary btn-sm" onClick={() => setEditingId(null)} style={{marginLeft:'4px'}}>Отказ</button>
                    </td>
                  </tr>
                ) : (
                  <tr key={u.id}>
                    <td>{u.fullName}</td>
                    <td><code>{u.username}</code></td>
                    <td>
                      <div style={{display:'flex', flexWrap:'wrap', gap:'4px'}}>
                        {getRoleBadges(u).map((r, i) => (
                          <span key={i} className={`badge ${r.badgeClass}`} style={{fontSize:'10px'}}>{r.icon} {r.bg}</span>
                        ))}
                      </div>
                    </td>
                    <td>{u.usedLeaveDays || 0} / {u.totalLeaveDays}</td>
                    <td>
                      <div className="action-buttons">
                        <button className="btn-pdf" onClick={() => generateUserPDF(u)}>📄 PDF</button>
                        <button className="btn btn-secondary btn-sm" onClick={() => startEdit(u)}>✏️</button>
                        <button className="btn btn-danger btn-sm" onClick={() => {
                          if (u.id === currentUser.id) return alert('Не може себе си');
                          if (confirm('Изтрий?')) deleteUser(u.id);
                        }}>🗑️</button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>
      {showModal && (
        <div className="modal-backdrop" onClick={() => setShowModal(false)}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <h3>➕ Нов потребител</h3>
            {error && <div className="error">{error}</div>}
            <form onSubmit={submit}>
              <div className="form-row">
                <div className="form-group"><label>Потр. име *</label><input value={form.username} onChange={e => setForm({...form, username: e.target.value})} required /></div>
                <div className="form-group"><label>Парола *</label><input value={form.password} onChange={e => setForm({...form, password: e.target.value})} required /></div>
              </div>
              <div className="form-row">
                <div className="form-group"><label>Име *</label><input value={form.fullName} onChange={e => setForm({...form, fullName: e.target.value})} required /></div>
                <div className="form-group"><label>Email *</label><input type="email" value={form.email} onChange={e => setForm({...form, email: e.target.value})} required /></div>
              </div>
              <div className="form-group">
                <label>Роли * (може няколко)</label>
                <RoleCheckboxes values={form.roles} onChange={(r) => setForm({...form, roles: r})} />
              </div>
              <div className="form-group"><label>Отпуск (дни)</label>
                <input type="number" value={form.totalLeaveDays} onChange={e => setForm({...form, totalLeaveDays: e.target.value})} />
              </div>
              <div className="flex gap-2"><button type="submit" className="btn btn-primary">Добави</button>
                <button type="button" className="btn btn-secondary" onClick={() => setShowModal(false)}>Отказ</button></div>
            </form>
          </div>
        </div>
      )}
    </div>
  );
}

function ResignationForm({ onClose }) {
  const { currentUser } = useAuth();
  const [form, setForm] = useState({
    fullName: currentUser.fullName || '',
    position: currentUser.position || '',
    egn: currentUser.egn || '',
    address: currentUser.address || '',
    phone: currentUser.phone || '',
    handoverDate: todayISO()
  });
  const [submitting, setSubmitting] = useState(false);
  const [error, setError] = useState('');

  const submit = async (e) => {
    e.preventDefault(); setError('');
    if (!form.fullName.trim()) return setError('Въведете трите имена');
    if (!form.position.trim()) return setError('Въведете длъжност');
    if (!form.handoverDate) return setError('Изберете дата');

    setSubmitting(true);
    try {
      const handover = new Date(form.handoverDate);
      const startDate = new Date(handover);
      startDate.setDate(startDate.getDate() + 1);
      const endDate = new Date(startDate);
      endDate.setDate(endDate.getDate() + 29);

      const resignation = {
        id: uid(),
        userId: currentUser.id,
        userName: currentUser.fullName,
        fullName: form.fullName.trim(),
        position: form.position.trim(),
        egn: form.egn.trim(),
        address: form.address.trim(),
        phone: form.phone.trim(),
        handoverDate: form.handoverDate,
        startDate: `${startDate.getFullYear()}-${pad(startDate.getMonth()+1)}-${pad(startDate.getDate())}`,
        endDate: `${endDate.getFullYear()}-${pad(endDate.getMonth()+1)}-${pad(endDate.getDate())}`,
        status: 'pending_approval',
        approvals: {},
        rejections: {},
        createdAt: new Date().toISOString(),
        createdBy: currentUser.id
      };
      await db.ref('resignations/' + resignation.id).set(resignation);
      onClose();
      alert('✅ Предизвестието е подадено. Очаква одобрение от всички директори и зам.-директори.');
    } catch (err) { setError('Грешка: ' + err.message); }
    setSubmitting(false);
  };

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <h3>📄 Ново предизвестие за напускане</h3>
        <div className="info-box">
          ℹ️ Предизвестието ще бъде изпратено до <b>всички директори и зам.-директори</b> за одобрение.
          30-дневният срок започва след като <b>всички</b> го одобрят.
        </div>
        {error && <div className="error">{error}</div>}
        <form onSubmit={submit}>
          <div className="form-group"><label>Три имена *</label>
            <input value={form.fullName} onChange={e => setForm({...form, fullName: e.target.value})} required />
          </div>
          <div className="form-row">
            <div className="form-group"><label>Длъжност *</label>
              <input value={form.position} onChange={e => setForm({...form, position: e.target.value})} required />
            </div>
            <div className="form-group"><label>ЕГН</label>
              <input value={form.egn} onChange={e => setForm({...form, egn: e.target.value})} maxLength="10" />
            </div>
          </div>
          <div className="form-group"><label>Адрес</label>
            <input value={form.address} onChange={e => setForm({...form, address: e.target.value})} />
          </div>
          <div className="form-row">
            <div className="form-group"><label>Телефон</label>
              <input value={form.phone} onChange={e => setForm({...form, phone: e.target.value})} />
            </div>
            <div className="form-group"><label>Дата на предаване *</label>
              <input type="date" value={form.handoverDate} onChange={e => setForm({...form, handoverDate: e.target.value})} required />
            </div>
          </div>
          {form.handoverDate && (
            <div className="warning-box">
              <div><b>Дата на предаване:</b> {formatDate(form.handoverDate)}</div>
              <div><b>Начало на срока:</b> {
                (() => { const d = new Date(form.handoverDate); d.setDate(d.getDate()+1);
                  return formatDate(`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`); })()
              }</div>
              <div><b>Последен работен ден:</b> {
                (() => { const d = new Date(form.handoverDate); d.setDate(d.getDate()+30);
                  return formatDate(`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`); })()
              }</div>
            </div>
          )}
          <div className="flex gap-2" style={{justifyContent:'flex-end'}}>
            <button type="button" className="btn btn-secondary" onClick={onClose}>Отказ</button>
            <button type="submit" className="btn btn-primary" disabled={submitting}>{submitting ? '⏳' : '📨 Подай'}</button>
          </div>
        </form>
      </div>
    </div>
  );
}

function ResignationDetail({ resignation, onClose, onChanged }) {
  const { currentUser, users } = useAuth();
  const [processing, setProcessing] = useState(false);
  const canApprove = isApproverUser(currentUser);
  const approvers = users.filter(u => isApproverUser(u));
  const totalApprovers = approvers.length;
  const approvedCount = Object.keys(resignation.approvals || {}).length;
  const userApproved = !!(resignation.approvals?.[currentUser.id]);
  const userRejected = !!(resignation.rejections?.[currentUser.id]);

  const statusMeta = {
    pending_approval: { text: 'Чака одобрение', badge: 'pending' },
    approved: { text: 'Одобрено', badge: 'approved' },
    rejected: { text: 'Отхвърлено', badge: 'rejected' },
    active: { text: 'В сила (30 дни)', badge: 'running' },
    expired: { text: 'Изтекло', badge: 'expired' },
    cancelled: { text: 'Отказано', badge: 'cancelled' }
  };
  const st = statusMeta[resignation.status] || statusMeta.pending_approval;

  const daysLeft = resignation.status === 'active' && resignation.endDate
    ? Math.ceil((new Date(resignation.endDate) - new Date()) / (1000*60*60*24))
    : null;

  const progress = totalApprovers > 0 ? Math.round((approvedCount / totalApprovers) * 100) : 0;

  const approve = async () => {
    if (!confirm('Одобрявате ли това предизвестие?')) return;
    setProcessing(true);
    try {
      const updates = {
        [`approvals/${currentUser.id}`]: {
          approved: true, at: new Date().toISOString(), name: currentUser.fullName
        }
      };
      await db.ref('resignations/' + resignation.id).update(updates);

      // Проверка дали всички са одобрили
      const newApprovals = { ...(resignation.approvals || {}), [currentUser.id]: { approved: true } };
      if (Object.keys(newApprovals).length >= totalApprovers) {
        await db.ref('resignations/' + resignation.id).update({ status: 'active' });
      }
      onChanged && onChanged();
      onClose();
    } catch (e) { alert('Грешка: ' + e.message); }
    setProcessing(false);
  };

  const reject = async () => {
    const comment = prompt('Причина за отхвърляне (по избор):');
    if (comment === null) return;
    setProcessing(true);
    try {
      await db.ref('resignations/' + resignation.id).update({
        [`rejections/${currentUser.id}`]: {
          rejected: true, at: new Date().toISOString(),
          name: currentUser.fullName, comment: comment || ''
        },
        status: 'rejected'
      });
      onChanged && onChanged();
      onClose();
    } catch (e) { alert('Грешка: ' + e.message); }
    setProcessing(false);
  };

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal wide" onClick={e => e.stopPropagation()}>
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:'16px', gap:'8px'}}>
          <div>
            <h3 style={{marginBottom:'4px'}}>📄 Предизвестие за напускане</h3>
            <div className="text-muted" style={{fontSize:'13px'}}>{resignation.fullName}</div>
          </div>
          <span className={`badge ${st.badge}`}>{st.text}</span>
        </div>

        <div className="detail-row"><span className="detail-label">Длъжност</span><span className="detail-value">{resignation.position}</span></div>
        <div className="detail-row"><span className="detail-label">ЕГН</span><span className="detail-value">{resignation.egn || '-'}</span></div>
        <div className="detail-row"><span className="detail-label">Адрес</span><span className="detail-value">{resignation.address || '-'}</span></div>
        <div className="detail-row"><span className="detail-label">Телефон</span><span className="detail-value">{resignation.phone || '-'}</span></div>
        <div className="detail-row"><span className="detail-label">Дата на предаване</span><span className="detail-value">{formatDate(resignation.handoverDate)}</span></div>
        <div className="detail-row"><span className="detail-label">Начало на срока</span><span className="detail-value">{formatDate(resignation.startDate)}</span></div>
        <div className="detail-row"><span className="detail-label">Последен работен ден</span><span className="detail-value"><b>{formatDate(resignation.endDate)}</b></span></div>

        {daysLeft !== null && daysLeft >= 0 && (
          <div className="warning-box" style={{marginTop:'16px'}}>
            ⏳ <b>Остават {daysLeft} дни</b> до изтичане
          </div>
        )}
        {daysLeft !== null && daysLeft < 0 && (
          <div className="danger-box" style={{marginTop:'16px'}}>
            ✅ Предизвестието е изтекло на {formatDate(resignation.endDate)}
          </div>
        )}

        <div style={{marginTop:'20px', padding:'14px', background:'#faf5ff', borderRadius:'12px', border:'1px solid #ede9fe'}}>
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'10px'}}>
            <b style={{color:'#7c3aed'}}>Одобрения от ръководството</b>
            <span style={{fontSize:'13px', color:'#7c3aed'}}>{approvedCount} / {totalApprovers}</span>
          </div>
          <div className="approval-progress">
            <div className={`approval-progress-fill ${progress >= 100 ? 'full' : ''}`} style={{width:`${progress}%`}}></div>
          </div>
          {approvers.length === 0 ? (
            <div className="text-muted" style={{textAlign:'center', padding:'10px'}}>
              Няма назначени директори/зам.-директори
            </div>
          ) : approvers.map(a => {
            const approved = !!resignation.approvals?.[a.id];
            const rejected = !!resignation.rejections?.[a.id];
            const cls = approved ? 'approved' : rejected ? 'rejected' : 'pending';
            const meta = ROLE_META.director;
            return (
              <div key={a.id} className={`approver-row ${cls}`}>
                <div style={{display:'flex', alignItems:'center', gap:'8px'}}>
                  <span>{approved ? '✅' : rejected ? '❌' : '⏳'}</span>
                  <span style={{fontWeight:600}}>{a.fullName}</span>
                  <span style={{fontSize:'11px', color:'#7c3aed'}}>({getRoleLabels(a)})</span>
                </div>
                <div style={{fontSize:'11px', color:'#9ca3af'}}>
                  {approved && resignation.approvals[a.id].at ? formatRelative(resignation.approvals[a.id].at) : ''}
                  {rejected && resignation.rejections[a.id].at ? formatRelative(resignation.rejections[a.id].at) : ''}
                  {!approved && !rejected && 'чака'}
                </div>
              </div>
            );
          })}
        </div>

        <div className="flex gap-2 mt-2" style={{justifyContent:'flex-end', flexWrap:'wrap'}}>
          {canApprove && resignation.status === 'pending_approval' && !userApproved && !userRejected && (
            <>
              <button className="btn btn-danger" onClick={reject} disabled={processing}>✕ Отхвърли</button>
              <button className="btn btn-success" onClick={approve} disabled={processing}>✓ Одобри</button>
            </>
          )}
          {userApproved && <span className="badge approved">✓ Вие одобрихте</span>}
          {userRejected && <span className="badge rejected">✕ Вие отхвърлихте</span>}
          <button className="btn btn-secondary" onClick={onClose}>Затвори</button>
          <button className="btn btn-primary" onClick={() => generateResignationPDF(resignation, currentUser, users)}>🖨️ PDF</button>
        </div>
      </div>
    </div>
  );
}

    const today = todayISO();
    resignations.forEach(r => {

        db.ref('resignations/' + r.id).update({ status: 'expired', expiredAt: new Date().toISOString() }).catch(() => {});

          <div style={{overflowX:'auto'}}>

                  <th>Длъжност</th><th>Предадено</th><th>Последен ден</th><th>Одобрения</th><th>Статус</th>
