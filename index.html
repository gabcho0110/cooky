/* ============ LEAVE REQUESTS PAGE ============ */
function LeaveRequestsPage() {
  const { currentUser, users, updateUser } = useAuth();
  const isAdmin = currentUser.role === 'admin';
  const requests = useFirebaseList('leaveRequests');
  const leaveTypes = useFirebaseObject('leaveTypes', DEFAULT_LEAVE_TYPES);
  const company = useFirebaseObject('company', DEFAULT_COMPANY);
  const [filter, setFilter] = useState('pending');
  const [showModal, setShowModal] = useState(false);
  const [selectedRequest, setSelectedRequest] = useState(null);

  if (!isAdmin) {
    return (
      <div className="animate-in">
        <PageHeader title="Няма достъп" subtitle="Само за администратори" />
        <div className="card"><div className="empty-state">🔒 Нямате права</div></div>
      </div>
    );
  }

  const getUserName = (id, fallback) => users.find(u => u.id === id)?.fullName || fallback || 'Неизвестен';
  const getType = (id) => leaveTypes[id] || { name: 'Отпуск', color: '#7c3aed', deducts: true };

  const approve = async (r) => {
    await db.ref('leaveRequests/' + r.id).update({
      status: 'approved',
      reviewedBy: currentUser.id,
      reviewedAt: new Date().toISOString()
    });
    const t = getType(r.type);
    if (t.deducts) {
      const u = users.find(x => x.id === r.userId);
      if (u) await updateUser(u.id, { usedLeaveDays: (u.usedLeaveDays || 0) + r.days });
    }
    setSelectedRequest(null);
  };

  const reject = async (r) => {
    await db.ref('leaveRequests/' + r.id).update({
      status: 'rejected',
      reviewedBy: currentUser.id,
      reviewedAt: new Date().toISOString()
    });
    setSelectedRequest(null);
  };

  const deleteRequest = async (r) => {
    const t = getType(r.type);
    if (r.status === 'approved' && t.deducts) {
      const u = users.find(x => x.id === r.userId);
      if (u) {
        const newUsed = Math.max(0, (u.usedLeaveDays || 0) - r.days);
        await updateUser(u.id, { usedLeaveDays: newUsed });
      }
    }
    await db.ref('leaveRequests/' + r.id).remove();
    setSelectedRequest(null);
  };

  const visible = filter === 'all' ? requests : requests.filter(r => r.status === filter);
  const sorted = [...visible].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  const statusText = { pending: 'Чакаща', approved: 'Одобрена', rejected: 'Отхвърлена' };

  return (
    <div className="animate-in">
      <PageHeader title="Заявки за отпуск" subtitle="Кликнете на заявка за преглед"
        onAdd={() => setShowModal(true)} addLabel="Нова заявка" />

      <div className="stats-grid">
        <div className="stat-card warning">
          <div className="label">Чакащи</div>
          <div className="value">{requests.filter(r => r.status === 'pending').length}</div>
        </div>
        <div className="stat-card success">
          <div className="label">Одобрени</div>
          <div className="value">{requests.filter(r => r.status === 'approved').length}</div>
        </div>
        <div className="stat-card">
          <div className="label">Отхвърлени</div>
          <div className="value">{requests.filter(r => r.status === 'rejected').length}</div>
        </div>
      </div>

      <div className="flex gap-2" style={{marginBottom:'16px', flexWrap:'wrap'}}>
        {['pending','approved','rejected','all'].map(f => (
          <button key={f} className={`btn btn-sm ${filter===f?'btn-primary':'btn-secondary'}`}
            onClick={()=>setFilter(f)}>
            {f === 'pending' ? 'Чакащи' : f === 'approved' ? 'Одобрени' : f === 'rejected' ? 'Отхвърлени' : 'Всички'}
          </button>
        ))}
      </div>

      <div className="card">
        {sorted.length === 0 ? (
          <div className="empty-state">Няма заявки</div>
        ) : (
          <table>
            <thead>
              <tr>
                <th>Служител</th>
                <th>Вид</th><th>От</th><th>До</th><th>Дни</th><th>Причина</th><th>Прикачено</th><th>Статус</th>
              </tr>
            </thead>
            <tbody>
              {sorted.map(r => {
                const t = getType(r.type);
                return (
                  <tr key={r.id} className="clickable" onClick={() => setSelectedRequest(r)}>
                    <td>{getUserName(r.userId, r.userName)}</td>
                    <td>
                      <span style={{display:'inline-flex', alignItems:'center', gap:'8px'}}>
                        <span style={{width:'8px', height:'8px', borderRadius:'50%', background: t.color}}></span>
                        {t.name}
                      </span>
                    </td>
                    <td>{formatDate(r.startDate)}</td>
                    <td>{formatDate(r.endDate)}</td>
                    <td>{r.days}</td>
                    <td>{r.reason || '-'}</td>
                    <td>{r.attachment ? '📎' : '-'}</td>
                    <td><span className={`badge ${r.status}`}>{statusText[r.status]}</span></td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        )}
      </div>

      {showModal && <LeaveRequestModal onClose={() => setShowModal(false)} />}
      {selectedRequest && (
        <LeaveDetailModal
          request={selectedRequest}
          leaveType={getType(selectedRequest.type)}
          onClose={() => setSelectedRequest(null)}
          companyName={company?.name}
          isAdmin={isAdmin}
          onDelete={deleteRequest}
          onApprove={approve}
          onReject={reject}
        />
      )}
    </div>
  );
}

/* ============ CALENDAR ============ */
function CalendarPage() {
  const { users, currentUser } = useAuth();
  const requests = useFirebaseList('leaveRequests');
  const leaveTypes = useFirebaseObject('leaveTypes', DEFAULT_LEAVE_TYPES);
  const company = useFirebaseObject('company', DEFAULT_COMPANY);
  const holidays = useHolidaysMap();
  const [month, setMonth] = useState(new Date());
  const [selected, setSelected] = useState(null);
  const [showModal, setShowModal] = useState(false);

  const year = month.getFullYear();
  const m = month.getMonth();
  const firstDay = new Date(year, m, 1);
  const startWeekday = (firstDay.getDay() + 6) % 7;
  const daysInMonth = new Date(year, m + 1, 0).getDate();

  const days = [];
  for (let i = 0; i < startWeekday; i++) days.push(null);
  for (let d = 1; d <= daysInMonth; d++) days.push(d);

  const dayNames = ['Пн','Вт','Ср','Чт','Пт','Сб','Нд'];
  const getUserName = (id, fallback) => users.find(u => u.id === id)?.fullName || fallback || '?';
  const getType = (id) => leaveTypes[id] || { name: 'Отпуск', color: '#7c3aed' };
  const isAdmin = currentUser.role === 'admin';

  const deleteRequest = async (r) => {
    await db.ref('leaveRequests/' + r.id).remove();
    setSelected(null);
  };

  const approve = async (r) => {
    await db.ref('leaveRequests/' + r.id).update({
      status: 'approved',
      reviewedBy: currentUser.id,
      reviewedAt: new Date().toISOString()
    });
    setSelected(null);
  };

  const reject = async (r) => {
    await db.ref('leaveRequests/' + r.id).update({
      status: 'rejected',
      reviewedBy: currentUser.id,
      reviewedAt: new Date().toISOString()
    });
    setSelected(null);
  };

  const getEventsForDay = (day) => {
    if (!day) return [];
    const dateStr = `${year}-${pad(m + 1)}-${pad(day)}`;
    return requests.filter(r => dateStr >= r.startDate && dateStr <= r.endDate);
  };

  const todayStr = todayISO();

  return (
    <div className="animate-in">
      <PageHeader title="Табло – Календар" subtitle="Всички отпуски и отсъствия"
        onAdd={() => setShowModal(true)} addLabel="Нова заявка" />

      <div className="card">
        <div className="calendar-header">
          <h3>{monthNames[m]} {year}</h3>
          <div className="calendar-nav">
            <button className="btn btn-secondary btn-sm" onClick={() => setMonth(new Date(year, m - 1, 1))}>←</button>
            <button className="btn btn-secondary btn-sm" onClick={() => setMonth(new Date())}>Днес</button>
            <button className="btn btn-secondary btn-sm" onClick={() => setMonth(new Date(year, m + 1, 1))}>→</button>
          </div>
        </div>
        <div className="calendar-grid">
          {dayNames.map(d => <div key={d} className="calendar-day-name">{d}</div>)}
          {days.map((day, idx) => {
            const dateStr = day ? `${year}-${pad(m + 1)}-${pad(day)}` : '';
            const isTodayDay = dateStr === todayStr;
            const holiday = isHoliday(dateStr, holidays);
            const holidayInfo = holidays[dateStr];
            const events = getEventsForDay(day);
            return (
              <div key={idx} className={`calendar-day ${!day ? 'empty' : ''} ${isTodayDay ? 'today' : ''} ${holiday ? 'holiday' : ''}`}>
                {day && <div className="day-num">{day}</div>}
                {holidayInfo && <div className="holiday-tag" title={holidayInfo.name}>🎉 {holidayInfo.name}</div>}
                {events.slice(0, 2).map(e => {
                  const t = getType(e.type);
                  const opacity = e.status === 'pending' ? 0.5 : 1;
                  return (
                    <div key={e.id} className="day-event" style={{background: t.color, opacity}}
                      title={`${getUserName(e.userId, e.userName)} • ${t.name}`}
                      onClick={() => setSelected(e)}>
                      {getUserName(e.userId, e.userName).split(' ')[0]}
                    </div>
                  );
                })}
                {events.length > 2 && <div style={{fontSize:'10px', color:'#9ca3af'}}>+{events.length - 2}</div>}
              </div>
            );
          })}
        </div>

        <div className="mt-2" style={{display:'flex', gap:'16px', flexWrap:'wrap', marginTop:'20px'}}>
          <span style={{display:'inline-flex', alignItems:'center', gap:'6px', fontSize:'12px', color:'#7c3aed', opacity:0.8}}>
            <span style={{width:'12px', height:'12px', borderRadius:'3px', background:'#fee2e2', border:'1px solid #fecaca'}}></span>
            Национален празник
          </span>
          {Object.values(leaveTypes).map(t => (
            <span key={t.id} style={{display:'inline-flex', alignItems:'center', gap:'6px', fontSize:'12px', color:'#7c3aed', opacity:0.8}}>
              <span style={{width:'12px', height:'12px', borderRadius:'3px', background:t.color}}></span>
              {t.name}
            </span>
          ))}
        </div>
      </div>

      {selected && (
        <LeaveDetailModal
          request={selected}
          leaveType={getType(selected.type)}
          onClose={() => setSelected(null)}
          companyName={company?.name}
          isAdmin={isAdmin}
          onDelete={deleteRequest}
          onApprove={approve}
          onReject={reject}
        />
      )}

      {showModal && <LeaveRequestModal onClose={() => setShowModal(false)} />}
    </div>
  );
}

/* ============ LEAVES REPORTS ============ */
function LeavesReports() {
  const { currentUser, users } = useAuth();
  const requests = useFirebaseList('leaveRequests');
  const leaveTypes = useFirebaseObject('leaveTypes', DEFAULT_LEAVE_TYPES);
  const year = new Date().getFullYear();
  const isAdmin = currentUser.role === 'admin';

  const visibleUsers = isAdmin ? users : users.filter(u => u.id === currentUser.id);

  const stats = visibleUsers.map(u => {
    const userReqs = requests.filter(r =>
      r.userId === u.id &&
      r.status === 'approved' &&
      new Date(r.startDate).getFullYear() === year
    );
    const usedDays = userReqs.reduce((sum, r) => {
      const t = leaveTypes[r.type];
      return sum + (t?.deducts ? r.days : 0);
    }, 0);
    return {
      user: u,
      approvedCount: userReqs.length,
      usedDays,
      remaining: (u.totalLeaveDays || 0) - usedDays
    };
  });

  const myRequests = requests
    .filter(r => r.userId === currentUser.id)
    .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  const getType = (id) => leaveTypes[id] || { name: 'Отпуск', color: '#7c3aed' };
  const statusText = { pending: 'Чакаща', approved: 'Одобрена', rejected: 'Отхвърлена' };

  return (
    <div className="animate-in">
      <PageHeader
        title={isAdmin ? 'Справки' : 'Моите справки'}
        subtitle={isAdmin ? `Всички служители за ${year} г.` : `Вашите отпуски за ${year} г.`}
      />

      <div className="card">
        <h3>{isAdmin ? '👥 По служители' : '👤 Моят баланс'}</h3>
        <table>
          <thead>
            <tr>
              {isAdmin && <th>Служител</th>}
              <th>Одобрени заявки</th>
              <th>Използвани дни</th>
              <th>Общо дни</th>
              <th>Оставащи</th>
            </tr>
          </thead>
          <tbody>
            {stats.map(s => (
              <tr key={s.user.id}>
                {isAdmin && <td>{s.user.fullName}</td>}
                <td>{s.approvedCount}</td>
                <td>{s.usedDays}</td>
                <td>{s.user.totalLeaveDays || 0}</td>
                <td><b style={{color: s.remaining < 5 ? '#ef4444' : '#10b981'}}>{s.remaining}</b></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {!isAdmin && (
        <div className="card">
          <h3>📋 Всички мои заявки ({year})</h3>
          {myRequests.filter(r => new Date(r.startDate).getFullYear() === year).length === 0 ? (
            <div className="empty-state">Няма заявки за {year} г.</div>
          ) : (
            <table>
              <thead><tr><th>Вид</th><th>От</th><th>До</th><th>Дни</th><th>Статус</th></tr></thead>
              <tbody>
                {myRequests.filter(r => new Date(r.startDate).getFullYear() === year).map(r => {
                  const t = getType(r.type);
                  return (
                    <tr key={r.id}>
                      <td>
                        <span style={{display:'inline-flex', alignItems:'center', gap:'8px'}}>
                          <span style={{width:'8px', height:'8px', borderRadius:'50%', background: t.color}}></span>
                          {t.name}
                        </span>
                      </td>
                      <td>{formatDate(r.startDate)}</td>
                      <td>{formatDate(r.endDate)}</td>
                      <td>{r.days}</td>
                      <td><span className={`badge ${r.status}`}>{statusText[r.status]}</span></td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          )}
        </div>
      )}
    </div>
  );
}

/* ============ TIME MODULE ============ */
function TimeModule({ scope }) {
  const { currentUser, users } = useAuth();
  const isAdmin = currentUser.role === 'admin';
  const [now, setNow] = useState(Date.now());
  const [entries, setEntries] = useState([]);
  const projects = useFirebaseList('projects');

  const [pendingCheckout, setPendingCheckout] = useState(null);
  const [stoppingEntry, setStoppingEntry] = useState(null);
  const [stopProjectId, setStopProjectId] = useState('');

  const [editingEntry, setEditingEntry] = useState(null);
  const [editForm, setEditForm] = useState({ checkIn: '', checkOut: '', projectId: '' });
  const [editError, setEditError] = useState('');

  const [detailEntry, setDetailEntry] = useState(null);

  useEffect(() => {
    const t = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(t);
  }, []);

  useEffect(() => {
    if (!db) return;
    const ref = db.ref('timeEntries');
    const handler = (snap) => {
      const data = snap.val() || {};
      const list = Object.values(data);
      const filtered = scope === 'all' ? list : list.filter(e => e.userId === currentUser.id);
      filtered.sort((a, b) => new Date(b.checkIn) - new Date(a.checkIn));
      setEntries(filtered);
    };
    ref.on('value', handler);
    return () => ref.off('value', handler);
  }, [scope, currentUser.id]);

  const activeEntry = entries.find(e => !e.checkOut && e.userId === currentUser.id);
  const onPause = activeEntry ? isPaused(activeEntry) : false;
  const elapsed = activeEntry ? calcDuration(activeEntry, now) : 0;
  const activePause = activeEntry ? getActivePause(activeEntry) : null;
  const pauseElapsed = activePause ? now - new Date(activePause.start).getTime() : 0;

  const checkIn = async () => {
    if (activeEntry) return;
    const entry = {
      id: uid(),
      userId: currentUser.id,
      userName: currentUser.fullName,
      checkIn: new Date().toISOString(),
      checkOut: null,
      projectId: null,
      pauses: []
    };
    await db.ref('timeEntries/' + entry.id).set(entry);
  };

  const startPause = async () => {
    if (!activeEntry || onPause) return;
    const pauses = activeEntry.pauses || [];
    const newPause = { start: new Date().toISOString(), end: null };
    await db.ref('timeEntries/' + activeEntry.id).update({ pauses: [...pauses, newPause] });
  };

  const resumePause = async () => {
    if (!activeEntry || !onPause) return;
    const pauses = (activeEntry.pauses || []).map(p => {
      if (!p.end) return { ...p, end: new Date().toISOString() };
      return p;
    });
    await db.ref('timeEntries/' + activeEntry.id).update({ pauses });
  };

  const openCheckoutModal = () => {
    if (!activeEntry) return;
    setPendingCheckout({
      entry: activeEntry,
      projectId: activeEntry.projectId || (projects[0]?.id || '')
    });
  };

  const confirmCheckout = async () => {
    if (!pendingCheckout) return;
    const entry = pendingCheckout.entry;
    const projId = pendingCheckout.projectId;
    const proj = projects.find(p => p.id === projId);

    let pauses = entry.pauses || [];
    pauses = pauses.map(p => p.end ? p : { ...p, end: new Date().toISOString() });

    await db.ref('timeEntries/' + entry.id).update({
      checkOut: new Date().toISOString(),
      projectId: projId || null,
      projectName: proj?.name || null,
      pauses
    });

    setPendingCheckout(null);
  };

  const cancelCheckout = () => setPendingCheckout(null);

  const openStopModal = (entry) => {
    setStoppingEntry(entry);
    setStopProjectId(entry.projectId || (projects[0]?.id || ''));
  };

  const confirmStop = async () => {
    if (!stoppingEntry) return;
    const proj = projects.find(p => p.id === stopProjectId);
    let pauses = stoppingEntry.pauses || [];
    pauses = pauses.map(p => p.end ? p : { ...p, end: new Date().toISOString() });
    await db.ref('timeEntries/' + stoppingEntry.id).update({
      checkOut: new Date().toISOString(),
      projectId: stopProjectId || null,
      projectName: proj?.name || null,
      pauses
    });
    setStoppingEntry(null);
    setStopProjectId('');
  };

  const openEditModal = (entry) => {
    setEditingEntry(entry);
    setEditForm({
      checkIn: toDatetimeLocal(entry.checkIn),
      checkOut: entry.checkOut ? toDatetimeLocal(entry.checkOut) : '',
      projectId: entry.projectId || ''
    });
    setEditError('');
  };

  const closeEditModal = () => {
    setEditingEntry(null);
    setEditForm({ checkIn: '', checkOut: '', projectId: '' });
    setEditError('');
  };

  const saveEdit = async () => {
    if (!editingEntry) return;
    setEditError('');

    if (!editForm.checkIn) return setEditError('Началният час е задължителен');
    const checkInDate = new Date(editForm.checkIn);
    if (isNaN(checkInDate.getTime())) return setEditError('Невалиден начален час');

    let checkOutDate = null;
    if (editForm.checkOut) {
      checkOutDate = new Date(editForm.checkOut);
      if (isNaN(checkOutDate.getTime())) return setEditError('Невалиден краен час');
      if (checkOutDate < checkInDate) return setEditError('Краят трябва да е след началото');
    }

    const proj = projects.find(p => p.id === editForm.projectId);

    await db.ref('timeEntries/' + editingEntry.id).update({
      checkIn: checkInDate.toISOString(),
      checkOut: checkOutDate ? checkOutDate.toISOString() : null,
      projectId: editForm.projectId || null,
      projectName: proj?.name || null
    });

    closeEditModal();
  };

  const deleteEntry = async (entry) => {
    if (!confirm('Сигурни ли сте?')) return;
    await db.ref('timeEntries/' + entry.id).remove();
  };

  const myTodayEntries = entries.filter(e => e.userId === currentUser.id && isToday(e.checkIn));
  const todayTotal = myTodayEntries.reduce((sum, e) => sum + calcDuration(e, now), 0);

  const getUserName = (id) => users.find(u => u.id === id)?.fullName || '?';

  const projectSummary = useMemo(() => {
    const map = {};
    entries.filter(e => e.checkOut).forEach(e => {
      const dur = calcDuration(e, now);
      const key = e.projectId || 'none';
      if (!map[key]) map[key] = { name: e.projectName || 'Без проект', total: 0, count: 0 };
      map[key].total += dur;
      map[key].count += 1;
    });
    return Object.values(map).sort((a, b) => b.total - a.total);
  }, [entries, now]);

  if (scope === 'me') {
    return (
      <div className="animate-in">
        <PageHeader title="Моето време" subtitle="Чекиране и проследяване" />

        <div className="card">
          <h3>🕐 Таймер</h3>
          <div className={`clock-display ${onPause ? 'paused' : activeEntry ? 'working' : ''}`}>
            {activeEntry ? fmtTime(elapsed) : '00:00:00'}
          </div>

          {onPause && (
            <div className="pause-badge">
              ⏸ На пауза от {new Date(activePause.start).toLocaleTimeString('bg-BG', { hour: '2-digit', minute: '2-digit' })} ({fmtTime(pauseElapsed)})
            </div>
          )}

          <p className="clock-status">
            {activeEntry
              ? (onPause
                  ? `На работа от ${new Date(activeEntry.checkIn).toLocaleTimeString('bg-BG')} • на пауза`
                  : `На работа от ${new Date(activeEntry.checkIn).toLocaleTimeString('bg-BG')}`)
              : 'Не сте чекирани'}
          </p>

          <div className="clock-actions">
            {!activeEntry ? (
              <button className="btn btn-success" onClick={checkIn}>✅ Чекиране</button>
            ) : (
              <>
                {!onPause ? (
                  <button className="btn btn-info" onClick={startPause}>⏸ Пауза</button>
                ) : (
                  <button className="btn btn-success" onClick={resumePause}>▶ Продължи</button>
                )}
                <button className="btn btn-danger" onClick={openCheckoutModal}>⏹ Приключване</button>
              </>
            )}
          </div>

          <div style={{padding:'16px', background:'#faf5ff', borderRadius:'12px', border:'1px solid #ede9fe'}}>
            <div className="text-muted">Общо днес (без паузи):</div>
            <div style={{fontSize:'24px', fontWeight:'700', color:'#10b981'}}>{fmtTime(todayTotal)}</div>
          </div>

          {activeEntry && (activeEntry.pauses && activeEntry.pauses.length > 0) && (
            <div className="mt-2" style={{padding:'12px', background:'#fef3c7', borderRadius:'10px', border:'1px solid #fde68a'}}>
              <div style={{fontSize:'12px', fontWeight:'600', color:'#b45309', marginBottom:'6px'}}>Паузи в текущата смяна:</div>
              {activeEntry.pauses.map((p, i) => (
                <div key={i} style={{fontSize:'12px', color:'#92400e'}}>• {fmtPause(p)}</div>
              ))}
            </div>
          )}
        </div>

        {pendingCheckout && (
          <div className="modal-backdrop" onClick={cancelCheckout}>
            <div className="modal" onClick={e => e.stopPropagation()}>
              <h3>⏹ Приключване на смяна</h3>
              <p className="text-muted" style={{marginBottom:'16px'}}>Изберете проект</p>
              <div className="form-group">
                <label>Проект</label>
                <select value={pendingCheckout.projectId}
                  onChange={e => setPendingCheckout({ ...pendingCheckout, projectId: e.target.value })}>
                  <option value="">-- Без проект --</option>
                  {projects.map(p => (
                    <option key={p.id} value={p.id}>{p.name}</option>
                  ))}
                </select>
              </div>
              <div className="flex gap-2">
                <button className="btn btn-primary" onClick={confirmCheckout}>Потвърди</button>
                <button className="btn btn-secondary" onClick={cancelCheckout}>Отказ</button>
              </div>
            </div>
          </div>
        )}
      </div>
    );
  }

  const isAdminView = scope === 'all' && isAdmin;

  return (
    <div className="animate-in">
      <PageHeader
        title={isAdmin ? 'Отчети за работно време' : 'Моите отчети'}
        subtitle={isAdmin ? 'Всички служители' : 'Пълна история на чекиранията'}
      />

      {isAdmin && (
        <div className="card">
          <h3>📊 Обобщение по проекти</h3>
          {projectSummary.length === 0 ? (
            <div className="empty-state">Няма данни</div>
          ) : (
            <table>
              <thead><tr><th>Проект</th><th>Записи</th><th>Общо време</th></tr></thead>
              <tbody>
                {projectSummary.map((p, i) => (
                  <tr key={i}><td>{p.name}</td><td>{p.count}</td><td>{fmtTime(p.total)}</td></tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      )}

      <div className="card">
        <h3>📋 {isAdmin ? 'Всички записи' : 'История на чекиранията'}</h3>
        {entries.length === 0 ? (
          <div className="empty-state">Няма записи</div>
        ) : (
          <table>
            <thead>
              <tr>
                {isAdmin && <th>Служител</th>}
                <th>Дата</th><th>Начало</th><th>Край</th><th>Проект</th><th>Паузи</th><th>Продължителност</th>
                {isAdmin && <th>Действия</th>}
              </tr>
            </thead>
            <tbody>
              {entries.slice(0, 200).map(e => {
                const start = new Date(e.checkIn);
                const end = e.checkOut ? new Date(e.checkOut) : null;
                const dur = calcDuration(e, now);
                const active = !e.checkOut;
                const paused = isPaused(e);
                const pausesCount = (e.pauses || []).length;

                return (
                  <tr key={e.id}>
                    {isAdmin && <td>{getUserName(e.userId) || e.userName}</td>}
                    <td>{start.toLocaleDateString('bg-BG')}</td>
                    <td>{start.toLocaleTimeString('bg-BG')}</td>
                    <td>
                      {end
                        ? end.toLocaleTimeString('bg-BG')
                        : paused
                          ? <span className="badge paused">на пауза</span>
                          : <span className="badge active">на работа</span>}
                    </td>
                    <td>{e.projectName || '-'}</td>
                    <td>
                      {pausesCount > 0
                        ? <span className="link" onClick={(ev) => { ev.stopPropagation(); setDetailEntry(e); }} title="Виж паузите">
                            {pausesCount} {pausesCount === 1 ? 'пауза' : 'паузи'}
                          </span>
                        : '-'}
                    </td>
                    <td>{fmtTime(dur)}</td>
                    {isAdmin && (
                      <td>
                        <div className="admin-actions">
                          {active && !paused && (
                            <button className="btn btn-warning btn-sm" onClick={() => openStopModal(e)}>⏹ Спри</button>
                          )}
                          <button className="btn btn-secondary btn-sm" onClick={() => openEditModal(e)}>✏️</button>
                          <button className="btn btn-danger btn-sm" onClick={() => deleteEntry(e)}>🗑️</button>
                        </div>
                      </td>
                    )}
                  </tr>
                );
              })}
            </tbody>
          </table>
        )}
      </div>

      {stoppingEntry && (
        <div className="modal-backdrop" onClick={() => setStoppingEntry(null)}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <h3>⏹ Спиране на смяна</h3>
            <p className="text-muted" style={{marginBottom:'16px'}}>
              Служител: <b>{getUserName(stoppingEntry.userId) || stoppingEntry.userName}</b>
            </p>
            <div className="form-group">
              <label>Проект</label>
              <select value={stopProjectId} onChange={e => setStopProjectId(e.target.value)}>
                <option value="">-- Без проект --</option>
                {projects.map(p => (
                  <option key={p.id} value={p.id}>{p.name}</option>
                ))}
              </select>
            </div>
            <div className="flex gap-2" style={{justifyContent:'flex-end'}}>
              <button className="btn btn-secondary" onClick={() => setStoppingEntry(null)}>Отказ</button>
              <button className="btn btn-warning" onClick={confirmStop}>⏹ Спри смяната</button>
            </div>
          </div>
        </div>
      )}

      {editingEntry && (
        <div className="modal-backdrop" onClick={closeEditModal}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <h3>✏️ Редакция на запис</h3>
            <p className="text-muted" style={{marginBottom:'16px'}}>
              Служител: <b>{getUserName(editingEntry.userId) || editingEntry.userName}</b>
            </p>
            {editError && <div className="error">{editError}</div>}
            <div className="form-group">
              <label>Начален час <span className="required-mark">*</span></label>
              <input type="datetime-local" value={editForm.checkIn}
                onChange={e => setEditForm({...editForm, checkIn: e.target.value})} />
            </div>
            <div className="form-group">
              <label>Краен час (празно = още работи)</label>
              <input type="datetime-local" value={editForm.checkOut}
                onChange={e => setEditForm({...editForm, checkOut: e.target.value})} />
            </div>
            <div className="form-group">
              <label>Проект</label>
              <select value={editForm.projectId}
                onChange={e => setEditForm({...editForm, projectId: e.target.value})}>
                <option value="">-- Без проект --</option>
                {projects.map(p => (
                  <option key={p.id} value={p.id}>{p.name}</option>
                ))}
              </select>
            </div>
            <div className="flex gap-2" style={{justifyContent:'flex-end'}}>
              <button className="btn btn-secondary" onClick={closeEditModal}>Отказ</button>
              <button className="btn btn-primary" onClick={saveEdit}>Запази</button>
            </div>
          </div>
        </div>
      )}

      {detailEntry && (
        <div className="modal-backdrop" onClick={() => setDetailEntry(null)}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <h3>📋 Детайли на смяна</h3>
            <div className="detail-row">
              <span className="detail-label">Служител</span>
              <span className="detail-value">{getUserName(detailEntry.userId) || detailEntry.userName}</span>
            </div>
            <div className="detail-row">
              <span className="detail-label">Начало</span>
              <span className="detail-value">{new Date(detailEntry.checkIn).toLocaleString('bg-BG')}</span>
            </div>
            <div className="detail-row">
              <span className="detail-label">Край</span>
              <span className="detail-value">
                {detailEntry.checkOut
                  ? new Date(detailEntry.checkOut).toLocaleString('bg-BG')
                  : <span className="badge active">на работа</span>}
              </span>
            </div>
            <div className="detail-row">
              <span className="detail-label">Общо време</span>
              <span className="detail-value"><b>{fmtTime(calcDuration(detailEntry, now))}</b></span>
            </div>
            <div className="detail-row">
              <span className="detail-label">Проект</span>
              <span className="detail-value">{detailEntry.projectName || '-'}</span>
            </div>

            <h4 style={{marginTop:'20px', marginBottom:'10px', color:'#7c3aed', fontSize:'14px'}}>Паузи:</h4>
            {(detailEntry.pauses || []).length === 0 ? (
              <p className="text-muted">Няма паузи</p>
            ) : (
              <div style={{background:'#fef3c7', borderRadius:'10px', padding:'12px'}}>
                {detailEntry.pauses.map((p, i) => (
                  <div key={i} style={{fontSize:'13px', color:'#92400e', padding:'4px 0'}}>
                    {i + 1}. {fmtPause(p)}
                  </div>
                ))}
              </div>
            )}

            <div className="flex gap-2" style={{justifyContent:'flex-end', marginTop:'20px'}}>
              <button className="btn btn-secondary" onClick={() => setDetailEntry(null)}>Затвори</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ============ HOLIDAYS SETTINGS ============ */
function HolidaysSettings() {
  const holidaysList = useFirebaseList('holidays');
  const [form, setForm] = useState({ name: '', date: '' });
  const [error, setError] = useState('');
  const [showModal, setShowModal] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [editData, setEditData] = useState({});
  const [selectedYear, setSelectedYear] = useState(new Date().getFullYear());

  const sorted = [...holidaysList]
    .filter(h => !selectedYear || new Date(h.date).getFullYear() === selectedYear)
    .sort((a, b) => a.date.localeCompare(b.date));

  const years = [...new Set(holidaysList.map(h => new Date(h.date).getFullYear()))].sort();

  const submit = async (e) => {
    e.preventDefault();
    setError('');
    if (!form.name.trim()) return setError('Въведете име');
    if (!form.date) return setError('Изберете дата');

    const exists = holidaysList.find(h => h.date === form.date);
    if (exists) return setError('Вече има празник на тази дата: ' + exists.name);

    const id = uid();
    const h = { id, name: form.name.trim(), date: form.date, createdAt: new Date().toISOString() };
    await db.ref('holidays/' + id).set(h);
    setForm({ name: '', date: '' });
    setShowModal(false);
    setSelectedYear(new Date(form.date).getFullYear());
  };

  const startEdit = (h) => {
    setEditingId(h.id);
    setEditData({ ...h });
  };

  const saveEdit = async () => {
    if (!editData.name?.trim()) return alert('Въведете име');
    if (!editData.date) return alert('Изберете дата');
    await db.ref('holidays/' + editingId).update({
      name: editData.name.trim(),
      date: editData.date
    });
    setEditingId(null);
  };

  const remove = async (id) => {
    if (confirm('Сигурни ли сте?')) {
      await db.ref('holidays/' + id).remove();
    }
  };

  const addDefaults = async () => {
    if (!confirm(`Да добавя ли стандартните български празници за ${selectedYear} г.?`)) return;
    const existing = holidaysList.filter(h => new Date(h.date).getFullYear() === selectedYear).map(h => h.date);
    const batch = {};
    let added = 0;
    Object.entries(DEFAULT_HOLIDAYS).forEach(([md, h]) => {
      const [mm, dd] = md.split('-');
      const dateISO = `${selectedYear}-${mm}-${dd}`;
      if (existing.includes(dateISO)) return;
      const id = uid();
      batch[id] = { id, name: h.name, date: dateISO, createdAt: new Date().toISOString() };
      added++;
    });
    if (added === 0) return alert('Всички стандартни празници вече са добавени.');
    await db.ref('holidays').update(batch);
    alert(`Добавени ${added} празника.`);
  };

  return (
    <div className="animate-in">
      <PageHeader title="Всички празници" subtitle="Национални празници - автоматично почивни дни"
        onAdd={() => setShowModal(true)} addLabel="Нов празник" />

      <div className="warning-box">
        ℹ️ Празниците автоматично се маркират в календара и <b>не се броят</b> като работни дни.
      </div>

      <div className="card">
        <div style={{display:'flex', gap:'12px', alignItems:'center', flexWrap:'wrap', marginBottom:'16px'}}>
          <div style={{display:'flex', alignItems:'center', gap:'8px'}}>
            <label style={{fontSize:'13px', fontWeight:600, color:'#4c1d95'}}>Година:</label>
            <select value={selectedYear}
              onChange={(e) => setSelectedYear(Number(e.target.value))}
              style={{padding:'8px 12px', border:'1.5px solid #e9d5ff', borderRadius:'10px', fontSize:'14px', fontFamily:'inherit'}}>
              {!years.includes(selectedYear) && <option value={selectedYear}>{selectedYear}</option>}
              {years.map(y => <option key={y} value={y}>{y}</option>)}
            </select>
          </div>
          <button className="btn btn-info btn-sm" onClick={addDefaults}>
            🎉 Добави стандартни празници за {selectedYear}
          </button>
          <span className="text-muted" style={{marginLeft:'auto'}}>
            Общо: <b>{sorted.length}</b> празника
          </span>
        </div>

        {sorted.length === 0 ? (
          <div className="empty-state">Няма добавени празници за {selectedYear} г.</div>
        ) : (
          <table>
            <thead><tr><th>Дата</th><th>Ден</th><th>Име</th><th>Действия</th></tr></thead>
            <tbody>
              {sorted.map(h => {
                const d = new Date(h.date);
                const dayName = d.toLocaleDateString('bg-BG', { weekday: 'long' });
                const isEditing = editingId === h.id;
                return (
                  <tr key={h.id}>
                    <td>
                      {isEditing ? (
                        <input type="date" value={editData.date}
                          onChange={e => setEditData({...editData, date: e.target.value})}
                          style={{padding:'6px 10px', border:'1.5px solid #e9d5ff', borderRadius:'8px'}} />
                      ) : (
                        <b>{formatDate(h.date)}</b>
                      )}
                    </td>
                    <td style={{textTransform:'capitalize', color:'#7c3aed', opacity:0.8}}>{dayName}</td>
                    <td>
                      {isEditing ? (
                        <input value={editData.name}
                          onChange={e => setEditData({...editData, name: e.target.value})}
                          style={{padding:'6px 10px', border:'1.5px solid #e9d5ff', borderRadius:'8px', width:'100%'}} />
                      ) : (
                        h.name
                      )}
                    </td>
                    <td>
                      {isEditing ? (
                        <>
                          <button className="btn btn-success btn-sm" onClick={saveEdit}>Запази</button>
                          <button className="btn btn-secondary btn-sm" style={{marginLeft:'4px'}} onClick={() => setEditingId(null)}>Отказ</button>
                        </>
                      ) : (
                        <>
                          <button className="btn btn-secondary btn-sm" onClick={() => startEdit(h)}>✏️</button>
                          <button className="btn btn-danger btn-sm" style={{marginLeft:'4px'}} onClick={() => remove(h.id)}>🗑️</button>
                        </>
                      )}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        )}
      </div>

      {showModal && (
        <div className="modal-backdrop" onClick={() => setShowModal(false)}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <h3>➕ Нов празник</h3>
            {error && <div className="error">{error}</div>}
            <form onSubmit={submit}>
              <div className="form-group">
                <label>Име на празника <span className="required-mark">*</span></label>
                <input value={form.name} onChange={e => setForm({...form, name: e.target.value})}
                  placeholder="напр. Нова година" required autoFocus />
              </div>
              <div className="form-group">
                <label>Дата <span className="required-mark">*</span></label>
                <input type="date" value={form.date} onChange={e => setForm({...form, date: e.target.value})} required />
              </div>
              <div className="flex gap-2">
                <button type="submit" className="btn btn-primary">Добави</button>
                <button type="button" className="btn btn-secondary" onClick={() => setShowModal(false)}>Отказ</button>
              </div>
            </form>
          </div>
        </div>
      )}
    </div>
  );
}

/* ============ USERS MANAGER ============ */
function UsersManager() {
  const { users, addUser, updateUser, deleteUser, currentUser } = useAuth();
  const [form, setForm] = useState({ username: '', password: '', fullName: '', email: '', role: 'employee', totalLeaveDays: 20 });
  const [error, setError] = useState('');
  const [showModal, setShowModal] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [editData, setEditData] = useState({});
  const [downloadingId, setDownloadingId] = useState(null);

  const submit = async (e) => {
    e.preventDefault();
    setError('');
    const res = await addUser({ ...form, totalLeaveDays: Number(form.totalLeaveDays) || 20 });
    if (res.error) return setError(res.error);
    setForm({ username: '', password: '', fullName: '', email: '', role: 'employee', totalLeaveDays: 20 });
    setShowModal(false);
  };

  const startEdit = (u) => { setEditingId(u.id); setEditData({ ...u }); };

  const saveEdit = async () => {
    await updateUser(editingId, {
      fullName: editData.fullName,
      email: editData.email,
      role: editData.role,
      totalLeaveDays: Number(editData.totalLeaveDays),
      password: editData.password,
      username: editData.username
    });
    setEditingId(null);
  };

  const remove = async (id) => {
    if (id === currentUser.id) return alert('Не можете да изтриете себе си');
    if (confirm('Сигурни ли сте?')) await deleteUser(id);
  };

  const downloadPDF = async (user) => {
    setDownloadingId(user.id);
    try { await generateUserPDF(user); }
    catch (e) { alert('Грешка: ' + e.message); }
    setTimeout(() => setDownloadingId(null), 800);
  };

  return (
    <div className="animate-in">
      <PageHeader title="Потребители" subtitle={`Всички потребители (${users.length})`}
        onAdd={() => setShowModal(true)} addLabel="Нов потребител" />

      <div className="card">
        {users.length === 0 ? (
          <div className="empty-state">Няма потребители</div>
        ) : (
          <table>
            <thead>
              <tr><th>Име</th><th>Потребител</th><th>Парола</th><th>Email</th><th>Роля</th><th>Отпуск</th><th>Действия</th></tr>
            </thead>
            <tbody>
              {users.map(u => editingId === u.id ? (
                <tr key={u.id}>
                  <td><input value={editData.fullName} onChange={e => setEditData({...editData, fullName: e.target.value})} style={{width:'130px'}} /></td>
                  <td><input value={editData.username} onChange={e => setEditData({...editData, username: e.target.value})} style={{width:'100px'}} /></td>
                  <td><input value={editData.password} onChange={e => setEditData({...editData, password: e.target.value})} style={{width:'100px'}} /></td>
                  <td><input value={editData.email} onChange={e => setEditData({...editData, email: e.target.value})} style={{width:'150px'}} /></td>
                  <td>
                    <select value={editData.role} onChange={e => setEditData({...editData, role: e.target.value})}>
                      <option value="employee">Служител</option>
                      <option value="admin">Админ</option>
                    </select>
                  </td>
                  <td><input type="number" style={{width:'60px'}} value={editData.totalLeaveDays} onChange={e => setEditData({...editData, totalLeaveDays: e.target.value})} /></td>
                  <td>
                    <div className="action-buttons">
                      <button className="btn btn-success btn-sm" onClick={saveEdit}>Запази</button>
                      <button className="btn btn-secondary btn-sm" onClick={() => setEditingId(null)}>Отказ</button>
                    </div>
                  </td>
                </tr>
              ) : (
                <tr key={u.id}>
                  <td>{u.fullName}</td>
                  <td><code>{u.username}</code></td>
                  <td><code>{u.password}</code></td>
                  <td>{u.email}</td>
                  <td><span className="badge pending">{u.role === 'admin' ? 'Админ' : 'Служител'}</span></td>
                  <td>{u.usedLeaveDays || 0} / {u.totalLeaveDays}</td>
                  <td>
                    <div className="action-buttons">
                      <button className="btn-pdf" onClick={() => downloadPDF(u)} disabled={downloadingId === u.id}>

                      </button>
                      <button className="btn btn-secondary btn-sm" onClick={() => startEdit(u)}>✏️</button>
                      <button className="btn btn-danger btn-sm" onClick={() => remove(u.id)}>🗑️</button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>

      {showModal && (
        <div className="modal-backdrop" onClick={() => setShowModal(false)}>

                  <label>Парола *</label>
                  <input value={form.password} onChange={e => setForm({...form, password: e.target.value})} required />
                </div>
              </div>
              <div className="form-row">
                <div className="form-group">
                  <label>Пълно име *</label>
                  <input value={form.fullName} onChange={e => setForm({...form, fullName: e.target.value})} required />
                </div>
                <div className="form-group">
                  <label>Email *</label>
                  <input type="email" value={form.email} onChange={e => setForm({...form, email: e.target.value})} required />

                <div className="form-group">
                  <label>Роля</label>

              </div>
              <div className="flex gap-2">
                <button type="submit" className="btn btn-primary">Добави</button>
                <button type="button" className="btn btn-secondary" onClick={() => setShowModal(false)}>Отказ</button>
              </div>
            </form>
          </div>
        </div>
      )}
    </div>
  );
}

              <div className="form-group">
                <label>Приспада се от платения отпуск?</label>
                <select value={form.deducts ? 'yes' : 'no'} onChange={e => setForm({...form, deducts: e.target.value === 'yes'})}>
                  <option value="yes">Да</option>
                  <option value="no">Не</option>
                </select>
              </div>
              <div className="form-group">
                <label>Цвят</label>
                <div className="color-presets">
                  {COLOR_PRESETS.map(c => (
                    <div key={c}
                      className={`color-dot ${form.color === c ? 'selected' : ''}`}
                      style={{background: c}}
                      onClick={() => setForm({...form, color: c})} />
                  ))}
                </div>
              </div>
              <div className="flex gap-2">
                <button type="submit" className="btn btn-primary">Добави</button>
                <button type="button" className="btn btn-secondary" onClick={() => setShowModal(false)}>Отказ</button>
              </div>
            </form>
          </div>
        </div>
      )}
    </div>
  );
}

/* ============ APP ============ */
function App() {
  const { currentUser, loading } = useAuth();
  const [page, setPage] = useState('home');

  if (loading) {
    return (
      <div className="loading-screen">
        <div className="loading-card">
          <h1>⏰ Clocky</h1>
          <div className="spinner"></div>
          <p className="text-muted mt-2">Зареждане...</p>
        </div>
      </div>
    );
  }

  if (!currentUser) return <Login />;

  const isAdmin = currentUser.role === 'admin';

  const renderPage = () => {
    switch (page) {
      case 'home': return <Home onNavigate={setPage} />;
      case 'leaves-calendar': return <CalendarPage />;
      case 'leaves-my': return <MyRequests />;
      case 'leaves-requests': return isAdmin ? <LeaveRequestsPage /> : <Home onNavigate={setPage} />;
      case 'leaves-reports': return <LeavesReports />;
      case 'time-me': return <TimeModule scope="me" />;
      case 'time-reports': return <TimeModule scope={isAdmin ? 'all' : 'reports'} />;
      case 'company-data': return <CompanyPage />;
      case 'settings-users': return isAdmin ? <UsersManager /> : <Home onNavigate={setPage} />;
      case 'settings-leavetypes': return isAdmin ? <LeaveTypesSettings /> : <Home onNavigate={setPage} />;
      case 'settings-holidays': return isAdmin ? <HolidaysSettings /> : <Home onNavigate={setPage} />;
      case 'settings-projects': return isAdmin ? <ProjectsModule /> : <Home onNavigate={setPage} />;
      default: return <Home onNavigate={setPage} />;
    }
  };

  return (
    <div className="app-layout">
      <Sidebar currentPage={page} onNavigate={setPage} />
      <div className="main-wrapper">
        <TopHeader />
        <main className="main-content" key={page}>
          {renderPage()}
        </main>
      </div>
    </div>
  );
}

/* ============ RENDER ============ */
console.log('🚀 Rendering App...');
try {
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(
    <ErrorBoundary>
      <AuthProvider>
        <App />
      </AuthProvider>
    </ErrorBoundary>
  );
  console.log("✅ Render called successfully");
} catch (e) {
  console.error("❌ Render failed:", e);
  document.getElementById('root').innerHTML = '<div style="padding:40px;font-family:monospace;color:#dc2626;background:#fef2f2;min-height:100vh;"><h2>Грешка при стартиране</h2><pre>' + e.message + '\n\n' + e.stack + '</pre></div>';
}
</script>
</body>
</html>
