function ComposeMessage({ onClose, users, currentUser }) {
  const [form, setForm] = useState({ subject: '', body: '', recipients: [] });
  const [error, setError] = useState('');
  const [sending, setSending] = useState(false);

  const toggleRecipient = function(id) {
    setForm(function(f) {
      const has = f.recipients.indexOf(id) !== -1;
      return Object.assign({}, f, {
        recipients: has ? f.recipients.filter(function(x){ return x !== id; }) : f.recipients.concat([id])
      });
    });
  };
  const addByRole = function(role) {
    const ids = users.filter(function(u){ return hasRole(u, role); }).map(function(u){ return u.id; });
    setForm(function(f) {
      return Object.assign({}, f, { recipients: Array.from(new Set(f.recipients.concat(ids))) });
    });
  };
  const addAll = function() {
    setForm(function(f) { return Object.assign({}, f, { recipients: users.map(function(u){ return u.id; }) }); });
  };
  const clearRecipients = function() {
    setForm(function(f) { return Object.assign({}, f, { recipients: [] }); });
  };

  const submit = async function(e) {
    e.preventDefault(); setError('');
    if (!form.subject.trim()) return setError('Тема');
    if (!form.body.trim()) return setError('Текст');
    if (form.recipients.length === 0) return setError('Получатели');
    setSending(true);
    try {
      const recipientsNames = form.recipients.map(function(id) {
        const u = users.find(function(x){ return x.id === id; });
        return u ? u.fullName : '';
      }).filter(Boolean);
      const msg = {
        id: uid(),
        authorId: currentUser.id,
        authorName: currentUser.fullName,
        recipients: form.recipients,
        recipientsNames: recipientsNames,
        subject: form.subject.trim(),
        body: form.body.trim(),
        readBy: [],
        createdAt: new Date().toISOString()
      };
      await db.ref('messages/' + msg.id).set(msg);
      onClose();
    } catch (err) { setError('Грешка: ' + err.message); }
    setSending(false);
  };

  return (
    <form onSubmit={submit} className="msg-panel-body" style={{display:'flex', flexDirection:'column'}}>
      {error && <div className="error">{error}</div>}
      <div className="form-group">
        <label>До: ({form.recipients.length})</label>
        <div style={{display:'flex', gap:'6px', flexWrap:'wrap', marginBottom:'8px'}}>
          <button type="button" className="btn btn-secondary btn-sm" onClick={addAll}>👥 Всички</button>
          <button type="button" className="btn btn-secondary btn-sm" onClick={function(){ addByRole('director'); }}>🏛️ Директори</button>
          <button type="button" className="btn btn-secondary btn-sm" onClick={function(){ addByRole('deputy_director'); }}>🎖️ Зам.</button>
          <button type="button" className="btn btn-secondary btn-sm" onClick={function(){ addByRole('admin'); }}>👑 Админи</button>
          <button type="button" className="btn btn-secondary btn-sm" onClick={function(){ addByRole('employee'); }}>👤 Служители</button>
          {form.recipients.length > 0 && (
            <button type="button" className="btn btn-danger btn-sm" onClick={clearRecipients}>✕ Изчисти</button>
          )}
        </div>
        <div style={{maxHeight:'200px', overflowY:'auto', border:'1.5px solid #e9d5ff', borderRadius:'10px', padding:'8px', background:'#fff'}}>
          {users.map(function(u) {
            const sel = form.recipients.indexOf(u.id) !== -1;
            return (
              <label key={u.id} style={{
                display:'flex', alignItems:'center', gap:'8px', padding:'8px',
                borderRadius:'8px', cursor:'pointer', background: sel ? '#f3e8ff' : 'transparent',
                borderBottom:'1px solid #faf5ff'
              }}>
                <input type="checkbox" checked={sel} onChange={function(){ toggleRecipient(u.id); }} style={{accentColor:'#7c3aed'}} />
                <span style={{fontWeight:600, fontSize:'13px'}}>{u.fullName}</span>
                <span style={{fontSize:'11px', color:'#7c3aed', marginLeft:'auto'}}>{getRoleLabels(u)}</span>
              </label>
            );
          })}
        </div>
      </div>
      <div className="form-group">
        <label>Тема *</label>
        <input value={form.subject} onChange={function(e){ setForm(Object.assign({}, form, { subject: e.target.value })); }} required />
      </div>
      <div className="form-group" style={{flex:1, display:'flex', flexDirection:'column'}}>
        <label>Съобщение *</label>
        <textarea value={form.body} onChange={function(e){ setForm(Object.assign({}, form, { body: e.target.value })); }}
          style={{minHeight:'200px', resize:'vertical', fontFamily:'inherit'}} required />
      </div>
      <div style={{display:'flex', gap:'8px', justifyContent:'flex-end', paddingTop:'12px', borderTop:'1px solid #ede9fe'}}>
        <button type="button" className="btn btn-secondary" onClick={onClose}>Отказ</button>
        <button type="submit" className="btn btn-primary" disabled={sending}>{sending ? '⏳' : '📨 Изпрати'}</button>
      </div>
    </form>
  );
}

function MessagesPanel({ onClose }) {
  const { currentUser, users } = useAuth();
  const [view, setView] = useState('inbox');
  const [selectedMsg, setSelectedMsg] = useState(null);
  const [searchQuery, setSearchQuery] = useState('');
  const allMessages = useFirebaseList('messages');
  const myMessages = allMessages.filter(function(m) {
    return (m.recipients || []).indexOf(currentUser.id) !== -1;
  });
  const sentMessages = allMessages.filter(function(m){ return m.authorId === currentUser.id; });
  const unreadCount = myMessages.filter(function(m){ return (m.readBy || []).indexOf(currentUser.id) === -1; }).length;

  let visibleMessages = view === 'sent' ? sentMessages : myMessages;
  if (searchQuery.trim()) {
    const q = searchQuery.toLowerCase();
    visibleMessages = visibleMessages.filter(function(m) {
      return (m.subject || '').toLowerCase().indexOf(q) !== -1 ||
             (m.body || '').toLowerCase().indexOf(q) !== -1 ||
             (m.authorName || '').toLowerCase().indexOf(q) !== -1;
    });
  }
  visibleMessages = visibleMessages.slice().sort(function(a, b){ return new Date(b.createdAt) - new Date(a.createdAt); });

  const openMessage = async function(msg) {
    setSelectedMsg(msg); setView('detail');
    if ((msg.readBy || []).indexOf(currentUser.id) === -1) {
      const readBy = (msg.readBy || []).concat([currentUser.id]);
      await db.ref('messages/' + msg.id).update({ readBy: readBy });
    }
  };
  const deleteMessage = async function(msg) {
    if (!confirm('Изтрий?')) return;
    await db.ref('messages/' + msg.id).remove();
    setSelectedMsg(null); setView('inbox');
  };

  const headerText = view === 'compose' ? '✉️ Ново съобщение' :
                     view === 'detail' ? '📩 Преглед' :
                     view === 'sent' ? '📤 Изпратени' :
                     '📥 Входящи' + (unreadCount > 0 ? ' (' + unreadCount + ')' : '');

  return (
    <React.Fragment>
      <div className="msg-panel-backdrop" onClick={onClose} />
      <div className="msg-panel">
        <div className="msg-panel-header">
          <h2>{headerText}</h2>
          <button className="msg-panel-close" onClick={function() {
            if (view === 'detail' || view === 'compose') { setView('inbox'); setSelectedMsg(null); }
            else onClose();
          }}>✕</button>
        </div>
        {(view === 'inbox' || view === 'sent') && (
          <React.Fragment>
            <div className="msg-actions-bar">
              <button className="btn btn-primary btn-sm" onClick={function(){ setView('compose'); }}>➕ Ново</button>
              <button className={'btn btn-sm ' + (view === 'inbox' ? 'btn-primary' : 'btn-secondary')} onClick={function(){ setView('inbox'); }}>📥 Входящи</button>
              <button className={'btn btn-sm ' + (view === 'sent' ? 'btn-primary' : 'btn-secondary')} onClick={function(){ setView('sent'); }}>📤 Изпратени</button>
            </div>
            <div style={{padding:'12px 20px', borderBottom:'1px solid #ede9fe'}}>
              <input className="msg-search" placeholder="🔍 Търсене..." value={searchQuery} onChange={function(e){ setSearchQuery(e.target.value); }} />
            </div>
            <div className="msg-panel-body">
              {visibleMessages.length === 0 ? (
                <div className="msg-empty">
                  <div style={{fontSize:'48px', marginBottom:'12px'}}>📭</div>
                  <div>{searchQuery ? 'Няма намерени' : view === 'sent' ? 'Няма изпратени' : 'Няма съобщения'}</div>
                </div>
              ) : visibleMessages.map(function(m) {
                const unread = (m.readBy || []).indexOf(currentUser.id) === -1 && view === 'inbox';
                const recCount = (m.recipients || []).length;
                return (
                  <div key={m.id} className={'msg-item ' + (unread ? 'unread' : '')} onClick={function(){ openMessage(m); }}>
                    <div className="msg-item-header">
                      <span className="msg-author">{view === 'sent' ? 'До: ' + recCount + ' получатели' : m.authorName}</span>
                      <span className="msg-date">{formatRelative(m.createdAt)}</span>
                    </div>
                    <div className="msg-subject">{m.subject || '(без тема)'}</div>
                    <div className="msg-preview">{(m.body || '').slice(0, 80)}{(m.body || '').length > 80 ? '...' : ''}</div>
                    {recCount > 0 && <div className="msg-participants">👥 {recCount} получатели</div>}
                  </div>
                );
              })}
            </div>
          </React.Fragment>
        )}
        {view === 'detail' && selectedMsg && (
          <div className="msg-panel-body">
            <div className="msg-detail">
              <h2>{selectedMsg.subject || '(без тема)'}</h2>
              <div className="msg-detail-meta">
                <span>👤 <b>{selectedMsg.authorName}</b></span>
                <span>📅 {formatDateTime(selectedMsg.createdAt)}</span>
              </div>
              {selectedMsg.recipientsNames && selectedMsg.recipientsNames.length > 0 && (
                <div style={{marginBottom:'16px', paddingBottom:'16px', borderBottom:'1px solid #ede9fe'}}>
                  <div style={{fontSize:'12px', color:'#7c3aed', fontWeight:600, marginBottom:'6px'}}>ДО:</div>
                  <div>
                    {selectedMsg.recipientsNames.slice(0, 10).map(function(n, i) {
                      return <span key={i} className="msg-recipient-tag">{n}</span>;
                    })}
                    {selectedMsg.recipientsNames.length > 10 && (
                      <span className="msg-recipient-tag">+{selectedMsg.recipientsNames.length - 10} още</span>
                    )}
                  </div>
                </div>
              )}
              <div className="msg-detail-content">{selectedMsg.body}</div>
            </div>
            <div style={{display:'flex', gap:'8px', marginTop:'20px', flexWrap:'wrap'}}>
              <button className="btn btn-secondary" onClick={function(){ setView('inbox'); setSelectedMsg(null); }}>← Назад</button>
              {selectedMsg.authorId === currentUser.id && (
                <button className="btn btn-danger" onClick={function(){ deleteMessage(selectedMsg); }}>🗑️ Изтрий</button>
              )}
            </div>
          </div>
        )}
        {view === 'compose' && (
          <ComposeMessage onClose={function(){ setView('inbox'); }} users={users} currentUser={currentUser} />
        )}
      </div>
    </React.Fragment>
  );
}

// ================================================================
// APP
// ================================================================
function App() {
  const { currentUser, loading } = useAuth();
  const [page, setPage] = useState('home');
  const [showMessages, setShowMessages] = useState(false);

  const allMessages = useFirebaseList('messages');
  const unreadMessages = currentUser ? allMessages.filter(function(m) {
    return (m.recipients || []).indexOf(currentUser.id) !== -1 &&
           (m.readBy || []).indexOf(currentUser.id) === -1;
  }).length : 0;

  const allResignations = useFirebaseList('resignations');
  const isApprover = currentUser ? isApproverUser(currentUser) : false;
  const pendingResignations = currentUser && isApprover
    ? allResignations.filter(function(r) {
        return r.status === 'pending_approval' && !(r.approvals && r.approvals[currentUser.id]);
      }).length
    : 0;

  if (loading) {
    return (
      <div className="loading-screen">
        <div className="loading-card">
          <h1>⏰ Clocky</h1>
          <div className="spinner"></div>
          <p className="text-muted mt-2">Зареждане...</p>
        </div>
      </div>
    );
  }
  if (!currentUser) return <Login />;

  const isAdmin = isAdminUser(currentUser);

  const renderPage = function() {
    switch (page) {
      case 'home': return <Home onNavigate={setPage} />;
      case 'leaves-calendar': return <CalendarPage />;
      case 'leaves-my': return <MyRequests />;
      case 'leaves-requests': return isAdmin ? <LeaveRequestsPage /> : <Home onNavigate={setPage} />;
      case 'leaves-reports': return <LeavesReports />;
      case 'time-me': return <TimeModule scope="me" />;
      case 'time-reports': return <TimeModule scope={isAdmin ? 'all' : 'reports'} />;
      case 'resignations-my': return <ResignationsPage scope="my" />;
      case 'resignations-all': return <ResignationsPage scope="all" />;
      case 'documents-list': return <DocumentsPage />;
      case 'company-data': return <CompanyPage />;
      case 'settings-users': return isAdmin ? <UsersManager /> : <Home onNavigate={setPage} />;
      case 'settings-leavetypes': return isAdmin ? <LeaveTypesSettings /> : <Home onNavigate={setPage} />;
      case 'settings-holidays': return isAdmin ? <HolidaysSettings /> : <Home onNavigate={setPage} />;
      case 'settings-projects': return isAdmin ? <ProjectsModule /> : <Home onNavigate={setPage} />;
      default: return <Home onNavigate={setPage} />;
    }
  };

  return (
    <div className="app-layout">
      <Sidebar currentPage={page} onNavigate={setPage} />
      <div className="main-wrapper">
        <TopHeader
          onOpenMessages={function(){ setShowMessages(true); }}
          onOpenResignations={function(){ setPage('resignations-all'); }}
          unreadMessages={unreadMessages}
          unreadResignations={pendingResignations}
        />
        <main className="main-content" key={page}>
          {renderPage()}
        </main>
      </div>
      <MobileBottomNav currentPage={page} onNavigate={setPage} />
      {showMessages && <MessagesPanel onClose={function(){ setShowMessages(false); }} />}
    </div>
  );
}

console.log('🚀 Rendering...');
try {
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(
    <ErrorBoundary>
      <AuthProvider>
        <App />
      </AuthProvider>
    </ErrorBoundary>
  );
  console.log("✅ Render OK");
} catch (e) {
  console.error("❌ Render failed:", e);
  document.getElementById('root').innerHTML = '<div style="padding:40px;font-family:monospace;color:#dc2626;"><h2>Грешка</h2><pre>' + e.message + '\n\n' + e.stack + '</pre></div>';
}
</script>
</body>
