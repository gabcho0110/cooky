<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Clocky - Система за отпуски</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #faf5ff;
    color: #1e1b4b;
    min-height: 100vh;
    font-size: 14px;
  }
  #root { min-height: 100vh; }

  .loading-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%);
  }
  .loading-card {
    background: #fff;
    border-radius: 20px;
    padding: 44px;
    text-align: center;
    box-shadow: 0 24px 70px rgba(124,58,237,0.35);
  }
  .loading-card h1 { color: #7c3aed; margin-bottom: 20px; }

  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%);
    padding: 20px;
  }
  .login-card {
    background: #fff;
    border-radius: 20px;
    padding: 44px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 24px 70px rgba(124,58,237,0.35);
  }
  .login-card h1 {
    font-size: 34px;
    margin-bottom: 8px;
    color: #7c3aed;
    text-align: center;
  }
  .login-card p.sub { text-align: center; color: #7c3aed;
    opacity: 0.7; margin-bottom: 28px; font-size: 14px; }

  .app-layout { display: flex; min-height: 100vh; }

  .sidebar {
    width: 260px;
    background: #fff;
    border-right: 1px solid #ede9fe;
    padding: 20px 12px;
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0;
    bottom: 0;
    overflow-y: auto;
  }
  .sidebar-logo {
    padding: 8px 12px 24px;
    font-size: 22px;
    font-weight: 700;
    color: #7c3aed;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .sidebar-user {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    background: #faf5ff;
    border-radius: 14px;
    margin-bottom: 20px;
    border: 1px solid #ede9fe;
  }
  .sidebar-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #a855f7, #7c3aed);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    color: #fff;
    font-size: 16px;
  }
  .sidebar-user-name { font-size: 14px; font-weight: 600; color: #1e1b4b; }
  .sidebar-user-role { font-size: 12px; color: #7c3aed; opacity: 0.75; }

  .nav-group { margin-bottom: 4px; }
  .nav-group-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 11px 14px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 13.5px;
    font-weight: 600;
    color: #4c1d95;
    transition: background 0.2s, color 0.2s;
    user-select: none;
  }
  .nav-group-header:hover { background: #faf5ff; }
  .nav-group-header.active { background: #f3e8ff; color: #7c3aed; }
  .nav-group-header .nav-icon { margin-right: 10px; font-size: 16px; }
  .nav-group-header .nav-label { flex: 1; }
  .nav-group-header .chev {
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    font-size: 11px;
    opacity: 0.75;
  }
  .nav-group-header.open .chev { transform: rotate(180deg); }

  .nav-sub-wrap {
    overflow: hidden;
    transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                opacity 0.25s ease;
    max-height: 0;
    opacity: 0;
  }
  .nav-sub-wrap.open { max-height: 400px; opacity: 1; }
  .nav-sub {
    padding-left: 8px;
    padding-top: 2px;
    padding-bottom: 6px;
  }
  .nav-sub-item {
    display: flex;
    align-items: center;
    padding: 8px 12px 8px 36px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    color: #6b7280;
    transition: all 0.18s;
    position: relative;
    transform: translateX(-4px);
    opacity: 0;
  }
  .nav-sub-wrap.open .nav-sub-item {
    transform: translateX(0);
    opacity: 1;
    animation: slideIn 0.3s forwards;
  }
  @keyframes slideIn { to { transform: translateX(0); opacity: 1; } }
  .nav-sub-item::before {
    content: '';
    position: absolute;
    left: 20px;
    top: 50%;
    transform: translateY(-50%);
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #c4b5fd;
    transition: background 0.2s, transform 0.2s;
  }
  .nav-sub-item:hover { background: #faf5ff; color: #7c3aed; }
  .nav-sub-item:hover::before { background: #a855f7; transform: translateY(-50%) scale(1.4); }
  .nav-sub-item.active {
    color: #7c3aed;
    background: #f3e8ff;
    font-weight: 600;
  }
  .nav-sub-item.active::before { background: #7c3aed; }

  .sidebar-logout {
    margin-top: auto;
    padding: 11px 12px;
    background: #fef2f2;
    color: #dc2626;
    border: 1px solid #fecaca;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
    font-size: 13px;
    font-family: inherit;
    transition: background 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .sidebar-logout:hover { background: #fee2e2; }

  .main-wrapper {
    flex: 1;
    margin-left: 260px;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .top-header {
    background: #fff;
    border-bottom: 1px solid #ede9fe;
    padding: 14px 32px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 50;
    box-shadow: 0 2px 8px rgba(124,58,237,0.04);
  }
  .top-header-side { display: flex; align-items: center; gap: 12px; }
  .top-header-side.right { justify-content: flex-end; }
  .top-header-center { text-align: center; }
  .top-header-logo {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: linear-gradient(135deg, #a855f7, #7c3aed);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 700;
    font-size: 20px;
    box-shadow: 0 4px 12px rgba(124,58,237,0.3);
  }
  .top-header-tagline-side {
    font-size: 16px;
    font-weight: 700;
    color: #7c3aed;
    letter-spacing: 0.5px;
  }
  .top-header-company {
    font-size: 18px;
    font-weight: 700;
    color: #1e1b4b;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 600px;
    margin: 0 auto;
  }
  .top-header-tagline {
    font-size: 12px;
    color: #7c3aed;
    opacity: 0.7;
    margin-top: 2px;
  }
  .top-header-user {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 12px;
    background: #faf5ff;
    border-radius: 12px;
    border: 1px solid #ede9fe;
  }
  .top-header-user-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, #a855f7, #7c3aed);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 700;
    font-size: 13px;
  }
  .top-header-user-info { display: flex; flex-direction: column; }
  .top-header-user-name { font-size: 13px; font-weight: 600; color: #1e1b4b; }
  .top-header-user-role { font-size: 11px; color: #7c3aed; opacity: 0.75; }

  .main-content { flex: 1; padding: 28px 32px; }

  .page-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 28px;
    gap: 16px;
    flex-wrap: wrap;
  }
  .page-title {
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 6px;
    color: #1e1b4b;
  }
  .page-subtitle { color: #7c3aed; opacity: 0.7; font-size: 14px; }

  .card {
    background: #fff;
    border-radius: 16px;
    padding: 24px;
    border: 1px solid #ede9fe;
    margin-bottom: 20px;
    box-shadow: 0 1px 3px rgba(124,58,237,0.04);
  }
  .card h3 { font-size: 18px; margin-bottom: 16px; color: #1e1b4b; font-weight: 600; }

  .dash-card {
    background: #fff;
    border-radius: 20px;
    padding: 32px;
    border: 1px solid #ede9fe;
    margin-bottom: 20px;
    box-shadow: 0 4px 20px rgba(124,58,237,0.06);
  }
  .dash-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .dash-card h2 { font-size: 24px; font-weight: 700; color: #1e1b4b; }
  .dash-card .sub { color: #7c3aed; opacity: 0.65; font-size: 13px; margin-bottom: 24px; }

  .dash-plus {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: linear-gradient(135deg, #a855f7, #7c3aed);
    color: #fff;
    border: none;
    font-size: 24px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 6px 18px rgba(124,58,237,0.35);
  }
  .dash-plus:hover { transform: scale(1.08) rotate(90deg); box-shadow: 0 8px 24px rgba(124,58,237,0.5); }

  .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .dash-stat-label { color: #7c3aed; opacity: 0.7; font-size: 13px; margin-bottom: 8px; }
  .dash-stat-value {
    font-size: 44px;
    font-weight: 700;
    color: #7c3aed;
    line-height: 1;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .dash-stat-value .unit { font-size: 16px; color: #a78bfa; font-weight: 400; }
  .dash-stat-hint { color: #9ca3af; font-size: 12px; margin-top: 8px; }
  .dash-divider { height: 1px; background: #ede9fe; margin: 24px 0; }

  .next-absence-date { display: flex; align-items: center; gap: 16px; }
  .next-date-box { text-align: center; padding: 8px 16px; border-right: 1px solid #ede9fe; }
  .next-date-month { color: #7c3aed; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
  .next-date-num { color: #1e1b4b; font-size: 32px; font-weight: 700; line-height: 1; }
  .next-date-day { color: #9ca3af; font-size: 12px; }

  .absence-badge {
    display: inline-block;
    padding: 6px 12px;
    background: #f3e8ff;
    color: #7c3aed;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    margin-top: 8px;
  }

  .link { color: #7c3aed; cursor: pointer; text-decoration: none; font-weight: 600; }
  .link:hover { text-decoration: underline; }

  .empty-state { text-align: center; padding: 40px; color: #a78bfa; font-size: 14px; }

  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #4c1d95; }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%;
    padding: 11px 14px;
    background: #fff;
    border: 1.5px solid #e9d5ff;
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    color: #1e1b4b;
    transition: all 0.2s;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    outline: none;
    border-color: #a855f7;
    box-shadow: 0 0 0 4px rgba(168,85,247,0.12);
  }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

  .btn {
    padding: 10px 18px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn-primary { background: #7c3aed; color: #fff; box-shadow: 0 4px 12px rgba(124,58,237,0.25); }
  .btn-primary:hover { background: #6d28d9; box-shadow: 0 6px 16px rgba(124,58,237,0.35); transform: translateY(-1px); }
  .btn-success { background: #10b981; color: #fff; }
  .btn-success:hover { background: #059669; }
  .btn-danger { background: #ef4444; color: #fff; }
  .btn-danger:hover { background: #dc2626; }
  .btn-warning { background: #f59e0b; color: #fff; }
  .btn-warning:hover { background: #d97706; }
  .btn-info { background: #06b6d4; color: #fff; }
  .btn-info:hover { background: #0891b2; }
  .btn-secondary { background: #f3e8ff; color: #7c3aed; }
  .btn-secondary:hover { background: #e9d5ff; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }
  .btn-sm { padding: 6px 12px; font-size: 12px; }
  .btn-block { width: 100%; justify-content: center; }

  .btn-pdf {
    background: linear-gradient(135deg, #a855f7, #7c3aed);
    color: #fff;
    padding: 6px 12px;
    font-size: 12px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(124,58,237,0.25);
    border: none;
    cursor: pointer;
    font-weight: 600;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: all 0.2s;
  }
  .btn-pdf:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(124,58,237,0.4); }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 12px; text-align: left; border-bottom: 1px solid #f3e8ff; }
  th { background: #faf5ff; font-weight: 600; color: #7c3aed; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
  tr.clickable { cursor: pointer; transition: background 0.15s; }
  tr.clickable:hover td { background: #f3e8ff; }

  .badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
  }
  .badge.pending { background: #fef3c7; color: #b45309; }
  .badge.approved { background: #dcfce7; color: #15803d; }
  .badge.rejected { background: #fee2e2; color: #b91c1c; }
  .badge.active { background: #dcfce7; color: #15803d; }
  .badge.paused { background: #fef3c7; color: #b45309; }

  .error {
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #b91c1c;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 14px;
    margin-bottom: 16px;
  }
  .success {
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    color: #15803d;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 14px;
    margin-bottom: 16px;
  }

  .clock-display {
    font-size: 64px;
    font-weight: 700;
    text-align: center;
    color: #7c3aed;
    font-variant-numeric: tabular-nums;
    margin: 24px 0;
    letter-spacing: 2px;
    transition: color 0.3s;
  }
  .clock-display.working { color: #10b981; }
  .clock-display.paused { color: #f59e0b; }
  .clock-status {
    text-align: center;
    color: #7c3aed;
    opacity: 0.75;
    margin-bottom: 24px;
    font-size: 14px;
  }
  .clock-actions { display: flex; gap: 12px; justify-content: center; margin-bottom: 24px; flex-wrap: wrap; }

  .pause-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    background: #fef3c7;
    color: #b45309;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    margin: 0 auto 16px;
    width: fit-content;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: #fff;
    padding: 20px;
    border-radius: 14px;
    border: 1px solid #ede9fe;
    box-shadow: 0 1px 3px rgba(124,58,237,0.04);
  }
  .stat-card .label { font-size: 12px; color: #7c3aed; opacity: 0.7; text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; }
  .stat-card .value { font-size: 28px; font-weight: 700; color: #1e1b4b; margin-top: 6px; }
  .stat-card.primary .value { color: #7c3aed; }
  .stat-card.success .value { color: #10b981; }
  .stat-card.warning .value { color: #f59e0b; }

  .calendar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .calendar-header h3 { margin: 0; color: #1e1b4b; }
  .calendar-nav { display: flex; gap: 8px; }
  .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .calendar-day-name {
    text-align: center;
    font-weight: 600;
    font-size: 12px;
    color: #7c3aed;
    padding: 8px 0;
    text-transform: uppercase;
    opacity: 0.75;
  }
  .calendar-day {
    aspect-ratio: 1;
    border: 1px solid #ede9fe;
    border-radius: 10px;
    padding: 6px;
    font-size: 12px;
    position: relative;
    background: #fff;
    min-height: 80px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .calendar-day:not(.empty):hover {
    border-color: #a855f7;
    box-shadow: 0 2px 8px rgba(168,85,247,0.15);
  }
  .calendar-day.empty { background: #faf5ff; border-color: transparent; }
  .calendar-day.today { border-color: #7c3aed; border-width: 2px; background: #faf5ff; }
  .calendar-day.holiday {
    background: #fef2f2;
    border-color: #fecaca;
  }
  .calendar-day.holiday .day-num { color: #b91c1c; }
  .calendar-day .day-num { font-weight: 600; color: #9ca3af; }
  .calendar-day.today .day-num { color: #7c3aed; }
  .holiday-tag {
    font-size: 8px;
    background: #ef4444;
    color: #fff;
    padding: 1px 4px;
    border-radius: 3px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 600;
  }
  .day-event {
    font-size: 10px;
    padding: 2px 5px;
    border-radius: 5px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    cursor: pointer;
    color: #fff;
    font-weight: 500;
    transition: transform 0.15s;
  }
  .day-event:hover { transform: scale(1.05); }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(76,29,149,0.4);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
    animation: fadeIn 0.2s;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: #fff;
    border-radius: 18px;
    padding: 28px;
    max-width: 560px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 24px 70px rgba(124,58,237,0.35);
    animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  @keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .modal h3 { color: #1e1b4b; margin-bottom: 20px; }

  .detail-row {
    display: flex;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid #f3e8ff;
    font-size: 14px;
  }
  .detail-row:last-child { border-bottom: none; }
  .detail-label { color: #7c3aed; font-weight: 600; opacity: 0.8; }
  .detail-value { color: #1e1b4b; font-weight: 500; text-align: right; max-width: 60%; }

  .color-presets { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .color-dot {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.15s, border-color 0.15s;

class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, error: null };
  }
  static getDerivedStateFromError(error) {
    return { hasError: true, error };
  }
  componentDidCatch(error, info) {
    console.error("ErrorBoundary caught:", error, info);
  }
  render() {
    if (this.state.hasError) {
      return (
        <div className="error-screen">
          <div className="error-screen-inner">
            <h2>⚠️ Възникна грешка</h2>
            <p className="text-muted">Моля, презаредете страницата.</p>
            <pre>{String(this.state.error?.message || this.state.error)}</pre>

const calcDuration = (entry, now = Date.now()) => {
  if (!entry || !entry.checkIn) return 0;
  const start = new Date(entry.checkIn).getTime();
  const end = entry.checkOut ? new Date(entry.checkOut).getTime() : now;
  let total = end - start;

  const pauses = entry.pauses || [];
  pauses.forEach(p => {
    const pStart = new Date(p.start).getTime();
    const pEnd = p.end ? new Date(p.end).getTime() : now;
    const dur = pEnd - pStart;
    if (dur > 0) total -= dur;
  });

  return Math.max(0, total);
};

const calcWorkingDays = (startDate, endDate, holidays) => {
  const start = new Date(startDate);
  const end = new Date(endDate);
  let count = 0;
  const cur = new Date(start);
  while (cur <= end) {
    const dateStr = `${cur.getFullYear()}-${pad(cur.getMonth()+1)}-${pad(cur.getDate())}`;
    const dow = cur.getDay();
    const isWeekend = dow === 0 || dow === 6;
    const holiday = isHoliday(dateStr, holidays);
    if (!holiday && !isWeekend) count++;
    cur.setDate(cur.getDate() + 1);
  }
  return count;
};

/* ============ PDF FONT ============ */
let cachedFontBase64 = null;

async function loadCyrillicFont() {
  if (cachedFontBase64) return cachedFontBase64;
  const url = 'https://cdn.jsdelivr.net/gh/googlefonts/roboto@main/src/hinted/Roboto-Regular.ttf';
  const res = await fetch(url);
  if (!res.ok) throw new Error('Не може да зареди шрифт');
  const buf = await res.arrayBuffer();
  let binary = '';
  const bytes = new Uint8Array(buf);
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }
  cachedFontBase64 = btoa(binary);
  return cachedFontBase64;
}

/* ============ AUTH CONTEXT ============ */
const AuthContext = createContext(null);
const useAuth = () => useContext(AuthContext);

function AuthProvider({ children }) {
  const [currentUser, setCurrentUser] = useState(null);
  const [users, setUsers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [dbError, setDbError] = useState(null);
  const seededRef = useRef(false);

  useEffect(() => {
    console.log("🔵 AuthProvider mounted");

    const stored = localStorage.getItem('clocky_user');
    if (stored) {
      try { setCurrentUser(JSON.parse(stored)); } catch {}
    }

    if (!firebaseReady || !db) {
      console.error("❌ Firebase not ready");
      setLoading(false);
      setDbError("Не може да се свърже с Firebase. Провери правилата на базата.");
      return;
    }

    console.log("🔵 Опитвам да заредя users от Firebase...");

    const ref = db.ref('users');
    let resolved = false;

    const handler = (snap) => {
      resolved = true;
      console.log("✅ Получени данни от Firebase:", snap.val());
      const data = snap.val() || {};
      const list = Object.values(data);
      setUsers(list);
      setLoading(false);
      setDbError(null);

      if (list.length === 0 && !seededRef.current) {
        seededRef.current = true;
        console.log("🌱 Създавам admin потребител...");
        const admin = {
          id: uid(),
          username: 'admin',
          password: 'admin123',
          fullName: 'Администратор',
          email: 'admin@clocky.com',
          role: 'admin',
          totalLeaveDays: 25,
          usedLeaveDays: 0,
          createdAt: new Date().toISOString()
        };
        db.ref('users/' + admin.id).set(admin).catch(e => console.error("Seeding error:", e));
      }

      const storedNow = localStorage.getItem('clocky_user');
      if (storedNow) {
        try {
          const u = JSON.parse(storedNow);
          const fresh = list.find(x => x.id === u.id);
          if (fresh) {
            setCurrentUser(fresh);
            localStorage.setItem('clocky_user', JSON.stringify(fresh));
          } else {
            setCurrentUser(null);
            localStorage.removeItem('clocky_user');
          }
        } catch {}
      }
    };

    const errorHandler = (err) => {
      resolved = true;
      console.error("❌ Firebase error:", err);
      setDbError("Грешка при връзка с Firebase: " + err.message + " • Провери правилата на базата.");
      setLoading(false);
    };

    ref.on('value', handler, errorHandler);

    const timeoutId = setTimeout(() => {
      if (!resolved) {
        console.warn("⚠️ Firebase timeout - няма отговор за 8 секунди");
        setLoading(false);
        setDbError("Връзката с Firebase отнема твърде дълго. Провери правилата на базата.");
      }
    }, 8000);

    return () => {
      clearTimeout(timeoutId);
      ref.off('value', handler);
    };
  }, []);

  useEffect(() => {
    if (!firebaseReady || !db) return;
    db.ref('leaveTypes').once('value').then(snap => {
      if (!snap.exists()) db.ref('leaveTypes').set(DEFAULT_LEAVE_TYPES).catch(() => {});
    }).catch(() => {});
    db.ref('company').once('value').then(snap => {
      if (!snap.exists()) db.ref('company').set(DEFAULT_COMPANY).catch(() => {});
    }).catch(() => {});
    db.ref('holidays').once('value').then(snap => {
      if (!snap.exists()) {
        const year = new Date().getFullYear();
        const seeded = {};
        Object.entries(DEFAULT_HOLIDAYS).forEach(([md, h]) => {
          const [mm, dd] = md.split('-');
          const dateISO = `${year}-${mm}-${dd}`;
          const id = uid();
          seeded[id] = { id, name: h.name, date: dateISO, createdAt: new Date().toISOString() };
        });
        db.ref('holidays').set(seeded).catch(() => {});
      }
    }).catch(() => {});
  }, []);

  const login = (username, password) => {
    if (!firebaseReady) return { error: 'Няма връзка с базата' };
    if (users.length === 0) return { error: 'Базата се зарежда...' };
    const u = users.find(x => x.username === username.trim() && x.password === password);
    if (!u) return { error: 'Грешно потребителско име или парола' };
    setCurrentUser(u);
    localStorage.setItem('clocky_user', JSON.stringify(u));
    return { success: true, user: u };
  };

  const logout = () => {
    setCurrentUser(null);
    localStorage.removeItem('clocky_user');
  };

  const addUser = async (data) => {
    if (users.find(u => u.username === data.username)) return { error: 'Потребителското име съществува' };
    const newUser = { id: uid(), ...data, usedLeaveDays: 0, createdAt: new Date().toISOString() };
    try { await db.ref('users/' + newUser.id).set(newUser); return { success: true }; }
    catch (e) { return { error: e.message }; }
  };

  const updateUser = async (id, data) => {
    try { await db.ref('users/' + id).update(data); return { success: true }; }
    catch (e) { return { error: e.message }; }
  };

  const deleteUser = async (id) => {
    try { await db.ref('users/' + id).remove(); return { success: true }; }
    catch (e) { return { error: e.message }; }
  };

  return (
    <AuthContext.Provider value={{
      currentUser, users, loading, dbError,
      login, logout, addUser, updateUser, deleteUser
    }}>
      {children}
    </AuthContext.Provider>
  );
}

/* ============ HOOKS ============ */
function useFirebaseList(path) {
  const [data, setData] = useState([]);
  useEffect(() => {
    if (!db || !path) return;
    const ref = db.ref(path);
    const handler = (snap) => {
      const val = snap.val() || {};
      setData(Object.values(val));
    };
    ref.on('value', handler);
    return () => ref.off('value', handler);
  }, [path]);
  return data;
}

function useFirebaseObject(path, defaultVal = null) {
  const [data, setData] = useState(defaultVal);
  useEffect(() => {
    if (!db || !path) return;
    const ref = db.ref(path);
    const handler = (snap) => {
      const val = snap.val();
      setData(val || defaultVal);
    };
    ref.on('value', handler);
    return () => ref.off('value', handler);
  }, [path]);
  return data;
}

function useHolidaysMap() {
  const list = useFirebaseList('holidays');
  return useMemo(() => {
    const map = {};
    list.forEach(h => { if (h.date) map[h.date] = h; });
    return map;
  }, [list]);
}

    const items = [

      { id: 'leaves', icon: '🏖️', label: 'Отпуски', items: leavesItems },

        { id: 'time-reports', label: isAdmin ? 'Отчети (всички)' : 'Моите отчети' }
      ]},
      { id: 'company', icon: '🏢', label: 'Компания', items: [
        { id: 'company-data', label: 'Данни за компанията' }
      ]}
    ];

    if (isAdmin) {
      items.push({
        id: 'settings', icon: '⚙️', label: 'Настройки',
        items: [
          { id: 'settings-users', label: 'Потребители' },
          { id: 'settings-leavetypes', label: 'Видове отпуски' },
          { id: 'settings-holidays', label: 'Всички празници' },
          { id: 'settings-projects', label: 'Всички проекти' }
        ]
      });
    }

    return items;
  }, [isAdmin]);

  const [openGroups, setOpenGroups] = useState(() => {
    const initial = {};
    menuConfig.forEach(g => {
      if (g.items) {
        initial[g.id] = g.items.some(it => it.id === currentPage);
      }
    });
    return initial;
  });

  useEffect(() => {
    menuConfig.forEach(g => {
      if (g.items && g.items.some(it => it.id === currentPage)) {
        setOpenGroups(prev => ({ ...prev, [g.id]: true }));
      }
    });
  }, [currentPage, menuConfig]);

  const toggle = (id) => setOpenGroups(prev => ({ ...prev, [id]: !prev[id] }));

  const handleGroupClick = (group) => {
    if (!group.items) onNavigate(group.id);
    else toggle(group.id);
  };

  const isGroupActive = (group) => {
    if (!group.items) return currentPage === group.id;
    return group.items.some(it => it.id === currentPage);
  };

  return (
    <aside className="sidebar">
      <div className="sidebar-logo">⏰ Clocky</div>

      <div className="sidebar-user">
        <div className="sidebar-avatar">{currentUser.fullName.charAt(0)}</div>

          <div className="sidebar-user-name">{currentUser.fullName}</div>
          <div className="sidebar-user-role">{isAdmin ? 'Администратор' : 'Служител'}</div>
        </div>
      </div>

      <nav style={{flex: 1}}>
        {menuConfig.map(group => {
          const isOpen = !!openGroups[group.id];
          const isActive = isGroupActive(group);
          return (
            <div key={group.id} className="nav-group">
              <div
                className={`nav-group-header ${isActive ? 'active' : ''} ${isOpen ? 'open' : ''}`}
                onClick={() => handleGroupClick(group)}
              >
                <span className="nav-icon">{group.icon}</span>
                <span className="nav-label">{group.label}</span>
                {group.items && <span className="chev">▼</span>}
              </div>
              {group.items && (
                <div className={`nav-sub-wrap ${isOpen ? 'open' : ''}`}>
                  <div className="nav-sub">
                    {group.items.map((item, i) => (
                      <div
                        key={item.id}
                        className={`nav-sub-item ${currentPage === item.id ? 'active' : ''}`}
                        style={isOpen ? {animationDelay: `${i * 0.04}s`} : {}}
                        onClick={(e) => { e.stopPropagation(); onNavigate(item.id); }}
                      >
                        {item.label}
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </nav>

      <button className="sidebar-logout" onClick={logout}>🚪 Изход</button>
    </aside>
  );
}

/* ============ HOME ============ */
function Home({ onNavigate }) {
  const { currentUser } = useAuth();
  const requests = useFirebaseList('leaveRequests');
  const leaveTypes = useFirebaseObject('leaveTypes', DEFAULT_LEAVE_TYPES);
  const now = new Date();
  const year = now.getFullYear();

  const myRequests = requests.filter(r => r.userId === currentUser.id);
  const approvedThisYear = myRequests.filter(r => {
    if (r.status !== 'approved') return false;
    return new Date(r.startDate).getFullYear() === year;
  });

  const usedDays = currentUser.usedLeaveDays || 0;
  const totalDays = currentUser.totalLeaveDays || 0;
  const remaining = totalDays - usedDays;
  const remainingPct = totalDays > 0 ? Math.round((remaining / totalDays) * 100) : 0;

  const today = todayISO();
  const upcoming = myRequests
    .filter(r => r.status === 'approved' && r.endDate >= today)
    .sort((a, b) => new Date(a.startDate) - new Date(b.startDate))[0];

  const daysUntil = upcoming ? Math.ceil((new Date(upcoming.startDate) - new Date(today)) / (1000*60*60*24)) : 0;

  return (

          <div>
            <div className="dash-stat-label">Полагаем платен отпуск</div>
            <div className="dash-stat-value">{totalDays} <span className="unit">дни</span></div>
            <div className="dash-stat-hint">1 януари – 31 декември {year} г.</div>
          </div>
        </div>

        <div className="dash-divider"></div>

        <h3 style={{fontSize:'16px', marginBottom:'16px'}}>Следващо отсъствие</h3>
        {upcoming ? (
          <div className="next-absence-date">
            <div className="next-date-box">
              <div className="next-date-month">{monthShort[new Date(upcoming.startDate).getMonth()]}РНИ</div>
              <div className="next-date-num">{new Date(upcoming.startDate).getDate()}</div>
              <div className="next-date-day">{dayShort[new Date(upcoming.startDate).getDay()]}</div>

            <div>
              <div style={{fontWeight:600, color:'#1e1b4b', marginBottom:'4px'}}>{getLeaveTypeName(upcoming.type || 'paid')}</div>
              <div style={{fontSize:'13px', color:'#7c3aed', opacity:0.75, display:'flex', alignItems:'center', gap:'8px'}}>
                <span>{formatDate(upcoming.startDate)} г.</span>

                <div className="absence-badge">

        ) : (
          <div className="empty-state">Няма предстоящи отсъствия</div>

        <div className="dash-divider"></div>
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
          <span className="text-muted">Показва се най-близкият ви одобрен отпуск</span>

/* ============ LEAVE REQUEST MODAL ============ */
function LeaveRequestModal({ onClose }) {
  const { currentUser } = useAuth();
  const leaveTypes = useFirebaseObject('leaveTypes', DEFAULT_LEAVE_TYPES);
  const holidays = useHolidaysMap();
  const [form, setForm] = useState({ startDate: '', endDate: '', reason: '', type: 'paid' });
  const [attachment, setAttachment] = useState(null);
  const [attachmentError, setAttachmentError] = useState('');
  const [error, setError] = useState('');
  const [submitting, setSubmitting] = useState(false);
  const fileInputRef = useRef(null);

  const remaining = (currentUser.totalLeaveDays || 0) - (currentUser.usedLeaveDays || 0);
  const days = form.startDate && form.endDate ? daysBetween(form.startDate, form.endDate) : 0;
  const workingDays = form.startDate && form.endDate ? calcWorkingDays(form.startDate, form.endDate, holidays) : 0;
  const selectedType = leaveTypes[form.type];
  const willDeduct = selectedType?.deducts;
  const sick = isSickLeave(form.type, leaveTypes);

  const canSubmit = (!willDeduct || workingDays <= remaining) && form.reason.trim().length > 0 && (!sick || !!attachment);

  const handleFileChange = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setAttachmentError('');
    if (file.size > 1024 * 1024) return setAttachmentError('Файлът е прекалено голям (макс. 1MB).');
    if (!file.type.startsWith('image/')) return setAttachmentError('Само изображения (PNG, JPG)');
    try {
      const dataUrl = await readFileAsDataURL(file);
      setAttachment({ name: file.name, dataUrl });
    } catch (err) { setAttachmentError('Грешка при четене'); }
  };

  const removeAttachment = () => {
    setAttachment(null);
    setAttachmentError('');
    if (fileInputRef.current) fileInputRef.current.value = '';
  };

  const submit = async (e) => {
    e.preventDefault();
    setError('');
    if (!form.startDate || !form.endDate) return setError('Изберете дати');
    if (form.endDate < form.startDate) return setError('Крайната дата трябва да е след началната');
    if (!form.reason.trim()) return setError('Причината е задължителна');
    if (willDeduct && workingDays > remaining) return setError(`Нямате достатъчно дни (остават ${remaining})`);
    if (sick && !attachment) return setError('За болничен е задължителен скрийншот');

    setSubmitting(true);
    const req = {
      id: uid(),
      userId: currentUser.id,
      userName: currentUser.fullName,
      startDate: form.startDate,
      endDate: form.endDate,
      days: workingDays,
      calendarDays: days,
      reason: form.reason.trim(),
      type: form.type,
      status: 'pending',
      createdAt: new Date().toISOString(),
      attachment: attachment ? attachment.dataUrl : null
    };
    try {
      await db.ref('leaveRequests/' + req.id).set(req);
      onClose();
    } catch (err) {
      setError('Грешка при запазване: ' + err.message);
      setSubmitting(false);
    }
  };

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <h3>📝 Нова заявка за отпуск</h3>
        {error && <div className="error">{error}</div>}
        <form onSubmit={submit}>
          <div className="form-group">
            <label>Вид отпуск</label>
            <select value={form.type} onChange={e => setForm({...form, type: e.target.value})}>
              {Object.values(leaveTypes).map(t => (
                <option key={t.id} value={t.id}>{t.name} {t.deducts ? '(приспада се)' : '(не се приспада)'}</option>
              ))}
            </select>
          </div>

          <div className="form-row">
            <div className="form-group">
              <label>Начална дата <span className="required-mark">*</span></label>
              <input type="date" value={form.startDate} onChange={e => setForm({...form, startDate: e.target.value})} required />
            </div>
            <div className="form-group">
              <label>Крайна дата <span className="required-mark">*</span></label>
              <input type="date" value={form.endDate} onChange={e => setForm({...form, endDate: e.target.value})} min={form.startDate} required />
            </div>
          </div>

          {days > 0 && (
            <div className="warning-box">
              <div><b>Календарни дни:</b> {days}</div>
              <div><b>Работни дни (без почивни и празници):</b> {workingDays}</div>
              {workingDays !== days && (
                <div style={{marginTop:'6px', fontSize:'12px'}}>ℹ️ Приспадат се само работните дни.</div>
              )}
              {willDeduct && <div style={{marginTop:'6px', fontSize:'12px'}}>Ще се приспаднат от платения ви отпуск</div>}
            </div>
          )}

          <div className="form-group mt-2">
            <label>Причина <span className="required-mark">*</span></label>
            <textarea value={form.reason} onChange={e => setForm({...form, reason: e.target.value})} rows="3" placeholder="Опишете причината..." required />
          </div>

          {sick && (
            <div className="form-group mt-2">
              <label>📎 Скрийншот от Школо / НЕИСПУО <span className="required-mark">*</span></label>
              <p className="text-muted" style={{marginBottom:'6px', fontSize:'12px'}}>Прикачете скрийншот на болничната бележка.</p>

              {attachmentError && <div className="error" style={{marginBottom:'10px'}}>{attachmentError}</div>}

              {!attachment ? (
                <div className="upload-box" onClick={() => fileInputRef.current?.click()}>
                  <div className="upload-icon">📤</div>
                  <div className="upload-text">Кликнете за избор на файл</div>
                  <div className="upload-hint">PNG, JPG • макс. 1MB</div>
                </div>
              ) : (
                <div className="upload-box has-file" onClick={() => fileInputRef.current?.click()}>
                  <img src={attachment.dataUrl} alt="Преглед" className="upload-preview" />
                  <div className="upload-file-info">
                    <span>✅ {attachment.name}</span>
                    <button type="button" onClick={(e) => { e.stopPropagation(); removeAttachment(); }}
                      style={{background:'none', border:'none', color:'#dc2626', cursor:'pointer', fontWeight:'bold'}}>✕</button>
                  </div>
                </div>
              )}

              <input ref={fileInputRef} type="file" accept="image/*" onChange={handleFileChange} style={{display:'none'}} />
            </div>
          )}

          <div className="flex gap-2">
            <button type="submit" className="btn btn-primary" disabled={!canSubmit || submitting}>
              {submitting ? '⏳ Изпращане...' : 'Изпрати заявка'}
            </button>
            <button type="button" className="btn btn-secondary" onClick={onClose}>Отказ</button>
          </div>
        </form>
      </div>
    </div>
  );
}
