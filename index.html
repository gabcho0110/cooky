<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, createContext, useContext, useRef, useMemo } = React;

/* ============ FIREBASE ============ */
const firebaseConfig = {
  apiKey: "AIzaSyDmdAdWxhtMf6AJ-i3215loRuAp5wmAjKY",
  authDomain: "clocky-4efd9.firebaseapp.com",
  databaseURL: "https://clocky-4efd9-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "clocky-4efd9",
  storageBucket: "clocky-4efd9.firebasestorage.app",
  messagingSenderId: "1050615959900",
  appId: "1:1050615959900:web:d9809d3c299afe5a3bf199"
};

let db = null;
let firebaseReady = false;
try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
  firebaseReady = true;
  console.log("✅ Firebase initialized");
} catch (e) {
  console.error("❌ Firebase init failed:", e);
}

/* ============ HELPERS ============ */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const formatDate = (iso) => {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('bg-BG');
};
const todayISO = () => new Date().toISOString().split('T')[0];
const daysBetween = (start, end) => {
  const s = new Date(start);
  const e = new Date(end);
  return Math.round((e - s) / (1000 * 60 * 60 * 24)) + 1;
};
const pad = (n) => String(n).padStart(2, '0');
const fmtTime = (ms) => {
  const totalSec = Math.floor(ms / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  return `${pad(h)}:${pad(m)}:${pad(s)}`;
};
const monthNames = ['Януари','Февруари','Март','Април','Май','Юни','Юли','Август','Септември','Октомври','Ноември','Декември'];
const monthShort = ['ЯНУ','ФЕВ','МАР','АПР','МАЙ','ЮНИ','ЮЛИ','АВГ','СЕП','ОКТ','НОЕ','ДЕК'];
const dayShort = ['НЕД','ПОН','ВТО','СРЯ','ЧЕТ','ПЕТ','СЪБ'];

const DEFAULT_LEAVE_TYPES = {
  paid: { id: 'paid', name: 'Платен отпуск', color: '#22c55e', deducts: true },
  unpaid: { id: 'unpaid', name: 'Неплатен отпуск', color: '#ef4444', deducts: false },
  sick: { id: 'sick', name: 'Болничен', color: '#eab308', deducts: false },
  home: { id: 'home', name: 'Домашен', color: '#3b82f6', deducts: false }
};

const COLOR_PRESETS = ['#ef4444','#f97316','#eab308','#22c55e','#06b6d4','#3b82f6','#8b5cf6','#ec4899','#64748b','#14b8a6'];

/* ============ CONTEXT ============ */
const AuthContext = createContext(null);
const useAuth = () => useContext(AuthContext);

function AuthProvider({ children }) {
  const [currentUser, setCurrentUser] = useState(null);
  const [users, setUsers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [dbError, setDbError] = useState(null);
  const seededRef = useRef(false);

  useEffect(() => {
    const timeout = setTimeout(() => {
      setLoading(false);
      if (!firebaseReady) setDbError("Не може да се свърже с базата данни.");
    }, 5000);

    const stored = localStorage.getItem('clocky_user');
    if (stored) {
      try { setCurrentUser(JSON.parse(stored)); } catch {}
    }

    if (!firebaseReady || !db) {
      setLoading(false);
      return () => clearTimeout(timeout);
    }

    const ref = db.ref('users');
    const handler = (snap) => {
      clearTimeout(timeout);
      const data = snap.val() || {};
      const list = Object.values(data);
      setUsers(list);
      setLoading(false);

      if (list.length === 0 && !seededRef.current) {
        seededRef.current = true;
        const admin = {
          id: uid(),
          username: 'admin',
          password: 'admin123',
          fullName: 'Администратор',
          email: 'admin@clocky.com',
          role: 'admin',
          totalLeaveDays: 25,
          usedLeaveDays: 0,
          createdAt: new Date().toISOString()
        };
        db.ref('users/' + admin.id).set(admin).catch(e => console.error(e));

        // Seed default leave types
        db.ref('leaveTypes').set(DEFAULT_LEAVE_TYPES).catch(e => console.error(e));

        // Seed company data
        db.ref('company').set({
          name: 'Моята Компания ООД',
          email: 'info@company.bg',
          bulstat: '',
          vat: '',
          website: '',
          phone: '',
          address1: '',
          address2: '',
          city: 'София',
          region: 'София',
          postalCode: '1000',
          country: 'Bulgaria'
        }).catch(e => console.error(e));
      }

      const storedNow = localStorage.getItem('clocky_user');
      if (storedNow) {
        try {
          const u = JSON.parse(storedNow);
          const fresh = list.find(x => x.id === u.id);
          if (fresh) {
            setCurrentUser(fresh);
            localStorage.setItem('clocky_user', JSON.stringify(fresh));
          } else {
            setCurrentUser(null);
            localStorage.removeItem('clocky_user');
          }
        } catch {}
      }
    };

    const errorHandler = (err) => {
      clearTimeout(timeout);
      console.error("DB error:", err);
      setDbError("Грешка при връзка: " + err.message);
      setLoading(false);
    };

    ref.on('value', handler, errorHandler);
    return () => {
      clearTimeout(timeout);
      ref.off('value', handler);
    };
  }, []);

  const login = (username, password) => {
    if (!firebaseReady) return { error: 'Няма връзка с базата' };
    if (users.length === 0) return { error: 'Базата се зарежда...' };
    const u = users.find(x => x.username === username.trim() && x.password === password);
    if (!u) return { error: 'Грешно потребителско име или парола' };
    setCurrentUser(u);
    localStorage.setItem('clocky_user', JSON.stringify(u));
    return { success: true, user: u };
  };

  const logout = () => {
    setCurrentUser(null);
    localStorage.removeItem('clocky_user');
  };

  const addUser = async (data) => {
    if (users.find(u => u.username === data.username)) return { error: 'Потребителското име съществува' };
    const newUser = { id: uid(), ...data, usedLeaveDays: 0, createdAt: new Date().toISOString() };
    try { await db.ref('users/' + newUser.id).set(newUser); return { success: true }; }
    catch (e) { return { error: e.message }; }
  };

  const updateUser = async (id, data) => {
    try { await db.ref('users/' + id).update(data); return { success: true }; }
    catch (e) { return { error: e.message }; }
  };

  const deleteUser = async (id) => {
    try { await db.ref('users/' + id).remove(); return { success: true }; }
    catch (e) { return { error: e.message }; }
  };

  return (
    <AuthContext.Provider value={{
      currentUser, users, loading, dbError,
      login, logout, addUser, updateUser, deleteUser
    }}>
      {children}
    </AuthContext.Provider>
  );
}

/* ============ HOOKS ============ */
function useFirebaseList(path) {
  const [data, setData] = useState([]);
  useEffect(() => {
    if (!db || !path) return;
    const ref = db.ref(path);
    const handler = (snap) => {
      const val = snap.val() || {};
      setData(Object.values(val));
    };
    ref.on('value', handler);
    return () => ref.off('value', handler);
  }, [path]);
  return data;
}

function useFirebaseObject(path) {
  const [data, setData] = useState(null);
  useEffect(() => {
    if (!db || !path) return;
    const ref = db.ref(path);
    const handler = (snap) => setData(snap.val());
    ref.on('value', handler);
    return () => ref.off('value', handler);
  }, [path]);
  return data;
}

/* ============ LEAVE REQUEST FORM ============ */
function LeaveRequestForm({ onSuccess }) {
  const { currentUser } = useAuth();
  const leaveTypes = useFirebaseObject('leaveTypes') || DEFAULT_LEAVE_TYPES;
  const [form, setForm] = useState({
    startDate: '', endDate: '', reason: '', type: 'paid'
  });
  const [error, setError] = useState('');
  const [success, setSuccess] = useState('');

  const remaining = (currentUser.totalLeaveDays || 0) - (currentUser.usedLeaveDays || 0);
  const days = form.startDate && form.endDate ? daysBetween(form.startDate, form.endDate) : 0;
  const selectedType = leaveTypes[form.type];
  const willDeduct = selectedType?.deducts;
  const canSubmit = !willDeduct || days <= remaining;

  const submit = async (e) => {
    e.preventDefault();
    setError(''); setSuccess('');

    if (!form.startDate || !form.endDate) return setError('Изберете дати');
    if (form.endDate < form.startDate) return setError('Крайната дата трябва да е след началната');
    if (willDeduct && days > remaining) return setError(`Нямате достатъчно дни (остават ${remaining})`);

    const req = {
      id: uid(),
      userId: currentUser.id,
      userName: currentUser.fullName,
      startDate: form.startDate,
      endDate: form.endDate,
      days,
      reason: form.reason,
      type: form.type,
      status: 'pending',
      createdAt: new Date().toISOString()
    };
    await db.ref('leaveRequests/' + req.id).set(req);
    setForm({ startDate: '', endDate: '', reason: '', type: 'paid' });
    setSuccess('✅ Заявката е изпратена за одобрение');
    if (onSuccess) onSuccess();
  };

  return (
    <div className="card">
      <h3>📝 Нова заявка за отпуск</h3>

      <div className="stats-grid" style={{marginBottom:'20px'}}>
        <div className="stat-card success">
          <div className="label">Оставащи дни</div>
          <div className="value">{remaining}</div>
        </div>
        <div className="stat-card">
          <div className="label">Използвани</div>
          <div className="value">{currentUser.usedLeaveDays || 0}</div>
        </div>
        <div className="stat-card primary">
          <div className="label">Общо</div>
          <div className="value">{currentUser.totalLeaveDays || 0}</div>
        </div>
      </div>

      {error && <div className="error">{error}</div>}
      {success && <div className="success">{success}</div>}

      <form onSubmit={submit}>
        <div className="form-group">
          <label>Вид отпуск</label>
          <select value={form.type} onChange={e => setForm({...form, type: e.target.value})}>
            {Object.values(leaveTypes).map(t => (
              <option key={t.id} value={t.id}>
                {t.name} {t.deducts ? '(приспада се)' : '(не се приспада)'}
              </option>
            ))}
          </select>
        </div>

        <div className="form-row">
          <div className="form-group">
            <label>Начална дата</label>
            <input type="date" value={form.startDate} onChange={e => setForm({...form, startDate: e.target.value})} required />
          </div>
          <div className="form-group">
            <label>Крайна дата</label>
            <input type="date" value={form.endDate} onChange={e => setForm({...form, endDate: e.target.value})} min={form.startDate} required />
          </div>
        </div>

        {days > 0 && (
          <p className="text-muted">
            Общо дни: <b style={{color:'#f97316'}}>{days}</b>
            {willDeduct && ` • Ще се приспаднат от платения ви отпуск`}
          </p>
        )}

        <div className="form-group mt-2">
          <label>Причина (незадължително)</label>
          <textarea value={form.reason} onChange={e => setForm({...form, reason: e.target.value})} rows="3" />
        </div>

        <button type="submit" className="btn btn-primary" disabled={!canSubmit}>
          Изпрати заявка
        </button>
      </form>
    </div>
  );
}

/* ============ CALENDAR ============ */
function CalendarPage() {
  const { users, currentUser } = useAuth();
  const requests = useFirebaseList('leaveRequests');
  const leaveTypes = useFirebaseObject('leaveTypes') || DEFAULT_LEAVE_TYPES;
  const [month, setMonth] = useState(new Date());
  const [selected, setSelected] = useState(null);

  const year = month.getFullYear();
  const m = month.getMonth();
  const firstDay = new Date(year, m, 1);
  const startWeekday = (firstDay.getDay() + 6) % 7;
  const daysInMonth = new Date(year, m + 1, 0).getDate();

  const days = [];
  for (let i = 0; i < startWeekday; i++) days.push(null);
  for (let d = 1; d <= daysInMonth; d++) days.push(d);

  const dayNames = ['Пн','Вт','Ср','Чт','Пт','Сб','Нд'];
  const getUserName = (id, fallback) => users.find(u => u.id === id)?.fullName || fallback || '?';
  const getType = (id) => leaveTypes[id] || { name: 'Отпуск', color: '#f97316' };

  const getEventsForDay = (day) => {
    if (!day) return [];
    const dateStr = `${year}-${pad(m + 1)}-${pad(day)}`;
    return requests.filter(r => dateStr >= r.startDate && dateStr <= r.endDate);
  };

  const todayStr = todayISO();

  return (
    <div>
      <h2 className="page-title">Календар</h2>
      <p className="page-subtitle">Всички отпуски и отсъствия на компанията</p>

      <div className="card">
        <div className="calendar-header">
          <h3>{monthNames[m]} {year}</h3>
          <div className="calendar-nav">
            <button className="btn btn-secondary btn-sm" onClick={() => setMonth(new Date(year, m - 1, 1))}>←</button>
            <button className="btn btn-secondary btn-sm" onClick={() => setMonth(new Date())}>Днес</button>
            <button className="btn btn-secondary btn-sm" onClick={() => setMonth(new Date(year, m + 1, 1))}>→</button>
          </div>
        </div>
        <div className="calendar-grid">
          {dayNames.map(d => <div key={d} className="calendar-day-name">{d}</div>)}
          {days.map((day, idx) => {
            const dateStr = day ? `${year}-${pad(m + 1)}-${pad(day)}` : '';
            const isToday = dateStr === todayStr;
            const events = getEventsForDay(day);
            return (
              <div key={idx} className={`calendar-day ${!day ? 'empty' : ''} ${isToday ? 'today' : ''}`}>
                {day && <div className="day-num">{day}</div>}
                {events.slice(0, 3).map(e => {
                  const t = getType(e.type);
                  const opacity = e.status === 'pending' ? 0.5 : 1;
                  return (
                    <div
                      key={e.id}
                      className="day-event"
                      style={{background: t.color, opacity}}
                      title={`${getUserName(e.userId, e.userName)} • ${t.name}`}
                      onClick={() => setSelected(e)}
                    >
                      {getUserName(e.userId, e.userName).split(' ')[0]}
                    </div>
                  );
                })}
                {events.length > 3 && <div style={{fontSize:'10px', color:'#9ca3af'}}>+{events.length - 3}</div>}
              </div>
            );
          })}
        </div>

        <div className="mt-2" style={{display:'flex', gap:'16px', flexWrap:'wrap', marginTop:'20px'}}>
          {Object.values(leaveTypes).map(t => (
            <span key={t.id} style={{display:'inline-flex', alignItems:'center', gap:'6px', fontSize:'12px', color:'#9ca3af'}}>
              <span style={{width:'12px', height:'12px', borderRadius:'3px', background:t.color}}></span>
              {t.name}
            </span>
          ))}
          <span style={{display:'inline-flex', alignItems:'center', gap:'6px', fontSize:'12px', color:'#9ca3af'}}>
            <span style={{width:'12px', height:'12px', borderRadius:'3px', background:'#6b7280', opacity:0.5}}></span>
            Прозрачно = чакаща
          </span>
        </div>
      </div>

      {selected && (
        <div className="modal-backdrop" onClick={() => setSelected(null)}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <h3>Заявка за отпуск</h3>
            <p><b>Служител:</b> {getUserName(selected.userId, selected.userName)}</p>
            <p className="mt-2"><b>Вид:</b> <span style={{color: getType(selected.type).color}}>{getType(selected.type).name}</span></p>
            <p><b>От:</b> {formatDate(selected.startDate)}</p>
            <p><b>До:</b> {formatDate(selected.endDate)}</p>
            <p><b>Дни:</b> {selected.days}</p>
            <p><b>Причина:</b> {selected.reason || '-'}</p>
            <p className="mt-2"><b>Статус:</b> <span className={`badge ${selected.status}`}>
              {selected.status === 'pending' ? 'Чакаща' : selected.status === 'approved' ? 'Одобрена' : 'Отхвърлена'}
            </span></p>
            <button className="btn btn-secondary mt-2" onClick={() => setSelected(null)}>Затвори</button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ============ LEAVES REPORTS ============ */
function LeavesReports() {
  const { users } = useAuth();
  const requests = useFirebaseList('leaveRequests');
  const leaveTypes = useFirebaseObject('leaveTypes') || DEFAULT_LEAVE_TYPES;
  const year = new Date().getFullYear();

  const stats = users.map(u => {
    const userReqs = requests.filter(r =>
      r.userId === u.id &&
      r.status === 'approved' &&
      new Date(r.startDate).getFullYear() === year
    );
    const usedDays = userReqs.reduce((sum, r) => {
      const t = leaveTypes[r.type];
      return sum + (t?.deducts ? r.days : 0);
    }, 0);
    return {
      user: u,
      approvedCount: userReqs.length,
      usedDays,
      remaining: (u.totalLeaveDays || 0) - usedDays
    };
  });

  return (
    <div>
      <h2 className="page-title">Справки</h2>
      <p className="page-subtitle">Обобщение на отпуските за {year} г.</p>

      <div className="card">
        <h3>👥 По служители</h3>
        <table>
          <thead>
            <tr><th>Служител</th><th>Одобрени заявки</th><th>Използвани дни</th><th>Общо дни</th><th>Оставащи</th></tr>
          </thead>
          <tbody>
            {stats.map(s => (
              <tr key={s.user.id}>
                <td>{s.user.fullName}</td>
                <td>{s.approvedCount}</td>
                <td>{s.usedDays}</td>
                <td>{s.user.totalLeaveDays || 0}</td>
                <td><b style={{color: s.remaining < 5 ? '#ef4444' : '#22c55e'}}>{s.remaining}</b></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ============ TIME MODULE ============ */
function TimeModule({ scope }) {
  const { currentUser, users } = useAuth();
  const isAdmin = currentUser.role === 'admin';
  const [now, setNow] = useState(Date.now());
  const [entries, setEntries] = useState([]);
  const projects = useFirebaseList('projects');
  const [pendingProject, setPendingProject] = useState(null);
  const [pendingEntryId, setPendingEntryId] = useState(null);

  useEffect(() => {
    const t = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(t);
  }, []);

  useEffect(() => {
    if (!db) return;
    const ref = db.ref('timeEntries');
    const handler = (snap) => {
      const data = snap.val() || {};
      const list = Object.values(data);
      const filtered = scope === 'all' ? list : list.filter(e => e.userId === currentUser.id);
      filtered.sort((a, b) => new Date(b.checkIn) - new Date(a.checkIn));
      setEntries(filtered);
    };
    ref.on('value', handler);
    return () => ref.off('value', handler);
  }, [scope, currentUser.id]);

  const activeEntry = entries.find(e => !e.checkOut && e.userId === currentUser.id);
  const elapsed = activeEntry ? now - new Date(activeEntry.checkIn).getTime() : 0;

  const checkIn = async () => {
    if (activeEntry) return;
    const entry = {
      id: uid(),
      userId: currentUser.id,
      userName: currentUser.fullName,
      checkIn: new Date().toISOString(),
      checkOut: null,
      projectId: null
    };
    await db.ref('timeEntries/' + entry.id).set(entry);
  };

  const checkOut = () => {
    if (!activeEntry) return;
    setPendingEntryId(activeEntry.id);
    setPendingProject(projects[0]?.id || '');
  };

  const confirmCheckout = async () => {
    if (!pendingEntryId) return;
    const proj = projects.find(p => p.id === pendingProject);
    await db.ref('timeEntries/' + pendingEntryId).update({
      checkOut: new Date().toISOString(),
      projectId: pendingProject || null,
      projectName: proj?.name || null
    });
    setPendingEntryId(null);
    setPendingProject(null);
  };

  const cancelCheckout = () => {
    setPendingEntryId(null);
    setPendingProject(null);
  };

  const todayStr = todayISO();
  const todayEntries = entries.filter(e => e.userId === currentUser.id && e.checkIn.startsWith(todayStr));
  const todayTotal = todayEntries.reduce((sum, e) => {
    const start = new Date(e.checkIn).getTime();
    const end = e.checkOut ? new Date(e.checkOut).getTime() : now;
    return sum + (end - start);
  }, 0);

  const getUserName = (id) => users.find(u => u.id === id)?.fullName || '?';

  // Обобщение по проекти
  const projectSummary = useMemo(() => {
    const map = {};
    entries.filter(e => e.checkOut).forEach(e => {
      const key = e.projectId || 'none';
      if (!map[key]) map[key] = { name: e.projectName || 'Без проект', total: 0, count: 0 };
      map[key].total += new Date(e.checkOut) - new Date(e.checkIn);
      map[key].count += 1;
    });
    return Object.values(map).sort((a, b) => b.total - a.total);
  }, [entries]);

  return (
    <div>
      <h2 className="page-title">{scope === 'all' ? 'Отчети за работно време' : 'Моето време'}</h2>
      <p className="page-subtitle">
        {scope === 'all' ? 'Всички служители' : 'Проследяване на работното време'}
      </p>

      {!isAdmin || scope === 'me' ? (
        <div className="card">
          <h3>🕐 Таймер</h3>
          <div className={`clock-display ${activeEntry ? 'working' : ''}`}>
            {activeEntry ? fmtTime(elapsed) : '00:00:00'}
          </div>
          <p className="clock-status">
            {activeEntry
              ? `На работа от ${new Date(activeEntry.checkIn).toLocaleTimeString('bg-BG')}`
              : 'Не сте чекирани'}
          </p>
          <div className="clock-actions">
            <button className="btn btn-success" onClick={checkIn} disabled={!!activeEntry}>✅ Чекиране</button>
            <button className="btn btn-danger" onClick={checkOut} disabled={!activeEntry}>⏹ Приключване</button>
          </div>

          <div style={{padding:'16px', background:'#0f0f12', borderRadius:'10px', border:'1px solid #2a2a33'}}>
            <div className="text-muted">Общо днес:</div>
            <div style={{fontSize:'24px', fontWeight:'700', color:'#22c55e'}}>{fmtTime(todayTotal)}</div>
          </div>
        </div>
      ) : null}

      {scope === 'all' && (
        <div className="card">
          <h3>📊 Обобщение по проекти</h3>
          {projectSummary.length === 0 ? (
            <div className="empty-state">Няма данни</div>
          ) : (
            <table>
              <thead>
                <tr><th>Проект</th><th>Записи</th><th>Общо време</th></tr>
              </thead>
              <tbody>
                {projectSummary.map((p, i) => (
                  <tr key={i}>
                    <td>{p.name}</td>
                    <td>{p.count}</td>
                    <td>{fmtTime(p.total)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      )}

      <div className="card">
        <h3>📋 {scope === 'all' ? 'Всички записи' : 'История'}</h3>
        {entries.length === 0 ? (
          <div className="empty-state">Няма записи</div>
        ) : (
          <table>
            <thead>
              <tr>
                {scope === 'all' && <th>Служител</th>}
                <th>Дата</th><th>Начало</th><th>Край</th><th>Проект</th><th>Продължителност</th>
              </tr>
            </thead>
            <tbody>
              {entries.slice(0, 50).map(e => {
                const start = new Date(e.checkIn);
                const end = e.checkOut ? new Date(e.checkOut) : null;
                const dur = end ? end - start : now - start;
                return (
                  <tr key={e.id}>
                    {scope === 'all' && <td>{getUserName(e.userId) || e.userName}</td>}
                    <td>{start.toLocaleDateString('bg-BG')}</td>
                    <td>{start.toLocaleTimeString('bg-BG')}</td>
                    <td>{end ? end.toLocaleTimeString('bg-BG') : <span className="badge pending">на работа</span>}</td>
                    <td>{e.projectName || '-'}</td>
                    <td>{fmtTime(dur)}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        )}
      </div>

      {pendingEntryId && (
        <div className="modal-backdrop">
          <div className="modal">
            <h3>Приключване на смяна</h3>
            <p className="text-muted" style={{marginBottom:'16px'}}>Изберете проект, по който сте работили</p>
            <div className="form-group">
              <label>Проект</label>
              <select value={pendingProject} onChange={e => setPendingProject(e.target.value)}>
                <option value="">-- Без проект --</option>
                {projects.map(p => (
                  <option key={p.id} value={p.id}>{p.name}</option>
                ))}
              </select>
            </div>
            <div className="flex gap-2">
              <button className="btn btn-primary" onClick={confirmCheckout}>Потвърди</button>
              <button className="btn btn-secondary" onClick={cancelCheckout}>Отказ</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ============ PROJECTS ============ */
function ProjectsPage({ mode }) {
  const { currentUser } = useAuth();
  const projects = useFirebaseList('projects');
  const [form, setForm] = useState({ name: '', description: '', color: '#f97316' });
  const [error, setError] = useState('');
  const [success, setSuccess] = useState('');

  const addProject = async (e) => {
    e.preventDefault();
    setError(''); setSuccess('');
    if (!form.name.trim()) return setError('Въведете име');
    const p = {
      id: uid(),
      name: form.name,
      description: form.description,
      color: form.color,
      createdBy: currentUser.id,
      createdAt: new Date().toISOString()
    };
    await db.ref('projects/' + p.id).set(p);
    setForm({ name: '', description: '', color: '#f97316' });
    setSuccess('✅ Проектът е добавен');
  };

  const deleteProject = async (id) => {
    if (confirm('Сигурни ли сте?')) {
      await db.ref('projects/' + id).remove();
    }
  };

  if (mode === 'new') {
    return (
      <div>
        <h2 className="page-title">Нов проект</h2>
        <p className="page-subtitle">Създайте нов проект за проследяване на време</p>

          <form onSubmit={addProject}>
            <div className="form-group">
              <label>Име на проекта *</label>
              <input value={form.name} onChange={e => setForm({...form, name: e.target.value})} required />
            </div>
            <div className="form-group">
              <label>Описание</label>
              <textarea value={form.description} onChange={e => setForm({...form, description: e.target.value})} rows="3" />
            </div>
            <div className="form-group">
              <label>Цвят</label>
              <div className="color-presets">
                {COLOR_PRESETS.map(c => (
                  <div
                    key={c}
                    className={`color-dot ${form.color === c ? 'selected' : ''}`}
                    style={{background: c}}
                    onClick={() => setForm({...form, color: c})}
                  />
                ))}
              </div>
            </div>
            <button type="submit" className="btn btn-primary">+ Създай проект</button>
          </form>
        </div>
      </div>
    );
  }

  return (
    <div>
      <h2 className="page-title">Проекти</h2>
      <p className="page-subtitle">Всички проекти в системата</p>
      <div className="card">
        {projects.length === 0 ? (
          <div className="empty-state">Няма проекти</div>
        ) : (
          <div className="project-list">
            {projects.map(p => (
              <div key={p.id} className="project-item">
                <div className="project-color" style={{background: p.color || '#f97316'}}></div>
                <div style={{flex:1}}>
                  <div className="project-name">{p.name}</div>
                  {p.description && <div className="project-desc">{p.description}</div>}

                <button className="btn btn-danger btn-sm" onClick={() => deleteProject(p.id)}>🗑️</button>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

              <label style={{fontSize:'13px', color:'#9ca3af', marginBottom:'6px', display:'block'}}>{f.label}</label>
              {editing ? (
                <input
                  type={f.type || 'text'}
                  value={form[f.key] || ''}
                  onChange={e => setForm({...form, [f.key]: e.target.value})}
                  style={{
                    width:'100%', padding:'10px 14px',
                    background:'#0f0f12', border:'1px solid #2a2a33',
                    borderRadius:'8px', color:'#e5e7eb',
                    fontSize:'14px', fontFamily:'inherit'
                  }}
                />
              ) : (
                <div style={{
                  padding:'10px 14px', background:'#0f0f12',
                  borderRadius:'8px', color: form[f.key] ? '#e5e7eb' : '#6b7280',
                  fontSize:'14px'
                }}>
                  {form[f.key] || '-'}
                </div>
              )}
            </div>
          ))}
        </div>

        {editing && (
          <div className="flex gap-2 mt-2">
            <button className="btn btn-primary" onClick={save}>Запази</button>
            <button className="btn btn-secondary" onClick={() => { setForm(company); setEditing(false); }}>Отказ</button>
          </div>
        )}
      </div>
    </div>
  );
}

/* ============ USERS MANAGER ============ */
function UsersManager() {
  const { users, addUser, updateUser, deleteUser, currentUser } = useAuth();
  const [form, setForm] = useState({
    username: '', password: '', fullName: '', email: '',
    role: 'employee', totalLeaveDays: 20
  });
  const [error, setError] = useState('');
  const [success, setSuccess] = useState('');
  const [editingId, setEditingId] = useState(null);
  const [editData, setEditData] = useState({});

  const submit = async (e) => {
    e.preventDefault();
    setError(''); setSuccess('');
    const res = await addUser({ ...form, totalLeaveDays: Number(form.totalLeaveDays) || 20 });
    if (res.error) return setError(res.error);
    setForm({ username: '', password: '', fullName: '', email: '', role: 'employee', totalLeaveDays: 20 });
    setSuccess('✅ Потребителят е добавен');
  };

  const startEdit = (u) => { setEditingId(u.id); setEditData({ ...u }); };

  const saveEdit = async () => {
    await updateUser(editingId, {
      fullName: editData.fullName,
      email: editData.email,
      role: editData.role,
      totalLeaveDays: Number(editData.totalLeaveDays),
      password: editData.password,
      username: editData.username
    });
    setEditingId(null);
  };

  const remove = async (id) => {
    if (id === currentUser.id) return alert('Не можете да изтриете себе си');
    if (confirm('Сигурни ли сте?')) await deleteUser(id);
  };

  return (
    <div>
      <h2 className="page-title">Потребители</h2>
      <p className="page-subtitle">Управление на потребители и роли</p>

      <div className="card">
        <h3>➕ Нов потребител</h3>
        {error && <div className="error">{error}</div>}
        {success && <div className="success">{success}</div>}
        <form onSubmit={submit}>
          <div className="form-row">
            <div className="form-group">
              <label>Потребителско име *</label>
              <input value={form.username} onChange={e => setForm({...form, username: e.target.value})} required />
            </div>
            <div className="form-group">
              <label>Парола *</label>
              <input value={form.password} onChange={e => setForm({...form, password: e.target.value})} required />
            </div>
          </div>
          <div className="form-row">
            <div className="form-group">
              <label>Пълно име *</label>
              <input value={form.fullName} onChange={e => setForm({...form, fullName: e.target.value})} required />
            </div>
            <div className="form-group">
              <label>Email *</label>
              <input type="email" value={form.email} onChange={e => setForm({...form, email: e.target.value})} required />
            </div>
          </div>
          <div className="form-row">
            <div className="form-group">
              <label>Роля</label>
              <select value={form.role} onChange={e => setForm({...form, role: e.target.value})}>
                <option value="employee">Служител</option>
                <option value="admin">Администратор</option>
              </select>
            </div>
            <div className="form-group">
              <label>Годишен отпуск (дни)</label>
              <input type="number" value={form.totalLeaveDays} onChange={e => setForm({...form, totalLeaveDays: e.target.value})} />
            </div>
          </div>
          <button type="submit" className="btn btn-primary">+ Добави</button>
        </form>
      </div>

      <div className="card">
        <h3>👥 Всички потребители ({users.length})</h3>
        <table>
          <thead>
            <tr><th>Име</th><th>Потребител</th><th>Парола</th><th>Email</th><th>Роля</th><th>Отпуск</th><th>Действия</th></tr>
          </thead>
          <tbody>
            {users.map(u => editingId === u.id ? (
              <tr key={u.id}>
                <td><input value={editData.fullName} onChange={e => setEditData({...editData, fullName: e.target.value})} style={{width:'130px'}} /></td>
                <td><input value={editData.username} onChange={e => setEditData({...editData, username: e.target.value})} style={{width:'100px'}} /></td>
                <td><input value={editData.password} onChange={e => setEditData({...editData, password: e.target.value})} style={{width:'100px'}} /></td>
                <td><input value={editData.email} onChange={e => setEditData({...editData, email: e.target.value})} style={{width:'150px'}} /></td>
                <td>
                  <select value={editData.role} onChange={e => setEditData({...editData, role: e.target.value})}>
                    <option value="employee">Служител</option>
                    <option value="admin">Админ</option>
                  </select>
                </td>
                <td><input type="number" style={{width:'60px'}} value={editData.totalLeaveDays} onChange={e => setEditData({...editData, totalLeaveDays: e.target.value})} /></td>
                <td>
                  <button className="btn btn-success btn-sm" onClick={saveEdit}>Запази</button>
                  <button className="btn btn-secondary btn-sm" style={{marginLeft:'4px'}} onClick={() => setEditingId(null)}>Отказ</button>
                </td>
              </tr>
            ) : (
              <tr key={u.id}>
                <td>{u.fullName}</td>
                <td><code>{u.username}</code></td>
                <td><code>{u.password}</code></td>
                <td>{u.email}</td>
                <td><span className="badge pending">{u.role === 'admin' ? 'Админ' : 'Служител'}</span></td>
                <td>{u.usedLeaveDays || 0} / {u.totalLeaveDays}</td>
                <td>
                  <button className="btn btn-secondary btn-sm" onClick={() => startEdit(u)}>✏️</button>
                  <button className="btn btn-danger btn-sm" style={{marginLeft:'4px'}} onClick={() => remove(u.id)}>🗑️</button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ============ LEAVE TYPES (SETTINGS) ============ */
function LeaveTypesSettings() {
  const leaveTypes = useFirebaseObject('leaveTypes') || {};
  const [form, setForm] = useState({ name: '', color: '#f97316', deducts: true });
  const [editingId, setEditingId] = useState(null);
  const [editData, setEditData] = useState({});

  const addType = async (e) => {
    e.preventDefault();
    if (!form.name.trim()) return;
    const id = uid();
    await db.ref('leaveTypes/' + id).set({ id, ...form });
    setForm({ name: '', color: '#f97316', deducts: true });
  };

  const startEdit = (t) => { setEditingId(t.id); setEditData({...t}); };
  const saveEdit = async () => {
    await db.ref('leaveTypes/' + editingId).update({
      name: editData.name,
      color: editData.color,
      deducts: editData.deducts
    });
    setEditingId(null);
  };
  const remove = async (id) => {
    if (confirm('Сигурни ли сте?')) await db.ref('leaveTypes/' + id).remove();
  };

  return (
    <div>
      <h2 className="page-title">Видове отпуски</h2>
      <p className="page-subtitle">Дефинирайте видове отсъствия, цветове и приспадане</p>

      <div className="card">
        <h3>➕ Нов вид отпуск</h3>
        <form onSubmit={addType}>
          <div className="form-row">
            <div className="form-group">
              <label>Име *</label>
              <input value={form.name} onChange={e => setForm({...form, name: e.target.value})} placeholder="напр. Платен отпуск" required />
            </div>
            <div className="form-group">
              <label>Приспада се от платения отпуск?</label>
              <select value={form.deducts ? 'yes' : 'no'} onChange={e => setForm({...form, deducts: e.target.value === 'yes'})}>
                <option value="yes">Да</option>
                <option value="no">Не</option>
              </select>
            </div>
          </div>
          <div className="form-group">
            <label>Цвят в календара</label>
            <div className="color-presets">
              {COLOR_PRESETS.map(c => (
                <div
                  key={c}
                  className={`color-dot ${form.color === c ? 'selected' : ''}`}
                  style={{background: c}}
                  onClick={() => setForm({...form, color: c})}
                />
              ))}
            </div>
          </div>
          <button type="submit" className="btn btn-primary">+ Добави вид</button>
        </form>
      </div>

      <div className="card">
        <h3>📋 Всички видове ({Object.keys(leaveTypes).length})</h3>
        {Object.keys(leaveTypes).length === 0 ? (
          <div className="empty-state">Няма добавени видове</div>
        ) : (
          <table>
            <thead>
              <tr><th>Цвят</th><th>Име</th><th>Приспада се</th><th>Действия</th></tr>
            </thead>
            <tbody>
              {Object.values(leaveTypes).map(t => editingId === t.id ? (
                <tr key={t.id}>
                  <td>
                    <div className="color-presets">
                      {COLOR_PRESETS.map(c => (
                        <div
                          key={c}
                          className={`color-dot ${editData.color === c ? 'selected' : ''}`}
                          style={{background: c, width:'24px', height:'24px'}}
                          onClick={() => setEditData({...editData, color: c})}
                        />
                      ))}
                    </div>
                  </td>
                  <td><input value={editData.name} onChange={e => setEditData({...editData, name: e.target.value})} /></td>
                  <td>
                    <select value={editData.deducts ? 'yes' : 'no'} onChange={e => setEditData({...editData, deducts: e.target.value === 'yes'})}>
                      <option value="yes">Да</option>
                      <option value="no">Не</option>
                    </select>
                  </td>
                  <td>
                    <button className="btn btn-success btn-sm" onClick={saveEdit}>Запази</button>
                    <button className="btn btn-secondary btn-sm" style={{marginLeft:'4px'}} onClick={() => setEditingId(null)}>Отказ</button>
                  </td>
                </tr>
              ) : (
                <tr key={t.id}>
                  <td>
                    <div style={{width:'24px', height:'24px', borderRadius:'6px', background:t.color}}></div>
                  </td>
                  <td>{t.name}</td>
                  <td>{t.deducts ? '✅ Да' : '❌ Не'}</td>
                  <td>
                    <button className="btn btn-secondary btn-sm" onClick={() => startEdit(t)}>✏️</button>
                    <button className="btn btn-danger btn-sm" style={{marginLeft:'4px'}} onClick={() => remove(t.id)}>🗑️</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>
    </div>
  );
}

/* ============ APP ============ */
function App() {
  const { currentUser, loading } = useAuth();
  const [page, setPage] = useState('dashboard');

  if (loading) {
    return (
      <div className="login-wrap">
        <div className="login-card" style={{textAlign:'center'}}>
          <h1>⏰ Clocky</h1>
          <div className="spinner" style={{marginTop:'24px'}}></div>
          <p className="text-muted mt-2">Зареждане...</p>
        </div>
      </div>
    );
  }

  if (!currentUser) return <Login />;

  const isAdmin = currentUser.role === 'admin';

  const renderPage = () => {
    switch (page) {
      case 'dashboard': return <Dashboard onNavigate={setPage} />;
      case 'leaves-dashboard': return <Dashboard onNavigate={setPage} />;
      case 'leaves-my': return <MyRequests />;
      case 'leaves-requests': return <LeaveRequestsPage />;
      case 'leaves-calendar': return <CalendarPage />;
      case 'leaves-reports': return <LeavesReports />;
      case 'absences-all': return <AbsencesPage scope="all" />;
      case 'absences-mine': return <AbsencesPage scope="mine" />;
      case 'time-me': return <TimeModule scope="me" />;
      case 'time-reports': return <TimeModule scope={isAdmin ? 'all' : 'me'} />;
      case 'projects-list': return <ProjectsPage mode="list" />;
      case 'projects-new': return <ProjectsPage mode="new" />;
      case 'company-data': return <CompanyPage />;
      case 'settings-users': return isAdmin ? <UsersManager /> : <Dashboard onNavigate={setPage} />;
      case 'settings-leavetypes': return isAdmin ? <LeaveTypesSettings /> : <Dashboard onNavigate={setPage} />;
      default: return <Dashboard onNavigate={setPage} />;
    }
  };

  return (
    <div className="app-layout">
      <Sidebar currentPage={page} onNavigate={setPage} />
      <main className="main-content">
        {renderPage()}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <AuthProvider>
    <App />
  </AuthProvider>
);
</script>
</body>
